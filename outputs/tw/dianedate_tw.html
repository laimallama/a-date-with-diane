<!doctype html>
<html lang="zh-TW">
  <head>
    <title>與黛安約會</title>
    <meta charset="UTF-8" />

    <style>
      :root { --cjk-font: "PingFang TC", "Heiti TC", "Microsoft JhengHei", "Noto Sans CJK TC", Arial, Helvetica, sans-serif; }
:root {
  color-scheme: light;
  --paper: #fffaf2;
  --ink: #231f20;
  --muted: #71675c;
  --line: #dfd1bd;
  --accent: #9b2f3f;
  --accent-dark: #6f1f2c;
  --accent-strong: #6f1f2c;
  --on-accent: #ffffff;
  --choice: #fff;
  --choice-hover: #fff3df;
  --guide-hover-bg: #fff3df;
  --status: #f1e7d8;
  --hover-border: #c59c73;
  --highlight-bg: #f7e2e5;
  --ink-on-hover: #231f20;
  --em-color: #6f4a58;
  --box-shadow: 0 18px 50px rgba(59, 43, 25, 0.14);
  --box-shadow-mobile: 0 10px 28px rgba(59, 43, 25, 0.1);
  --body-bg-wash: #f5eee5;
  --overlay-scrim: rgba(35, 31, 32, 0.55);
  --body-font: var(--cjk-font);
  --ui-font: var(--cjk-font);
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #221c17;
  --ink: #ede3d3;
  --muted: #9b9289;
  --line: #3c2f26;
  --accent: #f0d060;
  --accent-dark: #f0d060;
  --accent-strong: #f6e48a;
  --on-accent: #221c17;
  --choice: #2b241e;
  --choice-hover: #534433;
  --guide-hover-bg: #5f4c32;
  --status: #2f2822;
  --hover-border: #c9a94a;
  --highlight-bg: #4a4024;
  --ink-on-hover: #faf6ee;
  --em-color: #e2c878;
  --box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
  --box-shadow-mobile: 0 10px 28px rgba(0, 0, 0, 0.4);
  --body-bg-wash: #120f0c;
  --overlay-scrim: rgba(0, 0, 0, 0.7);
}

* {
  box-sizing: border-box;
}

html {
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
  background: var(--body-bg-wash);
}

body {
  margin: 0;
  min-height: 100vh;
  color: var(--ink);
  background: var(--body-bg-wash);
  font-family: var(--body-font);
  font-size: 18px;
  line-height: 1.58;
}

a {
  color: inherit;
}
a:hover {
  color: var(--accent-dark);
}

.game-shell {
  width: min(920px, calc(100% - 32px));
  margin: 0 auto;
  padding: 36px 0;
}

#box {
  width: 100%;
  overflow-wrap: break-word;
  padding: clamp(22px, 4vw, 44px);
  border: 1px solid var(--line);
  background: var(--paper);
  box-shadow: var(--box-shadow);
  text-size-adjust: 100%;
  -webkit-text-size-adjust: 100%;
}

#box p {
  font-size: 1em;
  margin: 0 0 1em;
}

#box p.notice {
  margin: 0 0 1em;
}

/* Mid-page points notices: same rhythm as story paragraphs */
#box p:has(+ p.notice) {
  margin-bottom: 1em;
}

#box p.ending-congrats {
  margin: 0.25rem 0 1em;
  color: var(--accent-dark);
  font-size: clamp(1.25rem, 3vw, 1.65rem);
  line-height: 1.25;
}

#box p.note-lead,
#box p.note-keys {
  margin: 0 0 0.5em;
  line-height: 1.45;
}

#box p.note-keys:last-of-type {
  margin-bottom: 1em;
}

#box p.venue-note {
  margin: 0.35rem 0 0.4rem;
  color: var(--accent-dark);
  font-family: var(--ui-font);
  font-size: 1.06em;
  font-weight: 600;
  line-height: 1.4;
}

#box p.venue-note strong,
#box p.venue-note b {
  color: inherit;
  font-weight: 600;
}

#box hr {
  height: 1px;
  margin: 1.35rem 0;
  border: 0;
  background: var(--line);
}

#box h1,
#box h2 {
  margin: 0.2rem 0 1rem;
  color: var(--accent-dark);
  font-family: var(--ui-font);
  letter-spacing: 0;
}

#box h1 {
  font-size: clamp(1.8rem, 4vw, 2.75rem);
}
#box h1.game-title {
  font-family: var(--body-font);
}
#box h2 {
  font-size: clamp(1.25rem, 3vw, 1.85rem);
}

#box div[align="center"],
#box .center {
  text-align: left;
}

#box span[style] {
  background: transparent !important;
  color: inherit !important;
}

#box em {
  color: var(--em-color);
}

#box strong,
#box b {
  color: var(--accent-dark);
}

#box ul,
#box .choices {
  margin: 1.45rem 0 0;
  padding: 0;
  list-style: none;
}

.choice + .choice {
  margin-top: 10px;
}

/* Screen fade on step change */
@keyframes diane-screen-fade {
  from {
    opacity: 0.42;
  }
  to {
    opacity: 1;
  }
}
#box.screen-fade {
  animation: diane-screen-fade 0.18s ease-out;
}
@media (prefers-reduced-motion: reduce) {
  html {
    scroll-behavior: auto;
  }
  #box.screen-fade {
    animation: none !important;
  }
  .gallery-overlay,
  .gallery-panel {
    transition: none !important;
  }
}

#box li {
  margin: 0;
  padding: 0;
  list-style: none;
}

#box li::marker {
  content: "";
}

#box li a,
.choice,
.back-button {
  display: block;
  width: 100%;
  min-height: 44px;
  padding: 11px 14px;
  border: 1px solid var(--line);
  border-radius: 6px;
  color: var(--ink);
  background: var(--choice);
  font-family: var(--ui-font);
  font-size: 1rem;
  line-height: 1.35;
  text-align: left;
  text-decoration: none;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

.choice.key-pressed {
  border-color: var(--hover-border);
  background: var(--choice-hover);
  color: var(--ink-on-hover);
}

@media (hover: hover) and (pointer: fine) {
  #box:not(.choice-key-armed) li a:hover,
  #box:not(.choice-key-armed) .choice:hover {
    border-color: var(--hover-border);
    background: var(--choice-hover);
    color: var(--ink-on-hover);
  }
  /* Guide pick: keep accent inset; fill uses --guide-hover-bg (dark: step off gold tray, not into ink range) */
  #box:not(.choice-key-armed) .choice.guide-highlight:hover {
    border-color: var(--hover-border);
    background: var(--guide-hover-bg);
    color: var(--ink-on-hover);
  }
}

.status-bar {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
  gap: 8px;
  margin-top: 24px;
  padding: 12px;
  border: 1px solid var(--line);
  background: var(--status);
  font-family: var(--ui-font);
  font-size: 0.92rem;
}

.status-bar span {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  color: var(--muted);
}

.status-bar b {
  color: var(--ink);
}

.nav-row {
  margin-top: 24px;
}

.back-button {
  width: auto;
  min-width: 120px;
  color: var(--on-accent);
  background: var(--accent);
  border-color: var(--accent);
  text-align: center;
}

@media (hover: hover) and (pointer: fine) {
  .back-button:hover {
    color: var(--on-accent);
    background: var(--accent-strong);
    border-color: var(--accent-strong);
  }
}

@media (max-width: 640px) {
  body {
    font-size: 16px;
  }
  .game-shell {
    width: 100%;
    padding: 10px 12px 16px;
  }
  #box {
    box-shadow: var(--box-shadow-mobile);
  }
}
.status-bar {
  display: block;
}

.status-row {
  display: grid;
  gap: 8px;
}

.status-row-main {
  grid-template-columns: repeat(3, minmax(0, 1fr));
}

.status-row-money {
  grid-template-columns: repeat(3, minmax(0, 1fr));
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px solid var(--line);
}

@media (max-width: 520px) {
  .status-bar {
    padding: 10px 10px;
    font-size: 0.78rem;
  }
  .status-row {
    gap: 6px;
  }
  .status-bar span {
    min-width: 0;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    text-align: center;
    overflow-wrap: break-word;
    word-break: keep-all;
  }
}

.game-toolbar {
  display: flex;
  justify-content: flex-start;
  gap: 10px;
  margin-bottom: 16px;
}

@media (max-width: 640px) {
  .game-toolbar {
    padding: 0;
    margin-bottom: 10px;
    align-items: center;
    flex-wrap: wrap;
  }
  .theme-toggle-button {
    min-width: 0;
    height: 44px;
    min-height: 44px;
    padding: 8px 10px;
    font-size: 0.78rem;
    line-height: 1.15;
    white-space: nowrap;
  }
}

.choice.guide-highlight {
  border-color: var(--accent);
  box-shadow: 0 0 0 2px var(--accent) inset;
  background: var(--highlight-bg);
}

.choice.guide-highlight.key-pressed {
  border-color: var(--hover-border);
  background: var(--guide-hover-bg);
  color: var(--ink-on-hover);
}

.gallery-button {
  flex: 0 0 auto;
  min-width: 94px;
  padding: 9px 12px;
  border: 1px solid var(--accent);
  border-radius: 6px;
  color: var(--on-accent);
  background: var(--accent);
  font-family: var(--ui-font);
  font-size: 0.94rem;
  cursor: pointer;
}
.gallery-button:hover {
  background: var(--accent-strong);
  border-color: var(--accent-strong);
}

.gallery-overlay {
  position: fixed;
  inset: 0;
  background: var(--overlay-scrim);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s ease;
  z-index: 50;
}
.gallery-overlay.open {
  opacity: 1;
  pointer-events: auto;
}
.gallery-panel {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 8px;
  width: 100%;
  max-width: 560px;
  max-height: 82vh;
  display: flex;
  flex-direction: column;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
  transform: translateY(14px) scale(0.98);
  transition: transform 0.25s ease;
}
.gallery-overlay.open .gallery-panel {
  transform: translateY(0) scale(1);
}
.gallery-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px 20px 12px;
  border-bottom: 1px solid var(--line);
}
.gallery-header h2 {
  margin: 0;
  font-size: 1.2rem;
  font-family: var(--ui-font);
}
.gallery-close {
  border: 1px solid var(--line);
  background: var(--choice);
  color: var(--ink);
  border-radius: 6px;
  min-height: 44px;
  padding: 10px 12px;
  font-family: var(--ui-font);
  cursor: pointer;
  touch-action: manipulation;
}
.gallery-close:hover {
  border-color: var(--hover-border);
  background: var(--choice-hover);
}
.gallery-scroll {
  overflow-y: auto;
  padding: 4px 20px 20px;
}
.gallery-section h3 {
  margin: 16px 0 6px;
  font-size: 0.95rem;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.04em;
  font-family: var(--ui-font);
}
.gallery-list {
  display: flex;
  flex-direction: column;
}
.gallery-list {
  --gallery-num-w: 1.85rem;
  --gallery-num-gap: 0.35rem;
}
.gallery-row {
  -webkit-appearance: none;
  appearance: none;
  display: grid;
  grid-template-columns: var(--gallery-num-w) minmax(0, 1fr) auto;
  column-gap: var(--gallery-num-gap);
  align-items: center;
  width: 100%;
  min-height: 44px;
  text-align: left;
  background: none;
  border: none;
  border-bottom: 1px solid var(--line);
  padding: 0 4px 0 2px;
  line-height: 1.3;
  font-family: var(--ui-font);
  font-size: 0.95rem;
  color: var(--ink);
  cursor: pointer;
  touch-action: manipulation;
}
.gallery-index {
  width: var(--gallery-num-w);
  text-align: right;
  font-variant-numeric: tabular-nums;
  color: inherit;
  line-height: inherit;
}
.gallery-title {
  min-width: 0;
  color: inherit;
  line-height: inherit;
}
.gallery-list > .gallery-row:last-child,
.gallery-list > .gallery-group:last-child > .gallery-row {
  border-bottom: none;
}
.gallery-list > .gallery-group:last-child > .gallery-group-toggle.gallery-group-open {
  border-bottom: 1px solid var(--line);
}
.gallery-list > .gallery-group:last-child .gallery-variants:not([hidden]) .gallery-row:last-child {
  border-bottom: none;
}
.gallery-row:hover {
  background: var(--choice-hover);
  color: var(--accent);
}
.gallery-row:focus {
  outline: none;
}
.gallery-row:focus-visible {
  background: var(--choice-hover);
  color: var(--accent);
}
.gallery-group-toggle::after {
  content: "▸";
  opacity: 0.55;
}
.gallery-group-toggle.gallery-group-open::after {
  content: "▾";
}
.gallery-variants {
  margin: 0 0 4px 0;
}
.gallery-variant {
  font-size: 0.9rem;
}

.guide-toggle-button {
  width: auto;
  min-width: 120px;
  padding: 11px 14px;
  border: 1px solid var(--accent);
  border-radius: 6px;
  font-family: var(--ui-font);
  font-size: 1rem;
  text-align: center;
  cursor: pointer;
}
.guide-toggle-on {
  background: var(--choice);
  color: var(--accent-dark);
}
.guide-toggle-off {
  background: transparent;
  color: var(--muted);
  border-color: var(--line);
}
.guide-toggle-button:hover {
  color: var(--ink-on-hover);
  background: var(--choice-hover);
  border-color: var(--accent-dark);
}

.climax-skip-button {
  width: auto;
  min-width: 140px;
  padding: 11px 14px;
  border: 1px solid var(--accent);
  border-radius: 6px;
  font-family: var(--ui-font);
  font-size: 1rem;
  text-align: center;
  cursor: pointer;
  background: var(--choice);
  color: var(--accent-dark);
}

.climax-skip-button:hover {
  background: var(--choice-hover);
  border-color: var(--accent-dark);
}

.theme-toggle-button {
  width: auto;
  min-width: 0;
  margin-left: auto;
  padding: 9px 12px;
  border: 1px solid var(--accent);
  border-radius: 6px;
  font-family: var(--ui-font);
  font-size: 0.94rem;
  text-align: center;
  cursor: pointer;
  background: transparent;
  color: var(--muted);
}

.theme-toggle-on {
  background: var(--choice);
  color: var(--accent-dark);
}

.theme-toggle-off {
  background: transparent;
  color: var(--muted);
  border-color: var(--line);
}

@media (hover: hover) and (pointer: fine) {
  .theme-toggle-button:hover {
    color: var(--ink-on-hover);
    background: var(--choice-hover);
    border-color: var(--accent-dark);
  }
}

.nav-row {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

/* Matched control sizing only (colors stay as each button already defines) */
.gallery-button,
.language-toggle,
.back-button,
.guide-toggle-button,
.climax-skip-button,
.theme-toggle-button {
  box-sizing: border-box;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  min-height: 44px;
  padding: 10px 14px;
  font-size: 1rem;
  line-height: 1.25;
  touch-action: manipulation;
}
@media (max-width: 640px) {
  .theme-toggle-button {
    min-width: 0;
    height: 44px;
    min-height: 44px;
    padding: 8px 10px;
    font-size: 0.78rem;
    line-height: 1.15;
    white-space: nowrap;
  }
}

button:focus,
.choice:focus,
.back-button:focus,
.gallery-button:focus,
.language-toggle:focus,
.guide-toggle-button:focus,
.climax-skip-button:focus,
.theme-toggle-button:focus {
  outline: none;
}

/* Restore a visible keyboard focus indicator after the pointer-focus reset. */
button:focus-visible,
button[class]:focus-visible,
a[href]:focus-visible,
[tabindex]:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
}

function storytime() {
  if (tiramisu) {
    s(
      "<p>黛安：嗯，上大學的時候，我常和朋友進城玩，會喝點酒。然後我坐公車回家，到站下車的時候往往就很想去廁所。這倒也還好，因為只有半英里的路要走。但有一天，天氣特別冷，那股寒意像是直往膀胱裡鑽。我當時憋得難受極了，偏偏還在車上碰到了一個學校認識的男生。他一路上和我聊天，還要陪我走回家。我挺喜歡他的，但那一刻真的不是時候。要是獨自一人，我早就躲進路邊草叢裡撒尿了，可有他在場根本不行。我那會兒難受極了。</p>",
    );
  } else if (pannacotta) {
    s(
      "<p>黛安：記憶里最難熬的一次，是幾年前跟家人去拜訪朋友。那裡有個比我大幾歲的男生，我當時有點崇拜他。他把我帶到另一個房間教我下西洋棋。問題是，午飯喝了些蘋果酒，我憋得要死，特別想上廁所，又不知道怎麼開口。我坐在那裡不停扭動，裙子一直往上爬，我能感覺到他在看我，這讓我更加窘迫。</p>",
    );
    s("<p>你：也許這反而讓他更興奮了？</p>");
    s("<p>黛安：我有時候也會這麼想。總之——</p>");
  } else if (icecream) {
    s(
      "<p>黛安：十八歲那年，大學第一年，新生週，大家都出去喝酒。我那時候不太能喝，我們喝了不少，還有啤酒。回家路上我憋得快炸了，完全不知道該怎麼辦。</p>",
    );
    s("<p>你：你忍住了嗎？</p>");
  } else {
    s(
      "<p>黛安：幾個月前，我和三個好姊妹去荷蘭參加一場單身派對。我們喝了不少，正走路回酒店。大家都想上廁所，但其中一個朋友真的快忍不住了。我們看到對面有個廁所，結果是男廁，裡面全是小便斗。不管了，琳達已經憋到了極限，她說「將就一下吧」，乾脆把內褲撥到一邊，在小便斗裡尿了。我們笑得東倒西歪，另外兩個女生也跟著去了。我這時候也尿急得難受，真的很想去，但問題是我穿的是長褲。</p>",
    );
    s("<p>你：那有什麼關係？</p>");
  }
}
