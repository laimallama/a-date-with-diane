<div class="visual-app">
  <header class="visual-rail">
    <span class="brand" id="railBrand">A Date with Diane</span>
    <div class="rail-end">
      <button
        id="skipBtn"
        class="climax-skip-button"
        onclick="skipToClimax()"
        type="button"
        style="display:none"
        >Skip</button
      >
      {{languageButton}}
      <button
        id="visualGuide"
        class="theme-toggle-button visual-guide-button"
        onclick="toggleGuideDisplay()"
        type="button"
        style="display:none"
      ></button>
      <button id="galleryToggle" class="gallery-button" onclick="openGallery()" type="button"
        >Gallery</button
      >
      <button
        id="themeToggle"
        class="theme-toggle-button theme-toggle-off"
        onclick="toggleTheme()"
        type="button"
        >Dark Mode: Off</button
      >
      <button
        type="button"
        class="theme-toggle-button theme-toggle-off"
        id="backBtn"
        onclick="goback()"
        style="display:none"
        >Back</button
      >
    </div>
  </header>
  <div class="visual-main">
    <section class="visual-panel visual-story-col">
      <div class="visual-kicker"><strong data-visual-text="story">Story</strong></div>
      <div id="gameToolbar" class="game-toolbar" style="display:none"></div>
      <div id="box" aria-live="polite" aria-atomic="true"></div>
    </section>
    <aside class="visual-panel visual-stage-col">
      <div class="visual-kicker">
        <strong id="focusLabel">Diane</strong>
        <span id="locLabel" class="muted"></span>
      </div>
      <div class="visual-stage" id="visualStage" data-location="title">
        <div class="stage-band" id="stageBand">Comfortable</div>
        <div class="stage-rec" id="stageRec" hidden aria-hidden="true"
          ><span class="rec-dot" aria-hidden="true"></span>REC</div
        >
        <div class="stage-puddle" id="stagePuddle" aria-hidden="true"></div>
        <div class="stage-cast" id="stageCast"></div>
      </div>

      <div class="visual-meters" id="visualMeters">
        <div class="vessels">
          <span class="tank-name tummy-label" id="tummy-label" tabindex="0" data-visual-text="tummy"
            >Tummy</span
          >
          <span class="tank-name blad-label" id="blad-label" tabindex="0" data-visual-text="bladder"
            >Bladder</span
          >
          <div class="organ tummy" id="carafe" tabindex="0">
            <svg viewBox="0 0 100 86" aria-hidden="true" preserveAspectRatio="xMidYMid meet">
              <defs>
                <path
                  id="tummyPath"
                  d="M22 28 C18 14 28 6 42 8 C58 10 72 8 82 18 C92 28 90 44 80 54 C70 64 58 72 48 78 C36 84 24 78 20 64 C16 50 26 40 22 28Z"
                />
                <clipPath id="tummyClip"><use href="#tummyPath" /></clipPath>
                <radialGradient id="tummyWall" cx="36%" cy="30%" r="70%">
                  <stop offset="0%" stop-color="#fcf6f0" />
                  <stop offset="40%" stop-color="#f0e0d4" />
                  <stop offset="100%" stop-color="#cbb4a4" />
                </radialGradient>
                <radialGradient id="tummyChyme" cx="46%" cy="55%" r="62%">
                  <stop offset="0%" stop-color="#d9a48c" />
                  <stop offset="50%" stop-color="#c4896e" />
                  <stop offset="100%" stop-color="#a87058" />
                </radialGradient>
                <radialGradient id="tummyShade" cx="40%" cy="28%" r="75%">
                  <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22" />
                  <stop offset="35%" stop-color="#ffffff" stop-opacity="0" />
                  <stop offset="70%" stop-color="#8a6550" stop-opacity="0" />
                  <stop offset="100%" stop-color="#4a3028" stop-opacity="0.32" />
                </radialGradient>
              </defs>
              <use href="#tummyPath" class="cavity" />
              <g clip-path="url(#tummyClip)">
                <rect
                  class="fill-shape"
                  id="tummy-fill-rect"
                  x="0"
                  y="0"
                  width="100"
                  height="86"
                  style="transform: scaleY(0.4)"
                />
              </g>
              <use href="#tummyPath" class="shade" />
              <use href="#tummyPath" class="outline" />
            </svg>
          </div>
          <div class="drip-col" id="drip-col" aria-hidden="true"></div>
          <div class="organ blad" id="vessel" tabindex="0">
            <svg viewBox="0 0 120 96" aria-hidden="true" preserveAspectRatio="xMidYMid meet">
              <defs>
                <path
                  id="bladPath"
                  d="M60 12 C86 12 106 30 108 50 C110 66 98 78 82 84 C74 88 68 90 64 94 C62 96 58 96 56 94 C52 90 46 88 38 84 C22 78 10 66 12 50 C14 30 34 12 60 12Z"
                />
                <clipPath id="bladClip"><use href="#bladPath" /></clipPath>
                <radialGradient id="bladWall" cx="36%" cy="30%" r="70%">
                  <stop offset="0%" stop-color="#fcf6f0" />
                  <stop offset="40%" stop-color="#f0e0d4" />
                  <stop offset="100%" stop-color="#cbb4a4" />
                </radialGradient>
                <radialGradient id="bladUrine" cx="48%" cy="55%" r="60%">
                  <stop id="blad-stop-lit" offset="0%" stop-color="#f8ecc0" />
                  <stop id="blad-stop-mid" offset="45%" stop-color="#f2dc7a" />
                  <stop id="blad-stop-deep" offset="100%" stop-color="#e0c050" />
                </radialGradient>
                <radialGradient id="bladShade" cx="40%" cy="28%" r="75%">
                  <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22" />
                  <stop offset="35%" stop-color="#ffffff" stop-opacity="0" />
                  <stop offset="70%" stop-color="#8a6550" stop-opacity="0" />
                  <stop offset="100%" stop-color="#4a3028" stop-opacity="0.32" />
                </radialGradient>
              </defs>
              <use href="#bladPath" class="cavity" />
              <g clip-path="url(#bladClip)">
                <rect
                  class="fill-shape"
                  id="blad-fill-rect"
                  x="0"
                  y="0"
                  width="120"
                  height="96"
                  style="transform: scaleY(0.35)"
                />
              </g>
              <use href="#bladPath" class="shade" />
              <use href="#bladPath" class="outline" />
            </svg>
          </div>
        </div>
        <div class="bars">
          <div class="bar-row">
            <span data-visual-text="intimacy">Intimacy</span>
            <div class="bar-track"><div class="bar-fill" id="inti-fill"></div></div>
            <b id="inti-n">20</b>
          </div>
          <div class="bar-row shy">
            <span data-visual-text="shyness">Shyness</span>
            <div class="bar-track"><div class="bar-fill" id="shy-fill"></div></div>
            <b id="shy-n">20</b>
          </div>
        </div>
        <div class="footer-stats">
          <span class="luck-label" data-visual-text="luckshots">Luckshots</span>
          <span class="coins" id="coins"></span>
          <span class="pounds"
            ><span id="currencyPrefix">£ </span><strong id="pounds">100</strong
            ><span id="currencySuffix"></span
          ></span>
        </div>
      </div>
    </aside>
  </div>
</div>
