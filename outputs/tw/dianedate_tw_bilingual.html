<!doctype html>
<html lang="zh-TW">

    <style>
      :root { --cjk-font: "PingFang TC", "Heiti TC", "Microsoft JhengHei", "Noto Sans CJK TC", Arial, Helvetica, sans-serif; }
:root {
  color-scheme: light;
  --paper: #fffaf2;
  --ink: #231f20;
  --muted: #71675c;
  --line: #dfd1bd;
  --accent: #9b2f3f;
  --accent-dark: #6f1f2c;
  --accent-strong: #6f1f2c;
  --on-accent: #ffffff;
  --choice: #fff;
  --choice-hover: #fff3df;
  --guide-hover-bg: #fff3df;
  --status: #f1e7d8;
  --hover-border: #c59c73;
  --highlight-bg: #f7e2e5;
  --ink-on-hover: #231f20;
  --em-color: #6f4a58;
  --box-shadow: 0 18px 50px rgba(59, 43, 25, 0.14);
  --box-shadow-mobile: 0 10px 28px rgba(59, 43, 25, 0.1);
  --body-bg-wash: #f5eee5;
  --overlay-scrim: rgba(35, 31, 32, 0.55);
  --body-font: var(--cjk-font);
  --ui-font: var(--cjk-font);
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #221c17;
  --ink: #ede3d3;
  --muted: #948b82;
  --line: #3c2f26;
  --accent: #f0d060;
  --accent-dark: #f0d060;
  --accent-strong: #f6e48a;
  --on-accent: #221c17;
  --choice: #2b241e;
  --choice-hover: #534433;
  --guide-hover-bg: #5f4c32;
  --status: #2f2822;
  --hover-border: #c9a94a;
  --highlight-bg: #4a4024;
  --ink-on-hover: #faf6ee;
  --em-color: #e2c878;
  --box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
  --box-shadow-mobile: 0 10px 28px rgba(0, 0, 0, 0.4);
  --body-bg-wash: #120f0c;
  --overlay-scrim: rgba(0, 0, 0, 0.7);
}

* {
  box-sizing: border-box;
}

html {
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
  background: var(--body-bg-wash);
}

body {
  margin: 0;
  min-height: 100vh;
  color: var(--ink);
  background: var(--body-bg-wash);
  font-family: var(--body-font);
  font-size: 18px;
  line-height: 1.58;
}

body.lang-en {
  --body-font: Georgia, "Times New Roman", serif;
  --ui-font: Georgia, "Times New Roman", serif;
}

body.lang-alt {
  --body-font: var(--cjk-font);
  --ui-font: var(--cjk-font);
}

body.lang-en #box p.venue-note,
body.lang-en #box h1,
body.lang-en #box h2 {
  font-family: var(--body-font);
}

a {
  color: inherit;
}
a:hover {
  color: var(--accent-dark);
}

.game-shell {
  width: min(920px, calc(100% - 32px));
  margin: 0 auto;
  padding: 36px 0;
}

#box {
  width: 100%;
  overflow-wrap: break-word;
  padding: clamp(22px, 4vw, 44px);
  border: 1px solid var(--line);
  background: var(--paper);
  box-shadow: var(--box-shadow);
  text-size-adjust: 100%;
  -webkit-text-size-adjust: 100%;
}

#box p {
  font-size: 1em;
  margin: 0 0 1em;
}

#box p.notice {
  margin: 0 0 1em;
}

/* Mid-page points notices: same rhythm as story paragraphs */
#box p:has(+ p.notice) {
  margin-bottom: 1em;
}

#box p.ending-congrats {
  margin: 0.25rem 0 1em;
  color: var(--accent-dark);
  font-size: clamp(1.25rem, 3vw, 1.65rem);
  line-height: 1.25;
}

#box p.note-lead {
  margin: 0 0 0.35em;
  line-height: 1.45;
}

#box p.note-keys {
  margin: 0 0 0.35em;
  line-height: 1.45;
}

/* Last line of a tight cluster → normal section gap after it */
#box p.note-cluster-end {
  margin-bottom: 1em;
}

#box p.venue-note {
  margin: 0.35rem 0 0.4rem;
  color: var(--accent-dark);
  font-family: var(--ui-font);
  font-size: 1.06em;
  font-weight: 600;
  line-height: 1.4;
}

#box p.venue-note strong,
#box p.venue-note b {
  color: inherit;
  font-weight: 600;
}

#box hr {
  height: 1px;
  margin: 1.35rem 0;
  border: 0;
  background: var(--line);
}

#box h1,
#box h2 {
  margin: 0.2rem 0 1rem;
  color: var(--accent-dark);
  font-family: var(--ui-font);
  letter-spacing: 0;
}

#box h1 {
  font-size: clamp(1.8rem, 4vw, 2.75rem);
}
#box h1.game-title {
  font-family: var(--body-font);
}
#box h2 {
  font-size: clamp(1.25rem, 3vw, 1.85rem);
}

#box div[align="center"],
#box .center {
  text-align: left;
}

#box span[style] {
  background: transparent !important;
  color: inherit !important;
}

#box em {
  color: var(--em-color);
}

#box strong,
#box b {
  color: var(--accent-dark);
}

#box ul,
#box .choices {
  margin: 1.45rem 0 0;
  padding: 0;
  list-style: none;
}

.choice + .choice {
  margin-top: 10px;
}

/* Screen fade on step change */
@keyframes diane-screen-fade {
  from {
    opacity: 0.42;
  }
  to {
    opacity: 1;
  }
}
#box.screen-fade {
  animation: diane-screen-fade 0.18s ease-out;
}
@media (prefers-reduced-motion: reduce) {
  html {
    scroll-behavior: auto;
  }
  #box.screen-fade {
    animation: none !important;
  }
  .gallery-overlay,
  .gallery-panel {
    transition: none !important;
  }
}

#box li {
  margin: 0;
  padding: 0;
  list-style: none;
}

#box li::marker {
  content: "";
}

#box li a,
.choice,
.back-button {
  display: block;
  width: 100%;
  min-height: 44px;
  padding: 11px 14px;
  border: 1px solid var(--line);
  border-radius: 6px;
  color: var(--ink);
  background: var(--choice);
  font-family: var(--ui-font);
  font-size: 1rem;
  line-height: 1.35;
  text-align: left;
  text-decoration: none;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

.choice.key-pressed {
  border-color: var(--hover-border);
  background: var(--choice-hover);
  color: var(--ink-on-hover);
}

@media (hover: hover) and (pointer: fine) {
  #box:not(.choice-key-armed) li a:hover,
  #box:not(.choice-key-armed) .choice:hover {
    border-color: var(--hover-border);
    background: var(--choice-hover);
    color: var(--ink-on-hover);
  }
  /* Guide pick: keep accent inset; fill uses --guide-hover-bg (dark: step off gold tray, not into ink range) */
  #box:not(.choice-key-armed) .choice.guide-highlight:hover {
    border-color: var(--hover-border);
    background: var(--guide-hover-bg);
    color: var(--ink-on-hover);
  }
}

.status-bar {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
  gap: 8px;
  margin-top: 24px;
  padding: 12px;
  border: 1px solid var(--line);
  background: var(--status);
  font-family: var(--ui-font);
  font-size: 0.92rem;
}

.status-bar span {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  color: var(--muted);
}

.status-bar b {
  color: var(--ink);
}

.nav-row {
  margin-top: 24px;
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

.guide-toggle-button {
  width: auto;
  min-width: 120px;
  padding: 11px 14px;
  border: 1px solid var(--accent);
  border-radius: 6px;
  font-family: var(--ui-font);
  font-size: 1rem;
  text-align: center;
  cursor: pointer;
}
.guide-toggle-on {
  background: var(--choice);
  color: var(--accent-dark);
}
.guide-toggle-off {
  background: transparent;
  color: var(--muted);
  border-color: var(--line);
}
.guide-toggle-button:hover {
  background: var(--choice-hover);
  border-color: var(--accent-dark);
}

.climax-skip-button {
  width: auto;
  min-width: 140px;
  padding: 11px 14px;
  border: 1px solid var(--accent);
  border-radius: 6px;
  font-family: var(--ui-font);
  font-size: 1rem;
  text-align: center;
  cursor: pointer;
  background: var(--choice);
  color: var(--accent-dark);
}

.climax-skip-button:hover {
  background: var(--choice-hover);
  border-color: var(--accent-dark);
}

.theme-toggle-button {
  width: auto;
  min-width: 0;
  margin-left: auto;
  padding: 9px 12px;
  border: 1px solid var(--accent);
  border-radius: 6px;
  font-family: var(--ui-font);
  font-size: 0.94rem;
  text-align: center;
  cursor: pointer;
  background: transparent;
  color: var(--muted);
}

.theme-toggle-on {
  background: var(--choice);
  color: var(--accent-dark);
}

.theme-toggle-off {
  background: transparent;
  color: var(--muted);
  border-color: var(--line);
}

@media (hover: hover) and (pointer: fine) {
  .theme-toggle-button:hover {
    background: var(--choice-hover);
    border-color: var(--accent-dark);
  }
}

.back-button {
  width: auto;
  min-width: 120px;
  color: var(--on-accent);
  background: var(--accent);
  border-color: var(--accent);
  text-align: center;
}

@media (hover: hover) and (pointer: fine) {
  .back-button:hover {
    color: var(--on-accent);
    background: var(--accent-strong);
    border-color: var(--accent-strong);
  }
}

@media (max-width: 640px) {
  body {
    font-size: 16px;
  }
  .game-shell {
    width: 100%;
    padding: 10px 12px 16px;
  }
  #box {
    box-shadow: var(--box-shadow-mobile);
  }
}
.status-bar {
  display: block;
}

.status-row {
  display: grid;
  gap: 8px;
}

.status-row-main {
  grid-template-columns: repeat(3, minmax(0, 1fr));
}

.status-row-money {
  grid-template-columns: repeat(3, minmax(0, 1fr));
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px solid var(--line);
}

@media (max-width: 520px) {
  .status-bar {
    padding: 10px 10px;
    font-size: 0.78rem;
  }
  .status-row {
    gap: 6px;
  }
  .status-bar span {
    min-width: 0;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    text-align: center;
    overflow-wrap: break-word;
    word-break: keep-all;
  }
}

.game-toolbar {
  display: flex;
  justify-content: flex-start;
  align-items: center;
  gap: 10px;
  margin-bottom: 16px;
}

.language-toggle {
  flex: 0 0 auto;
  box-sizing: border-box;
  min-width: 94px;
  min-height: 40px;
  padding: 9px 12px;
  border: 1px solid var(--accent);
  border-radius: 6px;
  color: var(--on-accent);
  background: var(--accent);
  font-family: var(--ui-font);
  font-size: 0.94rem;
  line-height: 1.25;
  cursor: pointer;
}

.language-toggle:hover {
  color: var(--on-accent);
  background: var(--accent-strong);
  border-color: var(--accent-strong);
}

/* Toggle label is always the other language, so its font must follow the label, not the page. */
body.lang-alt .language-toggle {
  font-family: Georgia, "Times New Roman", serif;
}
body.lang-en .language-toggle {
  font-family: var(--cjk-font);
}

body.lang-alt .lang-en,
body.lang-en .lang-alt {
  display: none !important;
}

@media (max-width: 640px) {
  .game-toolbar {
    padding: 0;
    margin-bottom: 10px;
    align-items: center;
    flex-wrap: wrap;
  }
  .theme-toggle-button {
    min-width: 0;
    height: 44px;
    min-height: 44px;
    padding: 8px 10px;
    font-size: 0.78rem;
    line-height: 1.15;
    white-space: nowrap;
  }
}

.choice.guide-highlight {
  border-color: var(--accent);
  box-shadow: 0 0 0 2px var(--accent) inset;
  background: var(--highlight-bg);
}

.choice.guide-highlight.key-pressed {
  border-color: var(--hover-border);
  background: var(--guide-hover-bg);
  color: var(--ink-on-hover);
}

.gallery-button {
  flex: 0 0 auto;
  box-sizing: border-box;
  min-width: 94px;
  min-height: 40px;
  padding: 9px 12px;
  border: 1px solid var(--accent);
  border-radius: 6px;
  color: var(--on-accent);
  background: var(--accent);
  font-family: var(--ui-font);
  font-size: 0.94rem;
  line-height: 1.25;
  cursor: pointer;
}
.gallery-button:hover {
  background: var(--accent-strong);
  border-color: var(--accent-strong);
}

.gallery-overlay {
  position: fixed;
  inset: 0;
  background: var(--overlay-scrim);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s ease;
  z-index: 50;
}
.gallery-overlay.open {
  opacity: 1;
  pointer-events: auto;
}
.gallery-panel {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 8px;
  width: 100%;
  max-width: 560px;
  max-height: 82vh;
  display: flex;
  flex-direction: column;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
  transform: translateY(14px) scale(0.98);
  transition: transform 0.25s ease;
}
.gallery-overlay.open .gallery-panel {
  transform: translateY(0) scale(1);
}
.gallery-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px 20px 12px;
  border-bottom: 1px solid var(--line);
}
.gallery-header h2 {
  margin: 0;
  font-size: 1.2rem;
  font-family: var(--ui-font);
}
.gallery-close {
  border: 1px solid var(--line);
  background: var(--choice);
  color: var(--ink);
  border-radius: 6px;
  min-height: 44px;
  padding: 10px 12px;
  font-family: var(--ui-font);
  cursor: pointer;
  touch-action: manipulation;
}
.gallery-close:hover {
  border-color: var(--hover-border);
  background: var(--choice-hover);
}
.gallery-scroll {
  overflow-y: auto;
  padding: 4px 20px 20px;
}
.gallery-section h3 {
  margin: 16px 0 6px;
  font-size: 0.95rem;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.04em;
  font-family: var(--ui-font);
}
.gallery-list {
  display: flex;
  flex-direction: column;
}
.gallery-list {
  --gallery-num-w: 1.85rem;
  --gallery-num-gap: 0.35rem;
}
.gallery-row {
  -webkit-appearance: none;
  appearance: none;
  display: grid;
  grid-template-columns: var(--gallery-num-w) minmax(0, 1fr) auto;
  column-gap: var(--gallery-num-gap);
  align-items: center;
  width: 100%;
  min-height: 44px;
  text-align: left;
  background: none;
  border: none;
  border-bottom: 1px solid var(--line);
  padding: 0 4px 0 2px;
  line-height: 1.3;
  font-family: var(--ui-font);
  font-size: 0.95rem;
  color: var(--ink);
  cursor: pointer;
  touch-action: manipulation;
}
.gallery-index {
  width: var(--gallery-num-w);
  text-align: right;
  font-variant-numeric: tabular-nums;
  color: inherit;
  line-height: inherit;
}
.gallery-title {
  min-width: 0;
  color: inherit;
  line-height: inherit;
}
.gallery-list > .gallery-row:last-child,
.gallery-list > .gallery-group:last-child > .gallery-row {
  border-bottom: none;
}
.gallery-list > .gallery-group:last-child > .gallery-group-toggle.gallery-group-open {
  border-bottom: 1px solid var(--line);
}
.gallery-list > .gallery-group:last-child .gallery-variants:not([hidden]) .gallery-row:last-child {
  border-bottom: none;
}
.gallery-row:hover {
  background: var(--choice-hover);
  color: var(--accent);
}
.gallery-row:focus {
  outline: none;
}
.gallery-row:focus-visible {
  background: var(--choice-hover);
  color: var(--accent);
}
.gallery-group-toggle::after {
  content: "▸";
  opacity: 0.55;
}
.gallery-group-toggle.gallery-group-open::after {
  content: "▾";
}
.gallery-variants {
  margin: 0 0 4px 0;
}
.gallery-variant {
  font-size: 0.9rem;
}

/* Matched control sizing only (colors stay as each button already defines) */
.gallery-button,
.language-toggle,
.back-button,
.guide-toggle-button,
.climax-skip-button,
.theme-toggle-button {
  box-sizing: border-box;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  min-height: 44px;
  padding: 10px 14px;
  font-size: 1rem;
  line-height: 1.25;
  touch-action: manipulation;
}
@media (max-width: 640px) {
  .theme-toggle-button {
    min-width: 0;
    height: 44px;
    min-height: 44px;
    padding: 8px 10px;
    font-size: 0.78rem;
    line-height: 1.15;
    white-space: nowrap;
  }
}

button:focus,
.choice:focus,
.back-button:focus,
.gallery-button:focus,
.language-toggle:focus,
.guide-toggle-button:focus,
.climax-skip-button:focus,
.theme-toggle-button:focus {
  outline: none;
}

/* Restore a visible keyboard focus indicator after the pointer-focus reset. */
button:focus-visible,
button[class]:focus-visible,
a[href]:focus-visible,
[tabindex]:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
}

function captureDesp(fn) {
  var last = "";
  var original = sAlt;
  sAlt = function (en, alt) {
    if (en || alt)
      last = {
        en: en,
        alt: alt,
      };
  };
  try {
    fn();
  } finally {
    sAlt = original;
  }
  return last;
}
function printCapturedDesp(html) {
  if (html) {
    var print = sAlt;
    print(html.en, html.alt);
  }
}
function start() {
  sAlt(
    "<h1 class='game-title'><strong><div class='center'><span style='background: #ffff00; color: #000000'>A Date with Diane</span></div></strong></h1>",
    "<h1 class='game-title'><strong><div class='center'><span style='background: #ffff00; color: #000000'>與黛安約會</span></div></strong></h1>",
  );
  sAlt("<HR>", "<HR>");
  sAlt(
    "<p>The goal of the game is to get your girlfriend desperate on a date. It is not guaranteed! Along the way you may have other pleasures: see her take a pee, even go into the loo with her, have her tell you about a desperation experience, spot another desperate girl, etc. It’s that simple. Intimacy points indicate how much she’s into you, and she might abandon the date if they sink too low. She will also abandon the date if she wets herself in public, and will probably never see you again, so you mustn’t let that happen.</p>",
    "<p>這個遊戲的目標是讓你的女朋友在約會時憋到尿急難耐。不過，這可不一定會成功！一路上你還可能碰到其他刺激場面：看她撒尿，甚至陪她進廁所，聽她講自己憋尿的經歷，或者撞見另一個憋得快不行的女生，等等。規則很簡單，「親密度」代表她有多喜歡你。如果親密度降得太低，她可能會直接結束約會。如果她當眾尿濕自己，她也會立刻走人——而且很可能再也不想見你了，所以千萬別讓事情失控到那一步。</p>",
  );
  cAlt("start1", "A few notes about the game.", "關於遊戲的幾點說明。");
  cAlt(
    "start1a",
    "I’ve already read them. I’ll get straight on with the game.",
    "我已經看過了，直接開始遊戲。",
  );
}
function start1() {
  sAlt(
    "<p>There are five different successful endings, or ‘winning results’, rated in order. See if you can get them all!</p>",
    "<p>一共有五種成功結局，也就是依等級排列的「得獎結局」。看看你能不能全部達成！</p>",
  );
  sAlt(
    "<p>There are also a few consolation endings, and you might even be able to win a date with Amanda.</p>",
    "<p>另外還有幾個安慰獎結局，你甚至有機會和阿曼達約會。</p>",
  );
  sAlt(
    "<p>The <strong>bladder</strong> meter shows how much Diane’s holding. What’s in her <strong>tummy</strong> slowly flows into her <strong>bladder</strong> as time passes. Also, you get <strong>3 luckshots</strong> that you should use wisely when offered, and remember, they can bring bad luck too! Note that you cannot use more than one of these at the end of the evening, once you’ve got the bus or taxi home.</p>",
    "<p><strong>膀胱</strong>數值顯示黛安正憋著多少尿。她<strong>肚子</strong>裡的水分會隨時間慢慢流進<strong>膀胱</strong>。另外，你有<strong>3次幸運機會</strong>，出現時要明智使用；別忘了，它們也可能帶來壞運氣！注意，一旦你坐上回家的公車或計程車，當晚結束時最多只能再用一次。</p>",
  );
  sAlt(
    "<p>Don’t expect to sleep with her on this first date, but you might get some fun if you play your cards right. And never forget: women are funny creatures.</p>",
    "<p>別指望第一次約會就能跟她上床，但如果你應對得當，也許還能嚐到一點樂趣。千萬別忘了：女人總是讓人捉摸不透。</p>",
  );
  sAlt(
    "<p>As the evening progresses, your <strong>intimacy</strong> points should rise, and they naturally affect what you can do. In some scenes, <strong>shyness</strong> points also come into play, and the number earned or lost by the time you arrive home can influence events. In some scenarios a high figure helps; in others, a low figure helps, so this works rather like a joker card.</p>",
    "<p>隨著約會進行，你的<strong>親密度</strong>通常會逐漸上升，也會自然影響你能做什麼。有些場景還會用到<strong>害羞值</strong>；你回家時的數值高低也會影響後續發展。有時高一點更有利，有時反而低一點更有利，所以它更像一張百搭牌。</p>",
  );
  sAlt(
    "<p>You start with <strong>£100</strong>. Keep an eye on your money. You might want some for a taxi home at the end of the evening.</p>",
    "<p>一開始你有<strong>100英鎊</strong>。留意花費，約會結束後也許還要搭計程車回家。</p>",
  );
  sAlt(
    "<p>There are lots of variations, so do play the game right through a few times. But on Tuesdays and Thursdays you will also find a shorter version.</p>",
    "<p>遊戲有很多不同走向，最好從頭到尾多玩幾遍。但週二和週四也會提供較短的版本。</p>",
  );
  sAlt(
    "<p class='note-lead'>There’s also a Gallery on the top left, with guided walks through the prize endings, consolation endings, and various hidden scenes. Use it if you get stuck, or if you simply want to explore. Some rows are dropdowns: click to open them, then choose the variant you want. On a phone or tablet, use the buttons on screen; on a computer you also have these shortcut keys.</p>",
    "<p class='note-lead'>左上角還有個劇情圖鑑，裡面有通往得獎結局、安慰獎結局以及各種隱藏場景的引導路線。卡住時可以用，只是想瀏覽也可以。有些項目是下拉選單：先點開，再選你想看的版本。在手機或平板上請用畫面上的按鈕；在電腦上還可以用下面這些快速鍵。</p>",
  );
  sAlt(
    "<p class='note-keys'><strong>G</strong> opens the Gallery (<strong>Esc</strong> closes it).</p>",
    "<p class='note-keys'><strong>G</strong> 鍵打開劇情圖鑑（<strong>Esc</strong> 鍵關閉）。</p>",
  );
  sAlt(
    "<p class='note-keys'><strong>H</strong> turns the Guide on or off once you’ve started one.</p>",
    "<p class='note-keys'>開始跟隨引導路線後，可按 <strong>H</strong> 鍵開啟或關閉引導。</p>",
  );
  sAlt(
    "<p class='note-keys note-cluster-end'><strong>D</strong> toggles Dark Mode on or off.</p>",
    "<p class='note-keys note-cluster-end'><strong>D</strong> 鍵開啟或關閉深色模式。</p>",
  );
  sAlt(
    "<p class='note-keys'>Use <strong>number keys</strong> to pick your choices.</p>",
    "<p class='note-keys'><strong>數字鍵</strong>用來選擇選項。</p>",
  );
  sAlt(
    "<p class='note-keys note-cluster-end'><strong>Enter</strong> follows the highlighted Guide choice, but only while the Guide is on. Hold <strong>Enter</strong> briefly to fast-forward through guided choices; release to stop.</p>",
    "<p class='note-keys note-cluster-end'><strong>Enter</strong> 鍵可選擇反白的引導選項，但只有在引導開啟時才有效。按住 <strong>Enter</strong> 鍵可快速前進，依序選取引導選項；放開即停。</p>",
  );
  sAlt(
    "<p class='note-lead'>You can press the ‘Back’ button to return to the previous page at any time if you regret a choice; it restores everything – stats, choices, the lot. That works in Guide mode too.</p>",
    "<p class='note-lead'>若後悔某個選擇，隨時可以按「返回」按鈕回到上一頁；它會把一切都恢復——數值、選項，統統還原。引導模式裡同樣有效。</p>",
  );
  sAlt(
    "<p class='note-keys note-cluster-end'><strong>B</strong> does the same as the ‘Back’ button. Hold <strong>B</strong> briefly to rewind quickly; release to stop.</p>",
    "<p class='note-keys note-cluster-end'><strong>B</strong> 鍵的效果和「返回」按鈕一樣。按住 <strong>B</strong> 鍵可快速倒退；放開即停。</p>",
  );
  sAlt(
    "<p class='note-lead'>While following an ending Guide, press the ‘Skip to the good bit!’ button (or press <strong>S</strong>) to jump ahead to the climax of the story. Going ‘Back’ can rewind past that point, but the skip button will not appear again until you start a fresh ending from the Gallery.</p>",
    "<p class='note-lead'>跟隨結局引導時，可按「跳到精采部分！」按鈕（或按 <strong>S</strong> 鍵）直接跳到故事的高潮。用「返回」可以回到高潮之前，但跳過按鈕不會再出現，除非你從圖鑑重新開始一個結局。</p>",
  );
  sAlt(
    "<p class='note-keys note-cluster-end'>Turning the Guide off also removes the skip button and stops fast-forward. You can turn the Guide back on if you’re still on the path; if you choose differently and leave the path, the Guide drops out, unless you go ‘Back’ to a point where you were still on track.</p>",
    "<p class='note-keys note-cluster-end'>關閉引導也會隱藏跳過按鈕，並停止快速前進。若你仍在路線上，可以再打開引導；若選了別的選項偏離路線，引導就會中止，除非你「返回」到仍在路線上的節點。</p>",
  );
  cAlt("start1a", "Start the game.", "開始遊戲。");
  cAlt("info", "Further information.", "更多資訊。");
}

  );
  sAlt("<HR>", "<HR>");
  sAlt(
    "<p>You go into the restaurant. You sit down at the table, and the waiter brings the menus. You don’t want starters, but Diane asks for an orange juice as a thirst quencher.</p>",
    "<p>你們進到餐廳，找了張桌子坐下，服務生拿來了菜單。你不想點前菜，但黛安要了一杯柳橙汁解渴。</p>",
  );

  pounds -= 2;
  if (saturday) {
    sAlt(
      "<p>Her dress is quite low cut and you get a glimpse of cleavage as she sits there. You wonder if you will get a chance to explore it later on.</p>",
      "<p>她這件洋裝的領口開得挺低，她坐在那裡，你隱約看得見乳溝。你暗自想，今晚是否有機會好好愛撫一番。</p>",
    );
  } else {
    sAlt(
      "<p>She hangs her jacket on her seat back. You study the way her blouse sets off her breasts, and wonder if you will get a chance to explore them later in the evening.</p>",
      "<p>她把外套搭在椅背上。你仔細看著襯衫勾出的胸部曲線，心裡暗想，今晚晚一點會不會有機會親手撫摸。</p>",
    );
  }
  sAlt(
    "<p>While you’re considering the Italian food, you choose a bottle of wine. Which will it be?</p>",
    "<p>你一邊看義大利菜單，一邊挑葡萄酒。要選哪一種？</p>",

  cAlt("buyrioja", "A bottle of Spanish Rioja (£12)", "一瓶西班牙里奧哈紅酒（12英鎊）");

function eatmeal1() {
  sAlt(
    "<p>The waiter brings the wine and you pour a nice large glass for yourself and a nice large glass for her.</p>",
    "<p>服務生把酒端上來，你給自己和她各倒了一大杯。</p>",

    "<p>You both take a good drink of the wine. You chat about this, and you chat about that. Then the food arrives.</p>",
    "<p>你們各喝了一大口酒，聊聊這個，又聊聊那個，接著餐點就送上來了。</p>",
  );
  sAlt(

  );

function eatmeal1a() {
  sAlt(
    "<p>You are both eating your food, which is very good. You have a sip of wine and she has a sip, and she drinks some more water.</p>",
    "<p>你們吃著餐點，味道很不錯。你抿了口酒，她也抿了口，接著她又喝了些水。</p>",
  );
  sAlt(
    "<p>Your pizza is great. Lots of spicy pepperoni, and peppers, and other things. The only trouble is, there is so much of it you will be eating long after Diane has finished.</p>",
    "<p>你的披薩棒極了——滿滿的辣味義大利香腸、甜椒，還有好多別的配料。唯一的麻煩是，分量實在太足，等黛安吃完，你還得吃上好一陣子。</p>",
  );
  getinti(-1);
  sAlt("<p>YOU: Do you remember the first time we met?</p>", "<p>你：還記得我們第一次見面嗎？</p>");
  sAlt(
    "<p>DIANE: I can’t really forget it, can I! Fancy us both missing the last bus home. I was really glad you were there – I’m not sure I had enough on me for the taxi fare home.</p>",
    "<p>黛安：那怎麼可能忘！我們倆都錯過末班車，真沒想到。幸好你在——我那時身上的錢好像不夠搭計程車回家。</p>",
  );
  sAlt("<p>YOU: How did you come to miss the bus?</p>", "<p>你：你怎麼會錯過那班車？</p>");
  sAlt("<p>She blushes and grins at you.</p>", "<p>她臉紅了，朝你咧嘴一笑。</p>");
  sAlt(
    "<p>DIANE: You know perfectly well why I missed the bus. It was so embarrassing!</p>",
    "<p>黛安：你明明知道我為什麼沒趕上公車。真是難為情！</p>",
  );
  cAlt("eatmeal1b", "You carry on chatting.", "你們繼續聊天。");
}
function eatmeal1b() {
  sAlt(
    "<p>DIANE: And how was it <em>you</em> managed to miss the last bus home?</p>",
    "<p>黛安：那<em>你</em>又是怎麼錯過末班車的啊？</p>",
  );
  sAlt(
    "<p>YOU: Well, I have to admit, it was like you. I just popped to the loo, and when I came back, the bus had gone.</p>",
    "<p>你：說來慚愧，跟你一樣。我就是去了趟廁所，回來時車已經開走了。</p>",
  );
  sAlt(
    "<p>DIANE: Really? You found a loo at that hour?</p>",
    "<p>黛安：真的？那個時間你還找得到廁所？</p>",
  );
  sAlt("<p>YOU: Well, I went in the car park...</p>", "<p>你：呃……我是在停車場解決的……</p>");
  sAlt(
    "<p>DIANE: Lucky we didn’t bump into each other! That would have been even more embarrassing.</p>",
    "<p>黛安：幸好我們沒撞上！不然就更難為情了。</p>",
  );
  sAlt("<p>YOU: Yes.</p>", "<p>你：是啊。</p>");
  sAlt(
    "<p><span style='color: #ff3333'>Of course, you know exactly why she missed the bus, because you’d seen her. She’d been absolutely desperate for a pee and had fled the bus stop looking for somewhere to go. She’d gone behind a minibus and by the time she returned to the bus stop, the bus had gone. You’re hoping you can see her desperate again.</span></p>",
    "<p><span style='color: #ff3333'>當然，你很清楚她為什麼錯過車——因為你親眼看見了。她當時尿急得快忍不住了，慌忙離開公車站，四處找地方解決。她躲到一輛小型巴士後面，等她回到公車站，公車早就開走了。你希望還能再看到她那麼急著上廁所的樣子。</span></p>",
  );
  sAlt("<p>You top up both the wine glasses.</p>", "<p>你替兩人的酒杯都續上了酒。</p>");
  proc += 50;
  sAlt("<p>DIANE: Thank you!</p>", "<p>黛安：謝謝！</p>");
  cAlt("eatmeal1c", "You carry on chatting.", "你們繼續聊天。");
}
function eatmeal1c() {
  sAlt("<p>YOU: Do you often go to the theatre?</p>", "<p>你：你常去看戲嗎？</p>");
  sAlt(
    "<p>DIANE: Yes, I love the theatre, I’ve done some acting myself.</p>",
    "<p>黛安：常去啊，我很喜歡戲劇，自己也演過。</p>",
  );
  sAlt("<p>YOU: Do you know much about this play?</p>", "<p>你：你對這齣戲了解多少？</p>");
  sAlt(
    "<p>DIANE: Not much, just that my friend Molly is in it, and I’m really looking forward to seeing her. We once acted in a play together when she was an amateur. I hope we’ll be able to see her for a drink afterwards.</p>",
    "<p>黛安：不太熟，只知道我朋友莫莉有演出。我很期待看她演出。我們以前一起演過戲，那時她還是業餘的。希望散場後能約她出來喝一杯。</p>",
  );
  cAlt("eatmeal1d", "You carry on chatting.", "你們繼續聊天。");
}
function eatmeal1d() {
  sAlt(
    "<p>DIANE: What are your interests – apart from theatre, of course?</p>",
    "<p>黛安：你平時都有什麼興趣啊——除了看戲以外？</p>",
  );
  sAlt("<p>YOU: I go cycling quite a lot.</p>", "<p>你：我很常騎腳踏車。</p>");
  sAlt(
    "<p>DIANE: Oh, I love that. In fact, I love the open air.</p>",

  );

    "<p>你：去年我沿著海岸到海岸路線騎腳踏車，橫越整個英格蘭，花了兩天時間。</p>",
  );
  sAlt("<p>You top up both the wine glasses.</p>", "<p>你替兩人的酒杯都續上了酒。</p>");
  proc += 50;
  sAlt("<p>DIANE: Cheers!</p>", "<p>黛安：乾杯！</p>");
  cAlt("eatmeal7", "You carry on chatting.", "你們繼續聊天。");
}

function stamptalk() {

  sAlt(
    "<p>YOU: I think lots of boys collect them but it sort of developed as I got to know more about them. Then I started to specialise and nowadays I just collect British Empire stamps from the 1940s and ’50s. The other day I bought a Rhodesian twopenny stamp from 1945, and it was great because it gave me a full set of the standard issue for that year.</p>",
    "<p>你：很多男孩小時候都集過郵，但隨著我了解得越來越多，慢慢就認真鑽研起來了。後來開始專門研究某一類，現在我只收集四十至五十年代的大英帝國郵票。前幾天我買到了一枚1945年的羅得西亞兩便士郵票，太開心了，因為這樣我就湊齊了那一年發行的全套常用郵票。</p>",
  );

function cartalk() {
  sAlt("<p>DIANE: Did you get the bus here?</p>", "<p>黛安：你是坐公車來的喔？</p>");
  sAlt(
    "<p>YOU: Yes, but only because I knew I’d be drinking some wine. I really enjoy driving.</p>",
    "<p>你：對，因為知道今晚要喝酒，才搭公車。我其實很喜歡開車。</p>",
  );
  sAlt("<p>DIANE: Oh.</p>", "<p>黛安：哦。</p>");
  sAlt(
    "<p>YOU: Yes. I really love cars. I’ve just bought a new BMW coupe. I bought it second-hand but it’s a model I’ve really been looking out for and I got it at a tremendous price. You’ll have to come out for a ride in it one day.</p>",
    "<p>你：是啊，我超愛車。我剛買了一輛BMW雙門跑車。買的是二手的，但這款車我心儀已久，這次價格也超划算。改天你一定要來坐坐。</p>",
  );
  sAlt(
    "<p>DIANE: Oh, I don’t think that’s my sort of thing. I think they’re such a waste of money. After all, four wheels are four wheels, aren’t they? And just think of the global warming they cause! I had a boyfriend once who was just obsessed with cars, just wanted to drive around all day. I’ve never been so bored in my life.</p>",
    "<p>黛安：哦，那不太合我的口味。我覺得買車簡直是在浪費錢。畢竟，四個輪子就是四個輪子，對吧？而且想想它們造成的全球暖化！我以前有個男朋友對車子著迷得不得了，整天只想開車兜風。那是我這輩子最無聊的時光。</p>",
  );
  sAlt("<p>YOU: But they are useful – </p>", "<p>你：不過車還是很實用啦——</p>");
  sAlt(
    "<p>DIANE: He didn’t even want to go anywhere special. You’d go flying down one motorway, then another, then another. He’d rabbit on about this A-road and that B-road, and about how many miles he got to the gallon. And he never, ever wanted to stop, not even if you were bursting for the toilet. It put me off cars for life.</p>",
    "<p>黛安：他根本不想去什麼特別的地方。就這樣在一條高速公路上飛馳，接著換另一條，再換另一條。他一路講個不停，講這條A級公路、那條B級公路，說每加侖能跑多少英里。哪怕你急著上廁所、快憋瘋了，他也永遠不想停車。從此我就對汽車徹底沒興趣了。</p>",
  );
  getinti(-8);
  cAlt("eatmeal5d", "Remember not to mention cars again.", "記住，下次別再提車。");
}

  sAlt(

    "<p>你：聽起來太棒了。我也喜歡去參觀蒸汽鐵路，還專門學過怎麼開蒸汽機車。也許哪天你可以跟我一起去。</p>",
  );
  sAlt("<p>DIANE: I’d really like that.</p>", "<p>黛安：好啊，我很樂意。</p>");

function testtue() {

    "<p>週二和週四可以選擇短版遊戲，直接跳到晚上稍後在你家裡的部分。如果你已經玩過幾次，不想再從頭看一遍舞台劇，可以選擇這個模式。請注意，部分選項在短版遊戲裡不會起作用，而且你只能使用1次幸運機會。</p>",

function testtue1() {

  );

    blad += 70;
    inti += 95;
  } else if (icecream) {
    blad += 45;
    inti += 105;
  } else {
    blad += 20;
    inti += 115;
  }
  sAlt(
    "<p>Of course, you both have a few drinks, both together and with her friends, at the theatre and the pub. And you have a nice relaxing walk along the riverside. A couple of times you sense that she needs a wee, but each time she finds a ‘Ladies’ without much problem. Still, a distinct shifting about on one occasion has whetted your appetite for more.</p>",
    "<p>當然，你們喝了幾杯酒——不管是兩人單獨喝，還是跟她朋友們一起，在劇院和酒吧都喝過。你們還沿著河邊慢慢散了步。途中有幾次你覺得她想去廁所，但每次她都很快找到了。不過，有一次她明顯扭來扭去，還是讓你期待能再看到這樣的情景。</p>",
  );

    "<p>Finally you leave her friends, get a taxi home, and she agrees to come in for a coffee. After all, you are quite intimate now, and you sense that she might just need the loo again.</p>",
    "<p>最終你們告別了她的朋友，叫了輛計程車回家，她答應進來喝杯咖啡。畢竟現在你們已經挺親密了，而且你感覺她說不定又有點想去廁所了。</p>",

  cAlt("arrivehome", "Let’s see what happens!", "看看接下來會怎樣吧！");
}

    sAlt(
      "<p>DIANE: Oh, I love music. Molly and I normally go to at least one festival each year. We’ve been to Glastonbury, and the Isle of Wight, but the best one of all was Roskilde a few years back. I’d never been to Denmark, so that was a real treat.</p>",
      "<p>黛安：哦，我超愛音樂。莫莉和我每年至少會去一次音樂節。我們去過格拉斯頓伯裡，也去過懷特島，不過最棒的一次是幾年前的羅斯基勒音樂節。我以前從沒去過丹麥，所以那次真的超開心。</p>",
    );
    sAlt(
      "<p>YOU: I’ve been to one or two. I quite like the smaller festivals, really. I went to Glastonbury a few years back and it just seemed too big. And muddy, of course – it rained all the time.</p>",
      "<p>你：我也去過一兩次。說真的，我比較喜歡規模小一點的音樂節。幾年前去格拉斯頓伯裡，覺得太大了。當然還有泥——一直在下雨嘛。</p>",
    );
    getinti(5);
    sAlt(
      "<p>DIANE: That’s the risk, isn’t it? At Roskilde the weather was lovely, though the facilities were a bit basic.</p>",
      "<p>黛安：這就是風險所在嘛。羅斯基勒那次天氣很好，不過設施就有點簡陋了。</p>",
    );
    sAlt(
      "<p>YOU: I think they’ve improved those, haven’t they? Better toilets and so on.</p>",
      "<p>你：我覺得後來改善了不少吧，廁所那些都好多了。</p>",
    );
    sAlt(
      "<p>DIANE: There are never enough for us girls. At Roskilde we ended up going by the fence and Molly got really caught out. Some creep took her photo and put it on the web. She wasn’t best amused but we all found it hilarious.</p>",
      "<p>黛安：對我們女生來說廁所永遠不夠用。在羅斯基勒，我們最後只好跑到圍欄邊尿尿，結果莫莉正好被人抓拍到。有個變態把照片丟上網。她當時氣得要命，不過我們其他人都笑翻了。</p>",
    );
    sAlt(
      "<p>You make a mental note to look for that.</p>",
      "<p>你暗暗記下，回頭一定要去找找那張照片。</p>",
    );
  } else {
    sAlt(
      "<p>DIANE: Oh, I love music. I sing in a choir and I play the cello, so I’ve always been fond of music. Classical mostly, though I like musicals. And recently I’ve been to the opera and that was marvellous. I just want to learn more about it. And you?</p>",
      "<p>黛安：哦，我特別愛音樂。我參加了一個合唱團，還拉大提琴，一直對音樂很著迷。主要是古典樂，不過我也喜歡音樂劇。最近去聽了歌劇，簡直太美妙了，我真想多了解一些。你呢？</p>",
    );
    sAlt(
      "<p>You’re a bit flummoxed. You don’t really know much about music and you’ve never been to the opera. So you waffle and she quickly becomes bored. You have the horrid feeling that you are out of your depth.</p>",
      "<p>你有點不知所措。你對音樂其實了解不多，也從沒看過歌劇。於是你胡亂說了些有的沒的，她很快就覺得無聊了。你有種糟糕的感覺——自己已經接不上話了。</p>",
    );
    getinti(-5);
  }
  if (blad > 650 && blad <= 750) {
    sAlt(
      "<p>The conversation falters. She is hurrying you along.</p>",
      "<p>對話陷入了沉默。她催你快點走。</p>",
    );
  } else if (blad > 750) {
    sAlt(
      "<p>She isn’t really concentrating on what you say. Her mind is on other things.</p>",
      "<p>她完全沒在認真聽你說話，心思明顯放在別處。</p>",
    );
    getinti(-10);
  } else if (!spagbol) {
    sAlt(
      "<p>You wish you hadn’t started that line of talk.</p>",
      "<p>你真希望自己沒有扯起這個話題。</p>",
    );
  }
  cAlt("riverside12", "You carry on walking.", "你們繼續走著。");
}

function stamptalka() {

function traintalka() {
  sAlt(
    "<p>DIANE: Have you got any nice journeys planned?</p>",
    "<p>黛安：你有沒有計畫什麼好玩的旅行？</p>",
  );
  sAlt(
    "<p>YOU: I’m not planning to go abroad again this year. But I am hoping to go up to Scotland next month and travel up to Mallaig. It’s a beautiful railway line, and I’ve never been on it.</p>",
    "<p>你：今年我不打算再出國了。不過我希望下個月能去蘇格蘭，坐火車一路到馬萊格。那條鐵路線風景超美，我還從沒坐過。</p>",
  );
  sAlt(
    "<p>DIANE: Oh, it is. We had a family holiday there about 5 years ago and went on the line. It was a steam train, too.</p>",
    "<p>黛安：確實很美。大概五年前我們一家在那裡度假，也坐過那條線。還是蒸汽火車呢。</p>",
  );
  sAlt("<p>She is looking at you with a lovely smile.</p>", "<p>她帶著甜美的笑容看著你。</p>");
  sAlt(
    "<p>YOU: I’m hoping to go down to the North Yorkshire Moors Railway next week. I don’t suppose you’d be interested in coming along?</p>",
    "<p>你：我打算下週去北約克郡荒原鐵路。你有沒有興趣一起來？</p>",
  );
  traintalking = 1;
  sAlt("<p>DIANE: I’d love to.</p>", "<p>黛安：我很願意啊。</p>");
  sAlt("<p>She gives your hand a squeeze and looks at you.</p>", "<p>她握了握你的手，看著你。</p>");
  sAlt(
    "<p>DIANE: Perhaps I could make some sandwiches and we could have a picnic.</p>",
    "<p>黛安：也許我可以做點三明治，我們一起野餐。</p>",
  );
  sAlt(
    "<p>You nod agreement. You both stop and look at each other. You put your arm round her, draw her slowly towards you and kiss her. It is the first time you have kissed her and she lingers over it. You can taste her lips. You kiss again.</p>",
    "<p>你點頭同意。兩人都停下腳步，對看著。你摟住她，慢慢把她拉近，然後吻了她。這是你第一次吻她，她久久沒有離開。你能嚐到她唇上的滋味。你們又吻了一次。</p>",
  );
  getinti(25);
  if (blad > 700) {
    if (points < 20) {
      sAlt(
        "<p>DIANE: Come on! I’m dying to spend a penny!</p>",
        "<p>黛安：快走！我急著去方便一下！</p>",
      );
    } else {
      sAlt("<p>DIANE: Come on!</p>", "<p>黛安：快點！</p>");
    }
  } else {
    sAlt("<p>DIANE: Come on!</p>", "<p>黛安：快點！</p>");
  }
  cAlt("riverside12", "She marches you forward.", "她拉著你往前走。");
}
function riverside12() {
  sAlt("<p>You carry on walking.</p>", "<p>你們繼續向前走。</p>");
  blad += 5;
  digestMolly(30);
  if (blad > 700) {
    sAlt(
      "<p>Diane seems really keen to get to the Pavilion. She is walking in hurried little steps, and is biting her lip, as if quite anxious to get to the toilet.</p>",
      "<p>黛安好像很急著想趕到涼亭酒吧。她邁著急促的小碎步，咬著嘴唇，像是急著要去廁所。</p>",
    );
    sAlt(
      "<p class='notice'><strong>Diane is in a real hurry as you walk, but she still won’t say she needs the loo. You gained 5 shyness points.</strong></p>",
      "<p class='notice'><strong>一路上黛安走得好急，卻還是不肯說她要上廁所。你獲得了5點害羞值。</strong></p>",
    );
    adjpoints(5);

      "<p>You’re wondering whether you could stop and kiss.</p>",

    sAlt(
      "<p>Molly and Bruno, who are walking ahead of you, have stopped suddenly. They both look a little bit sheepish.</p>",
      "<p>走在你們前面的莫莉和布魯諾突然停下來了。兩人看來都有點不好意思。</p>",
    );
    sAlt("<p>They look at one another.</p>", "<p>他們互相對視了一眼。</p>");
    sAlt(
      "<p>BRUNO: Can we catch you up? We’ve just got something to discuss. We’ll join you again in 5 minutes.</p>",
      "<p>布魯諾：能讓我們一會兒再追上你們嗎？我們有點事要說。五分鐘後就來。</p>",
    );
    sAlt(
      "<p>You say, ‘Of course,’ and walk on. When you look back, you see Molly beginning to go down the steps, with Bruno behind her.</p>",
      "<p>你說「當然」，繼續往前走。回頭一望，你看到莫莉開始走下台階，布魯諾跟在她身後。</p>",
    );
    cAlt("riverside13", "Where are they going?", "他們要去哪裡？");
  } else {
    sAlt(
      "<p>You carry on walking, hand in hand with Diane.</p>",
      "<p>你繼續和黛安手牽手往前走。</p>",
    );
    cAlt("riverside13a", "OK.", "好的。");
  }
}
function riverside13() {
  sAlt(
    "<p>Molly and Bruno have peeled off and gone down the steps to the towpath. They are out of sight. You are wondering if Molly needed a pee. You’d like to peep over the parapet but you obviously can’t while you’re with Diane.</p>",
    "<p>莫莉和布魯諾已經離隊，走下台階去了纖道，不見了蹤影。你忍不住猜想莫莉是不是想去小便。你很想趴在欄桿上往下看，但明顯和黛安在一起時沒法這麼做。</p>",
  );

    "<p>YOU: I’m not sure. There’s a sort of towpath down there.</p>",
    "<p>你：不太確定。下面好像有一條纖道。</p>",
  );
  sAlt("<p>DIANE: Oh.</p>", "<p>黛安：哦。</p>");
  sAlt("<p>The penny has probably dropped for her.</p>", "<p>她大概已經猜到了。</p>");
  sAlt(
    "<p>You will just have to leave it all to your imagination. Unless you want to play a luckshot, of course.</p>",
    "<p>你只能靠自己的想像了。當然，除非你想用一次幸運機會。</p>",
  );
  cAlt("riverside13b", "No, I’ll save my luckshots.", "不，我要留著幸運機會。");

function riverside13b() {

    "<p>You walk on alone with Diane. You wish you could look over the parapet, but you can’t.</p>",
    "<p>你和黛安獨自繼續前行。你真希望能趴到欄桿上看一眼，但沒法那麼做。</p>",
  );
  mollyblad = 0;
  cAlt("riverside14", "You walk on together.", "你們一起繼續走。");
}

    "<p>You suspect Molly may have gone for a pee, but can’t be sure. Anyway, you would like to watch. So you have played a luckshot.</p>",
    "<p>你猜莫莉可能是去方便了，但又不確定。反正你很想看。所以你用了一次幸運機會。</p>",
  );

  if (inti < 75) {
    sAlt(
      "<p>You don’t have enough intimacy points for the luckshot to work.</p>",
      "<p>你的親密度不夠，幸運機會無法生效。</p>",

    sAlt(
      "<p>The path curves a little to the left here, and close to a rather erratic wall. It only takes a few paces across some rough grass to get to the wall and look over. Out of curiosity Diane does this, and you follow.</p>",
      "<p>小路在這裡微微往左彎，靠近一段參差不齊的矮牆。只要走幾步，穿過一片荒草地，就能走到牆邊往下望。黛安好奇地就這麼做了，你也跟過去。</p>",
    );
    sAlt("<p>DIANE: Oh!</p>", "<p>黛安：哦！</p>");
    sAlt(
      "<p>She puts a hand across her mouth, looking at you with mock embarrassment.</p>",
      "<p>她用手捂住嘴，故作難為情地看著你。</p>",
    );
    sAlt(
      "<p>You look over the wall and can see down the half-lit towpath to where Bruno and Molly are standing, perhaps 50 yards away.</p>",
      "<p>你探頭往牆下望去，能看到光線昏暗的纖道上，布魯諾和莫莉站在那裡，大約五十碼開外。</p>",
    );
    sAlt(
      "<p>Bruno is standing about 5 yards away from Molly and is having a pee.</p>",
      "<p>布魯諾站在離莫莉大約五碼的地方，正撒尿。</p>",
    );
    if (tuesday) {
      sAlt(
        "<p>Even from where you are, you can see his pee stream arcing against the wall. Molly is politely looking the other way, but from her pose, hands in jeans pockets and legs half crossed at the knee, it looks as if she might want to go too.</p>",
        "<p>就算隔著這段距離，你也能看到他的尿流弧線打在牆上。莫莉禮貌地望向另一邊，但看她的姿勢——雙手插在牛仔褲口袋裡，雙腿在膝蓋處微微交叉——看起來她自己可能也想小便。</p>",
      );
    } else {
      sAlt(
        "<p>Even from where you are, you can see his pee stream arcing against the wall. Molly is politely looking the other way, but from her pose, with legs half crossed at the knee, it looks as if she might want to go too.</p>",
        "<p>就算隔著這段距離，你也能看到他的尿流弧線打在牆上。莫莉禮貌地望向另一邊，但看她的姿勢——雙腿在膝蓋處微微交叉——看起來她自己可能也想小便。</p>",
      );
    }
    sAlt(
      "<p>Bruno shakes and zips up, moving back towards Molly. She gives him her handbag to hold and moves as if to go towards the wall.</p>",
      "<p>布魯諾抖了抖，拉上拉鍊，朝莫莉走回來。她把手提包遞給他幫忙拿，自己往牆邊走去。</p>",
    );
    sAlt(
      "<p>Diane says, ‘Come on,’ and touches your arm as if to pull you away. But you are not going to miss this. If she could watch Bruno, you can watch Molly!</p>",
      "<p>黛安說「走吧」，碰了碰你的手臂，像是要拉你離開。但你可不想錯過這一幕。她都能看布魯諾，你當然也能看莫莉！</p>",
    );
    cAlt("luckytrip4a", "You carry on watching.", "你繼續看著。");
  }
}
function luckytrip4a() {
  sAlt(
    "<p>Molly walks to the wall, close to where Bruno had just been. She is unbuckling her belt.</p>",
    "<p>莫莉走向牆邊，走到布魯諾剛才站的地方附近，正在解皮帶。</p>",
  );
  sAlt(
    "<p>She turns round and sees Bruno is watching her. She waves him away and you can hear a faint cry of ‘Look away.’ She waves again. But he is still looking towards her with what seems to be a grin.</p>",
    "<p>她轉過身，注意到布魯諾正盯著她看。她揮手叫他走開，你隱約聽到一聲「別看！」她又揮了揮手，但他依然看著她，嘴角好像還帶著笑。</p>",
  );

function pavilion4() {
  sAlt(
    "<p>You tell Molly you found her character really funny.</p>",
    "<p>你告訴莫莉，你覺得她演的那個角色特別好笑。</p>",
  );
  sAlt(
    "<p>MOLLY: Everyone always loves the scene where I’m desperate for the loo. I guess everyone knows the situation; you know, busting for a pee, but you’re in a situation where you can’t ask and have to try and keep up your decorum.</p>",
    "<p>莫莉：大家最喜歡的就是我憋到坐立難安那場。這種處境誰沒遇過嘛——急著想尿，偏偏還不能說，只能咬牙撐著，維持體面。</p>",
  );
  sAlt(
    "<p>DIANE: I’ve seen you like that in real life. Remember Rome?</p>",
    "<p>黛安：我在現實裡見過你那個樣子。還記得在羅馬的時候吧？</p>",
  );
  sAlt(
    "<p>MOLLY: You rotter. That’s private. Anyway, it was based on you. Remember Venice?</p>",
    "<p>莫莉：你這壞蛋。那是我的私事好嗎。再說了，那場戲靈感還來自你。還記得威尼斯嗎？</p>",
  );
  sAlt(
    "<p>Everyone laughs. You wish you could hear more – maybe one day you’ll get Diane to tell you.</p>",
    "<p>大家都笑了起來。你真希望能聽到更多——也許哪天能讓黛安跟你慢慢講。</p>",
  );
  cAlt("pavilion5", "You chat on.", "你們繼續聊著。");
}
function pavilion5() {
  sAlt(
    "<p>You talk about the play, and about the scene where Molly is dying for a pee.</p>",
    "<p>你們聊起了這齣戲，聊到莫莉憋尿憋到快崩潰的那場戲。</p>",
  );
  digestMolly(30);
  if (thursday) {
    sAlt(
      "<p>ROBERT: It’s the reality of an everyday situation that makes it so amusing. You push aside an inhibition and so everyone feels they can laugh. But, of course, no laughing matter in reality.</p>",
      "<p>羅伯特：正是因為取材自日常生活的真實處境，才會那麼好笑。打破那層禁忌，大家才能放開來笑。當然，現實裡真碰上了，可一點都不好笑。</p>",
    );
    sAlt(
      "<p>MOLLY: Well, I think girls laugh about it when they’re together, but generally you’re right.</p>",
      "<p>莫莉：嗯，我覺得女生私下湊在一起的時候會拿這個說笑，不過整體來說你說得對。</p>",
    );
  } else {
    sAlt(
      "<p>BRUNO: Robert seemed to take special pains to make sure that scene was right.</p>",
      "<p>布魯諾：羅伯特好像特別花心思，想把那場戲弄得真實一點。</p>",
    );
    sAlt(
      "<p>MOLLY: Too right. He seems to take a real interest. I’ve got my doubts about him.</p>",
      "<p>莫莉：可不是嘛。他對這個題材好像特別有興趣。我有點懷疑他的動機。</p>",
    );
    sAlt(
      "<p>BRUNO: One rehearsal he even told Molly not to go to the loo at lunchtime, so by the time we came to do that scene, she really did need to go.</p>",
      "<p>布魯諾：有一次排練，他甚至叫莫莉午飯時間不准去廁所，結果等到排那場戲的時候，她是真的想上廁所了。</p>",
    );
    sAlt(
      "<p>MOLLY: God, I was busting. Thought I was going to wee myself on stage. All in the name of art.</p>",
      "<p>莫莉：老天，我那時候憋得快炸了。以為自己要在台上尿褲子。都是為了藝術啊。</p>",
    );
    sAlt(
      "<p>BRUNO: It’s all part of method acting. But it was funny.</p>",
      "<p>布魯諾：這都是方法派表演的一部分。不過確實挺好笑。</p>",
    );
  }
  sAlt(
    "<p>There is a slight pause in the conversation. Maybe time for some drinks?</p>",
    "<p>談話間有片刻停頓。也許該再來一杯了？</p>",
  );
  if (pounds >= 7) cAlt("pavilion5a", "Yes, I’ll buy another round of drinks.", "好，我再請一輪。");
  cAlt("pavilion7", "No, I’m running out of money.", "不了，我快沒錢了。");
}

      "<p>MOLLY: Oh, yes, please. It’s nice and relaxing here. But just a half this time.</p>",

      "<p>莫莉：哦，好啊。這裡真的很舒服。再說了，你看看特惠，我那份免費——那就來一品脫吧。</p>",

  cAlt("pavilion6", "It’s your round.", "該你請這輪了。");

      "<p>黛安這次只想要一杯可樂，你便替她點了，順便替自己點了一杯啤酒，替布魯諾和莫莉各點了一品脫英式苦啤。</p>",

    mollyproc += 200;
    mollyblad += 30;

  cAlt("pavilion7", "Cheers!", "乾杯！");

    );
    sAlt(
      "<p>BRUNO: There are some interesting beers here. They’ve got a Riddles Ambernectar. I’d quite like to try it. Molly?</p>",
      "<p>布魯諾：這裡有幾款很有意思的啤酒。他們有里德爾斯琥珀花蜜啤酒，我很想嚐嚐。莫莉，你呢？</p>",
    );
    sAlt(
      "<p>MOLLY: I’d like to try it. Just a quick half, perhaps?</p>",
      "<p>莫莉：我也想試試。就來半品脫，好不好？</p>",
    );
    sAlt(
      "<p>Bruno goes up to the bar and gets four halves of Riddles Ambernectar. It’s a lovely golden beer. You all like it.</p>",
      "<p>布魯諾走到吧台，點了四杯半品脫的里德爾斯琥珀花蜜啤酒。那是一款色澤迷人的金黃色啤酒，大家都很喜歡。</p>",
    );
    mollyproc += 100;
    mollyblad += 30;

  );

    );

    );

    "<p>She hurries behind a car and you see her begin to hitch her dress up. But the sound of a group of approaching drunks frightens her away. She walks towards you, is only about 20 yards away, then suddenly stops and shoves a hand to her crotch, not through her pocket this time but openly.</p>",
    "<p>她急匆匆躲到一輛車後面，你看見她開始撩起裙子。可一群醉鬼的喧鬧聲嚇得她趕緊走開。她朝你這邊走來，只剩大概二十碼，突然停下腳步，這次不是隔著口袋，而是明明白白用手按住襠部。</p>",
  );
  sAlt(
    "<p>She looks around, all the time walking on the spot. You daren’t move from the shadows.</p>",
    "<p>她四處張望，腳下不停原地踏步。你不敢從陰影裡動彈。</p>",
  );
  sAlt(
    "<p>She goes up to a tourist information board, stands there a moment while the drunks pass. She is facing away from you, as if pretending to read the board. The drunks disappear into the distance and Diane looks to see if they have gone, but doesn’t move. She seems to be fiddling with her skirt, is bent slightly forward and then – </p>",
    "<p>她走到一塊旅遊資訊牌前，等醉鬼們經過時站在那裡。她背對著你，好像假裝在看牌子。醉鬼們漸漸遠去，黛安回頭看他們有沒有走遠，卻沒有移動。她好像在擺弄裙子，身子微微前傾，然後——</p>",
  );
  sAlt(
    "<p>She is peeing. She must have a hand beneath the front of her dress holding her knickers aside because a stream of pee is cascading to the ground, splattering on the pavement. The puddle sneaks across the pavement and across the kerb.</p>",
    "<p>她已經開始尿尿了。她一定是把一隻手伸到洋裝前擺底下，將內褲撥到一旁，因為一股尿流嘩嘩瀉到地面，濺在人行道上。尿蔓延過人行道，淌過路邊石。</p>",
  );
  blad = 0;
  cAlt("search1b", "Gosh!", "天哪！");
}
function search1b() {
  sAlt(
    "<p>Diane turns and moves away from the tourist information board, tidying down her dress, and bending to wipe her legs a little. But in her summer dress she looks as elegant as ever. She walks off through the car park towards the taxi rank, leaving you looking forward to your next date with her.</p>",
    "<p>黛安轉身從旅遊資訊牌前走開，理了理裙子，彎腰擦了擦腿。不過，穿著那件夏季洋裝的她，依然和往常一樣優雅。她穿過停車場向計程車站走去，留下你滿心期待下一次與她的約會。</p>",
  );
  cAlt(
    "consolation",
    "Your date may have ended early, but it’s not been without its reward.",
    "約會也許提前結束了，不過也不是毫無收穫。",
  );
}
function search2() {
  sAlt(
    "<p>You head back towards the Pavilion. You look left, you look right. There’s no sign of Diane.</p>",
    "<p>你往涼亭酒吧方向折返。你向左看，向右看。黛安不見蹤影。</p>",
  );
  sAlt(
    "<p>You look across the car park. Maybe she’s popped behind a car. But you can’t see her, just a few stragglers heading for their cars.</p>",
    "<p>你望向停車場。也許她躲到哪輛車後面尿尿去了。可你什麼都看不到，只有幾個零散的人在往各自的車走去。</p>",

    "<p>You look across to the main entrance to the Pavilion. There is a bouncer at the door.</p>",

      "I won’t be able to watch her in the club, so what’s the point?",
      "在俱樂部裡我也看不到她，那有什麼意思？",

    sAlt(

function luckytrip29a() {

function luckytrip28a() {
  sAlt(
    "<p>You carry on without using another luckshot.</p>",
    "<p>你沒有再使用幸運機會，繼續行動。</p>",
  );
  sAlt(
    "<p>But perhaps it’s just as well. Because the doorman hasn’t let her into the Pavilion.</p>",
    "<p>但或許這樣也好，因為門衛沒讓她進涼亭酒吧。</p>",
  );
  sAlt(
    "<p>She turns away from him, biting her lip in desperation. She walks away, then breaks into a half-run.</p>",
    "<p>她轉身離開，咬著嘴唇，憋得難受極了。走了幾步，她開始半跑起來。</p>",
  );
  sAlt(
    "<p>Once well away from the doorman, she stops. She looks left, she looks right. You see a hand go to her crotch, frantically holding herself. She obviously has to find somewhere – and soon! But the car park is almost empty, and there aren’t any obvious vehicles to go behind.</p>",
    "<p>離門衛夠遠了，她才停下來。她向左看，向右看。你看到她用手死死按住胯部，拼命夾著。她顯然非得趕快找個地方不可！但停車場幾乎空了，看不出有哪輛車適合讓她躲到後面。</p>",
  );
  sAlt(
    "<p>Over to your left, to the side of the hotel, are some large bins. Maybe she’ll head for them.</p>",
    "<p>你的左邊，飯店側面，有幾個大垃圾桶。也許她會往那邊去。</p>",
  );
  sAlt(
    "<p>To the right, to the edge of the car park, is a little Portakabin. Maybe she could pop behind that.</p>",
    "<p>右邊，停車場邊上，有一間小組合屋。也許她能躲到那後面。</p>",
  );
  sAlt(
    "<p>You should be able to have a view of both, but not at the same time. You have to anticipate and choose one or the other.</p>",
    "<p>兩個地方你應該都看得到，可沒法同時顧到。你得先判斷，選一邊。</p>",
  );
  cAlt("goleft", "Will she go left?", "她會往左走嗎？");
  cAlt("goright", "Or will she go right?", "還是往右走？");
}

function goleft3() {
