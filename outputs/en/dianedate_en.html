<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root {
  color-scheme: light;
  --paper: #fffaf2;
  --ink: #231f20;
  --muted: #71675c;
  --line: #dfd1bd;
  --accent: #9b2f3f;
  --accent-dark: #6f1f2c;
  --accent-strong: #6f1f2c;
  --on-accent: #ffffff;
  --choice: #fff;
  --choice-hover: #fff3df;
  --guide-hover-bg: #fff3df;
  --status: #f1e7d8;
  --hover-border: #c59c73;
  --highlight-bg: #f7e2e5;
  --ink-on-hover: #231f20;
  --em-color: #6f4a58;
  --box-shadow: 0 18px 50px rgba(59, 43, 25, .14);
  --box-shadow-mobile: 0 10px 28px rgba(59, 43, 25, .10);
  --body-bg-wash: linear-gradient(180deg, rgba(255,255,255,.70), rgba(255,255,255,.35)), #e9dcc8;
  --overlay-scrim: rgba(35, 31, 32, .55);
}

:root[data-theme="dark"] {
    color-scheme: dark;
    --paper: #221c17;
    --ink: #ede3d3;
    --muted: #948b82;
    --line: #3c2f26;
    --accent: #f0d060;
    --accent-dark: #f0d060;
    --accent-strong: #f6e48a;
    --on-accent: #221c17;
    --choice: #2b241e;
    --choice-hover: #534433;
    --guide-hover-bg: #5f4c32;
    --status: #2f2822;
    --hover-border: #c9a94a;
    --highlight-bg: #4a4024;
    --ink-on-hover: #faf6ee;
    --em-color: #e2c878;
    --box-shadow: 0 18px 50px rgba(0, 0, 0, .45);
    --box-shadow-mobile: 0 10px 28px rgba(0, 0, 0, .4);
    --body-bg-wash: linear-gradient(180deg, rgba(0,0,0,.35), rgba(0,0,0,.10)), #171310;
    --overlay-scrim: rgba(0, 0, 0, .7);
}

* { box-sizing: border-box; }

html {
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

body {
  margin: 0;
  min-height: 100vh;
  color: var(--ink);
  background: var(--body-bg-wash);
  font-family: Georgia, "Times New Roman", serif;
  font-size: 18px;
  line-height: 1.58;
}

a { color: inherit; }
a:hover { color: var(--accent-dark); }

.game-shell {
  width: min(920px, calc(100% - 32px));
  margin: 0 auto;
  padding: 36px 0;
}

#box {
  width: 100%;
  padding: clamp(22px, 4vw, 44px);
  border: 1px solid var(--line);
  background: var(--paper);
  box-shadow: var(--box-shadow);
  text-size-adjust: 100%;
  -webkit-text-size-adjust: 100%;
}

#box p {
  font-size: 1em;
  margin: 0 0 1em;
}

#box p.notice {
  margin: 0 0 1em;
}

/* Mid-page points notices: same rhythm as story paragraphs */
#box p:has(+ p.notice) {
  margin-bottom: 1em;
}

#box p.ending-congrats {
  margin: .25rem 0 1em;
  color: var(--accent-dark);
  font-size: clamp(1.25rem, 3vw, 1.65rem);
  line-height: 1.25;
}

#box p.note-lead {
  margin: 0 0 .35em;
  line-height: 1.45;
}

#box p.note-keys {
  margin: 0 0 .35em;
  line-height: 1.45;
}

/* Last line of a tight cluster → normal section gap after it */
#box p.note-cluster-end {
  margin-bottom: 1em;
}

#box p.venue-note {
  margin: .35rem 0 .4rem;
  color: var(--accent-dark);
  font-family: Georgia, "Times New Roman", serif;
  font-size: 1.06em;
  font-weight: 600;
  line-height: 1.4;
}

#box p.venue-note strong,
#box p.venue-note b {
  color: inherit;
  font-weight: 600;
}

#box hr {
  height: 1px;
  margin: 1.35rem 0;
  border: 0;
  background: var(--line);
}

#box h1,
#box h2 {
  margin: .2rem 0 1rem;
  color: var(--accent-dark);
  font-family: Georgia, "Times New Roman", serif;
  letter-spacing: 0;
}

#box h1 { font-size: clamp(1.8rem, 4vw, 2.75rem); }
#box h1.game-title {
  font-family: Georgia, "Times New Roman", serif;
}
#box h2 { font-size: clamp(1.25rem, 3vw, 1.85rem); }

#box div[align="center"],
#box .center {
  text-align: left;
}

#box span[style] {
  background: transparent !important;
  color: inherit !important;
}

#box em {
  color: var(--em-color);
}

#box strong,
#box b {
  color: var(--accent-dark);
}

#box ul,
#box .choices {
  margin: 1.45rem 0 0;
  padding: 0;
  list-style: none;
}

.choice + .choice {
  margin-top: 10px;
}

/* Screen fade on step change */
@keyframes diane-screen-fade {
  from { opacity: .42; }
  to { opacity: 1; }
}
#box.screen-fade {
  animation: diane-screen-fade .18s ease-out;
}
@media (prefers-reduced-motion: reduce) {
  #box.screen-fade { animation: none; }
}

#box li {
  margin: 0;
  padding: 0;
  list-style: none;
}

#box li::marker { content: ""; }

#box li a,
.choice,
.back-button {
  display: block;
  width: 100%;
  min-height: 44px;
  padding: 11px 14px;
  border: 1px solid var(--line);
  border-radius: 6px;
  color: var(--ink);
  background: var(--choice);
  font-family: Georgia, "Times New Roman", serif;
  font-size: 1rem;
  line-height: 1.35;
  text-align: left;
  text-decoration: none;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.choice.key-pressed {
  border-color: var(--hover-border);
  background: var(--choice-hover);
  color: var(--ink-on-hover);
}

@media (hover: hover) and (pointer: fine) {
  #box:not(.choice-key-armed) li a:hover,
  #box:not(.choice-key-armed) .choice:hover {
    border-color: var(--hover-border);
    background: var(--choice-hover);
    color: var(--ink-on-hover);
  }
  /* Guide pick: keep accent inset; fill uses --guide-hover-bg (dark: step off gold tray, not into ink range) */
  #box:not(.choice-key-armed) .choice.guide-highlight:hover {
    border-color: var(--hover-border);
    background: var(--guide-hover-bg);
    color: var(--ink-on-hover);
  }
}

.status-bar {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
  gap: 8px;
  margin-top: 24px;
  padding: 12px;
  border: 1px solid var(--line);
  background: var(--status);
  font-family: Georgia, "Times New Roman", serif;
  font-size: .92rem;
}

.status-bar span {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  color: var(--muted);
}

.status-bar b {
  color: var(--ink);
}

.nav-row {
  margin-top: 24px;
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

.back-button {
  width: auto;
  min-width: 120px;
  color: var(--on-accent);
  background: var(--accent);
  border-color: var(--accent);
  text-align: center;
}

@media (hover: hover) and (pointer: fine) {
  .back-button:hover {
    color: var(--on-accent);
    background: var(--accent-strong);
    border-color: var(--accent-strong);
  }
}

.guide-toggle-button {
  width: auto;
  min-width: 120px;
  padding: 11px 14px;
  border: 1px solid var(--accent);
  border-radius: 6px;
  font-family: Georgia, "Times New Roman", serif;
  font-size: 1rem;
  text-align: center;
  cursor: pointer;
}

.guide-toggle-on {
  background: var(--choice);
  color: var(--accent-dark);
}

.guide-toggle-off {
  background: transparent;
  color: var(--muted);
  border-color: var(--line);
}

.guide-toggle-button:hover {
  background: var(--choice-hover);
  border-color: var(--accent-dark);
}

.climax-skip-button {
  width: auto;
  min-width: 140px;
  padding: 11px 14px;
  border: 1px solid var(--accent);
  border-radius: 6px;
  font-family: Georgia, "Times New Roman", serif;
  font-size: 1rem;
  text-align: center;
  cursor: pointer;
  background: var(--choice);
  color: var(--accent-dark);
}

.climax-skip-button:hover {
  background: var(--choice-hover);
  border-color: var(--accent-dark);
}

.theme-toggle-button {
  width: auto;
  min-width: 120px;
  padding: 9px 12px;
  border: 1px solid var(--accent);
  border-radius: 6px;
  font-family: Georgia, "Times New Roman", serif;
  font-size: .94rem;
  text-align: center;
  cursor: pointer;
  background: transparent;
  color: var(--muted);
}

.theme-toggle-on {
  background: var(--choice);
  color: var(--accent-dark);
}

.theme-toggle-off {
  background: transparent;
  color: var(--muted);
  border-color: var(--line);
}

@media (hover: hover) and (pointer: fine) {
  .theme-toggle-button:hover {
    background: var(--choice-hover);
    border-color: var(--accent-dark);
  }
}

@media (max-width: 640px) {
  body { font-size: 16px; }
  .game-shell {
    width: 100%;
    padding: 10px 12px 16px;
  }
  #box {
    box-shadow: var(--box-shadow-mobile);
  }
}
.status-bar {
  display: block;
}

.status-row {
  display: grid;
  gap: 8px;
}

.status-row-main {
  grid-template-columns: repeat(3, minmax(0, 1fr));
}

.status-row-money {
  grid-template-columns: repeat(3, minmax(0, 1fr));
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px solid var(--line);
}

@media (max-width: 520px) {
  .status-bar {
    padding: 10px 8px;
    font-size: .78rem;
  }
  .status-row {
    gap: 6px;
  }
  .status-bar span {
    min-width: 0;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    text-align: center;
    overflow-wrap: anywhere;
  }
}

.choice.guide-highlight {
  border-color: var(--accent);
  box-shadow: 0 0 0 2px var(--accent) inset;
  background: var(--highlight-bg);
}

.choice.guide-highlight.key-pressed {
  border-color: var(--hover-border);
  background: var(--guide-hover-bg);
  color: var(--ink-on-hover);
}

.game-toolbar {
  display: flex;
  justify-content: flex-start;
  gap: 10px;
  margin-bottom: 16px;
}
.gallery-button {
  flex: 0 0 auto;
  min-width: 94px;
  padding: 9px 12px;
  border: 1px solid var(--accent);
  border-radius: 6px;
  color: var(--on-accent);
  background: var(--accent);
  font-family: Georgia, "Times New Roman", serif;
  font-size: .94rem;
  cursor: pointer;
}
.gallery-button:hover {
  background: var(--accent-strong);
  border-color: var(--accent-strong);
}

@media (max-width: 640px) {
  .game-toolbar {
    padding: 0;
    margin-bottom: 10px;
  }
}

.gallery-overlay {
  position: fixed;
  inset: 0;
  background: var(--overlay-scrim);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  opacity: 0;
  pointer-events: none;
  transition: opacity .25s ease;
  z-index: 50;
}
.gallery-overlay.open {
  opacity: 1;
  pointer-events: auto;
}
.gallery-panel {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 8px;
  width: 100%;
  max-width: 560px;
  max-height: 82vh;
  display: flex;
  flex-direction: column;
  box-shadow: 0 20px 60px rgba(0, 0, 0, .35);
  transform: translateY(14px) scale(.98);
  transition: transform .25s ease;
}
.gallery-overlay.open .gallery-panel {
  transform: translateY(0) scale(1);
}
.gallery-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px 20px 12px;
  border-bottom: 1px solid var(--line);
}
.gallery-header h2 {
  margin: 0;
  font-size: 1.2rem;
}
.gallery-close {
  border: 1px solid var(--line);
  background: var(--choice);
  color: var(--ink);
  border-radius: 6px;
  padding: 6px 12px;
  font-family: inherit;
  cursor: pointer;
}
.gallery-close:hover {
  border-color: var(--hover-border);
  background: var(--choice-hover);
}
.gallery-scroll {
  overflow-y: auto;
  padding: 4px 20px 20px;
}
.gallery-section h3 {
  margin: 16px 0 6px;
  font-size: .95rem;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: .04em;
}
.gallery-list {
  display: flex;
  flex-direction: column;
}
.gallery-list {
  --gallery-num-w: 1.85rem;
  --gallery-num-gap: 0.35rem;
}
.gallery-row {
  -webkit-appearance: none;
  appearance: none;
  display: grid;
  grid-template-columns: var(--gallery-num-w) minmax(0, 1fr) auto;
  column-gap: var(--gallery-num-gap);
  align-items: baseline;
  width: 100%;
  text-align: left;
  background: none;
  border: none;
  border-bottom: 1px solid var(--line);
  padding: 10px 4px 10px 2px;
  font-family: Georgia, "Times New Roman", serif;
  font-size: .95rem;
  color: var(--ink);
  cursor: pointer;
}
.gallery-index {
  width: var(--gallery-num-w);
  text-align: right;
  font-variant-numeric: tabular-nums;
  color: inherit;
}
.gallery-title {
  min-width: 0;
  color: inherit;
}
.gallery-row:hover {
  background: var(--choice-hover);
  color: var(--accent);
}
.gallery-row:focus {
  outline: none;
}
.gallery-row:focus-visible {
  background: var(--choice-hover);
  color: var(--accent);
}
.gallery-group-toggle::after {
  content: "▸";
  opacity: .55;
}
.gallery-group-toggle.gallery-group-open::after {
  content: "▾";
}
.gallery-variants {
  margin: 0 0 4px 0;
}
.gallery-variant {
  font-size: .9rem;
}

/* Matched control sizing only (colors stay as each button already defines) */
.gallery-button,
.language-toggle,
.back-button,
.guide-toggle-button,
.climax-skip-button,
.theme-toggle-button {
  box-sizing: border-box;
  min-height: 44px;
  padding: 10px 14px;
  font-size: 1rem;
  line-height: 1.25;
}

button:focus,
.choice:focus,
.back-button:focus,
.wiki-back-btn:focus,
.gallery-button:focus,
.language-toggle:focus,
.guide-toggle-button:focus,
.climax-skip-button:focus,
.theme-toggle-button:focus {
  outline: none;
}
</style>
</head>

function ensureStoryBlock(html) {
  var text = String(html).trim();

  text = text.replace(/^\(<p>/i, "<p>(");
  if (/^<(?:p|h1|h2|div|aside|hr)\b/i.test(text)) return text;

}

function balanceLegacyHtml(html) {
  var allowed = { p: 1, em: 1, strong: 1, span: 1, b: 1, h1: 1, h2: 1, div: 1 };
  var stack = [];
  var out = "";
  var last = 0;
  var tagRe = /<\/?([a-z][a-z0-9]*)(?:\s[^>]*)?>/gi;
  var match;
  while ((match = tagRe.exec(html))) {
    var full = match[0];
    var tag = match[1].toLowerCase();
    if (!allowed[tag] || /\/>$/.test(full)) continue;
    if (full.charAt(1) !== "/") {
      out += html.slice(last, tagRe.lastIndex);
      stack.push(tag);
      last = tagRe.lastIndex;
      continue;
    }
    var index = stack.lastIndexOf(tag);
    if (index < 0) {
      out += html.slice(last, match.index);
      last = tagRe.lastIndex;
      continue;
    }
    out += html.slice(last, match.index);
    while (stack.length - 1 > index) {
      out += "</" + stack.pop() + ">";
    }
    out += full;
    stack.pop();
    last = tagRe.lastIndex;
  }
  out += html.slice(last);
  while (stack.length) out += "</" + stack.pop() + ">";
  return out;
}
