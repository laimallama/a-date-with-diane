  --highlight-bg: #f7e2e5;
  --ink-on-hover: #231f20;
  --em-color: #6f4a58;

  --body-bg-wash: #f5eee5;
  --overlay-scrim: rgba(35, 31, 32, 0.55);
}

:root[data-theme="dark"] {

  --ink: #ede3d3;
  --muted: #948b82;
  --line: #3c2f26;
  --accent: #f0d060;
  --accent-dark: #f0d060;
  --accent-strong: #f6e48a;
  --on-accent: #221c17;
  --choice: #2b241e;

  --guide-hover-bg: #5f4c32;
  --status: #2f2822;
  --hover-border: #c9a94a;
  --highlight-bg: #4a4024;
  --ink-on-hover: #faf6ee;
  --em-color: #e2c878;
  --box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45);

  --body-bg-wash: #120f0c;
  --overlay-scrim: rgba(0, 0, 0, 0.7);
}

* {
  box-sizing: border-box;
}

html {
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
  background: var(--body-bg-wash);
}

body {
  margin: 0;
  min-height: 100vh;
  color: var(--ink);
  background: var(--body-bg-wash);
  font-family: Georgia, "Times New Roman", serif;
  font-size: 18px;
  line-height: 1.58;
}

a {
  color: inherit;
}
a:hover {
  color: var(--accent-dark);
}

.game-shell {
  width: min(920px, calc(100% - 32px));
  margin: 0 auto;
  padding: 36px 0;
}

#box {
  width: 100%;
  overflow-wrap: break-word;
  padding: clamp(22px, 4vw, 44px);
  border: 1px solid var(--line);
  background: var(--paper);
  box-shadow: var(--box-shadow);
  text-size-adjust: 100%;
  -webkit-text-size-adjust: 100%;
}

#box p {
  font-size: 1em;
  margin: 0 0 1em;
}

#box p.notice {
  margin: 0 0 1em;
}

/* Mid-page points notices: same rhythm as story paragraphs */
#box p:has(+ p.notice) {
  margin-bottom: 1em;
}

#box p.ending-congrats {
  margin: 0.25rem 0 1em;
  color: var(--accent-dark);
  font-size: clamp(1.25rem, 3vw, 1.65rem);
  line-height: 1.25;
}

#box p.note-lead {
  margin: 0 0 0.35em;
  line-height: 1.45;
}

#box p.note-keys {
  margin: 0 0 0.35em;
  line-height: 1.45;
}

/* Last line of a tight cluster → normal section gap after it */
#box p.note-cluster-end {
  margin-bottom: 1em;
}

#box p.venue-note {
  margin: 0.35rem 0 0.4rem;
  color: var(--accent-dark);
  font-family: Georgia, "Times New Roman", serif;
  font-size: 1.06em;
  font-weight: 600;
  line-height: 1.4;
}

#box p.venue-note strong,
#box p.venue-note b {
  color: inherit;
  font-weight: 600;
}

#box hr {
  height: 1px;
  margin: 1.35rem 0;
  border: 0;
  background: var(--line);
}

#box h1,
#box h2 {
  margin: 0.2rem 0 1rem;
  color: var(--accent-dark);
  font-family: Georgia, "Times New Roman", serif;
  letter-spacing: 0;
}

#box h1 {
  font-size: clamp(1.8rem, 4vw, 2.75rem);
}
#box h1.game-title {
  font-family: Georgia, "Times New Roman", serif;
}
#box h2 {
  font-size: clamp(1.25rem, 3vw, 1.85rem);
}

#box div[align="center"],
#box .center {
  text-align: left;
}

#box span[style] {
  background: transparent !important;
  color: inherit !important;
}

#box em {
  color: var(--em-color);
}

#box strong,
#box b {
  color: var(--accent-dark);
}

#box ul,
#box .choices {
  margin: 1.45rem 0 0;
  padding: 0;
  list-style: none;
}

.choice + .choice {
  margin-top: 10px;
}

/* Screen fade on step change */
@keyframes diane-screen-fade {
  from {
    opacity: 0.42;
  }
  to {
    opacity: 1;
  }
}
#box.screen-fade {
  animation: diane-screen-fade 0.18s ease-out;
}
@media (prefers-reduced-motion: reduce) {
  html {
    scroll-behavior: auto;
  }
  #box.screen-fade {
    animation: none !important;
  }
  .gallery-overlay,
  .gallery-panel {
    transition: none !important;
  }
}

#box li {
  margin: 0;
  padding: 0;
  list-style: none;
}

#box li::marker {
  content: "";
}

#box li a,
.choice,
.back-button {
  display: block;
  width: 100%;
  min-height: 44px;
  padding: 11px 14px;
  border: 1px solid var(--line);
  border-radius: 6px;
  color: var(--ink);
  background: var(--choice);
  font-family: Georgia, "Times New Roman", serif;
  font-size: 1rem;
  line-height: 1.35;
  text-align: left;
  text-decoration: none;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

.choice.key-pressed {
  border-color: var(--hover-border);
  background: var(--choice-hover);
  color: var(--ink-on-hover);
}

@media (hover: hover) and (pointer: fine) {
  #box:not(.choice-key-armed) li a:hover,
  #box:not(.choice-key-armed) .choice:hover {
    border-color: var(--hover-border);
    background: var(--choice-hover);
    color: var(--ink-on-hover);
  }
  /* Guide pick: keep accent inset; fill uses --guide-hover-bg (dark: step off gold tray, not into ink range) */
  #box:not(.choice-key-armed) .choice.guide-highlight:hover {
    border-color: var(--hover-border);
    background: var(--guide-hover-bg);
    color: var(--ink-on-hover);
  }
}

.status-bar {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
  gap: 8px;
  margin-top: 24px;
  padding: 12px;
  border: 1px solid var(--line);
  background: var(--status);
  font-family: Georgia, "Times New Roman", serif;
  font-size: 0.92rem;
}

.status-bar span {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  color: var(--muted);
}

.status-bar b {
  color: var(--ink);
}

.nav-row {
  margin-top: 24px;
}

.back-button {
  width: auto;
  min-width: 120px;
  color: var(--on-accent);
  background: var(--accent);
  border-color: var(--accent);
  text-align: center;
}

@media (hover: hover) and (pointer: fine) {
  .back-button:hover {
    color: var(--on-accent);
    background: var(--accent-strong);
    border-color: var(--accent-strong);
  }
}

@media (max-width: 640px) {
  body {
    font-size: 16px;
  }
  .game-shell {
    width: 100%;
    padding: 10px 12px 16px;
  }
  #box {
    box-shadow: var(--box-shadow-mobile);
  }
}
.status-bar {
  display: block;
}

.status-row {
  display: grid;
  gap: 8px;
}

.status-row-main {
  grid-template-columns: repeat(3, minmax(0, 1fr));
}

.status-row-money {
  grid-template-columns: repeat(3, minmax(0, 1fr));

  padding-top: 8px;
  border-top: 1px solid var(--line);
}

@media (max-width: 520px) {
  .status-bar {
    padding: 10px 10px;
    font-size: 0.78rem;

  .status-row {
    gap: 6px;

  .status-bar span {
    min-width: 0;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    text-align: center;
    overflow-wrap: break-word;
    word-break: keep-all;
  }
}

.game-toolbar {
  display: flex;
  justify-content: flex-start;
  gap: 10px;
  margin-bottom: 16px;
}

@media (max-width: 640px) {

}

}

.gallery-button {

  padding: 9px 12px;

  border-radius: 6px;
  color: var(--on-accent);

  font-family: Georgia, "Times New Roman", serif;
  font-size: 0.94rem;
  cursor: pointer;
}
.gallery-button:hover {
  background: var(--accent-strong);
  border-color: var(--accent-strong);
}

.gallery-overlay {
  position: fixed;
  inset: 0;
  background: var(--overlay-scrim);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s ease;
  z-index: 50;
}
.gallery-overlay.open {
  opacity: 1;
  pointer-events: auto;
}
.gallery-panel {

.gallery-header {

.gallery-list {

}
.gallery-row {
  -webkit-appearance: none;

  display: grid;
  grid-template-columns: var(--gallery-num-w) minmax(0, 1fr) auto;

  width: 100%;
  min-height: 44px;
  text-align: left;
  background: none;

  border-bottom: 1px solid var(--line);

}

  background: transparent;

@media (hover: hover) and (pointer: fine) {

.nav-row {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

/* Matched control sizing only (colors stay as each button already defines) */
.gallery-button,

  font-size: 1rem;

@media (max-width: 640px) {
  .theme-toggle-button {
    min-width: 0;
    height: 44px;
    min-height: 44px;
    padding: 8px 10px;
    font-size: 0.78rem;
    line-height: 1.15;
    white-space: nowrap;
  }
}

button:focus,
.choice:focus,
.back-button:focus,
.gallery-button:focus,
.language-toggle:focus,
.guide-toggle-button:focus,
.climax-skip-button:focus,
.theme-toggle-button:focus {

button[class]:focus-visible,
a[href]:focus-visible,
[tabindex]:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
}

function trapGalleryFocus(e, overlay) {
  if (e.key !== "Tab") return;
  var candidates = overlay.querySelectorAll("button, [href], input, select, textarea, [tabindex]");
  var focusable = [];
  for (var i = 0; i < candidates.length; i++) {
    if (
      !candidates[i].disabled &&
      candidates[i].tabIndex >= 0 &&
      candidates[i].offsetParent !== null
    )
      focusable.push(candidates[i]);
  }
  var first = focusable[0] || overlay;
  var last = focusable[focusable.length - 1] || overlay;
  var active = document.activeElement;
  if (
    !overlay.contains(active) ||
    (e.shiftKey && active === first) ||
    (!e.shiftKey && active === last)
  ) {
    e.preventDefault();
    (e.shiftKey ? last : first).focus();
  }
}
function openGallery() {

  if (!overlay || overlay.classList.contains("open")) return;
  clearAllHolds();
  clearChoiceKeyArm();
  galleryReturnFocus = document.activeElement;
  renderGalleryLists();
  overlay.removeAttribute("inert");
  overlay.classList.add("open");
  overlay.setAttribute("aria-hidden", "false");
  galleryInertNodes = [];
  var siblings = document.body.children || [];
  for (var i = 0; i < siblings.length; i++) {
    var node = siblings[i];
    if (node === overlay || /^(SCRIPT|STYLE|LINK)$/.test(node.tagName)) continue;
    galleryInertNodes.push({
      node: node,
      wasInert: node.hasAttribute("inert"),
    });
    node.setAttribute("inert", "");
  }
  var first = overlay.querySelector("button");
  if (first && typeof first.focus === "function") first.focus();
}
function closeGallery() {
  var overlay = document.getElementById("galleryOverlay");
  if (!overlay || !overlay.classList.contains("open")) return;
  clearAllHolds();
  clearChoiceKeyArm();
  overlay.classList.remove("open");
  overlay.setAttribute("inert", "");
  overlay.setAttribute("aria-hidden", "true");
  for (var i = 0; i < galleryInertNodes.length; i++) {
    if (!galleryInertNodes[i].wasInert) galleryInertNodes[i].node.removeAttribute("inert");
  }
  galleryInertNodes = [];
  var target = galleryReturnFocus;
  galleryReturnFocus = null;
  if (
    !target ||
    target === document.body ||
    !document.body.contains(target) ||
    target.offsetParent === null
  )
    target = document.getElementById("galleryToggle");
  if (target && typeof target.focus === "function") target.focus();
}
function digestionTick() {
  if (proc > 10) {
    if (tuesday) {
      if (tiramisu) {
        proc -= 10;
        blad += 12;
      } else {
        proc -= 10;
        blad += 11;
      }
    } else if (thursday) {
      if (icecream) {
        proc -= 10;
        blad += 10;
      } else {
        proc -= 10;
        blad += 12;
      }
    } else {
      if (pannacotta) {
        proc -= 10;
        blad += 12;
      } else {
        proc -= 10;
        blad += 10;
      }
    }
  } else {
    blad += proc;
    proc = 0;
  }
}

function initGuideFromStorage() {
  try {
    var raw = sessionStorage.getItem("dianeGuide");
    if (!raw) return;
    sessionStorage.removeItem("dianeGuide");
    var data = JSON.parse(raw);
    guideTags = data.tags;
    guideIndex = 0;
    guideActive = true;
    guideOn = true;
    climaxIndex = typeof data.climaxIndex === "number" ? data.climaxIndex : -1;
    climaxSkipUsed = false;
    var baseLength = data.baseLength || 0;
    for (var i = 0; i < baseLength; i++) {
      go(guideTags[i]);
    }
    syncGuideDisplay();
  } catch (e) {}
}

function applyGuideHighlight() {
  if (!guideActive || guideIndex >= guideTags.length) return;
  var expected = guideTags[guideIndex];
  var buttons = document.getElementById("box").querySelectorAll("button.choice");
  for (var i = 0; i < buttons.length; i++) {
    var m = (buttons[i].getAttribute("onclick") || "").match(/go\(['"]([^'"]+)['"]\)/);
    if (m && m[1] === expected) {
      buttons[i].className += " guide-highlight";
      return;
    }
  }
}

function startGuidedRoute(kind, index, variantIndex) {
  var item = GALLERY_DATA[kind][index];
  if (item.variants) {
    if (typeof variantIndex !== "number") return;
    item = item.variants[variantIndex];
  }
  var payload = {
    tags: item.tags,
    baseLength: item.baseLength,
  };
  if (typeof item.climaxIndex === "number") payload.climaxIndex = item.climaxIndex;
  sessionStorage.setItem("dianeGuide", JSON.stringify(payload));
  location.reload();
}

function go(tag) {
  if (!Object.prototype.hasOwnProperty.call(SCENES, tag)) throw new Error("Unknown scene: " + tag);
  try {
    clearChoiceKeyArm();
  } catch (e) {}
  if (currentTag) {
    gameHistory.push(snapshotGame());
    guideHistory.push({
      index: guideIndex,
      active: guideActive,
    });
  }
  if (guideActive) {
    if (tag === guideTags[guideIndex]) {
      guideIndex++;
      if (guideIndex >= guideTags.length) {
        guideActive = false;
      }
    } else {
      guideActive = false;
    }
  }
  currentTag = tag;
  try {
    document.getElementById("gameToolbar").style.display = "";
  } catch (e) {}
  var hideDateStats = HIDE_DATE_STATS_TAGS.indexOf(tag) !== -1;
  var showStats;
  if (tag === "gameover") {
    showStats = !holdDateStatsOff;
  } else {
    holdDateStatsOff = hideDateStats ? 1 : 0;
    showStats = PREGAME_TAGS.indexOf(tag) === -1 && !hideDateStats;
  }
  if (showStats) {
    if (!pregameCaughtUp) {
      pregameCaughtUp = true;
      pregameCatchupTick();
      pregameCatchupTick();
      pregameCatchupTick();
      pregameCatchupTick();
    }
    digestionTick();
  }
  document.getElementById("box").innerHTML = "";
  SCENES[tag]();
  finishChoiceBlock();
  if (showStats) {
    document.getElementById("box").innerHTML +=
      "<aside class='status-bar'>" +
      "<div class='status-row status-row-main'>" +
      "<span>Libras <b>" +

      blad +
      "ml</b></span>" +

      "</b></span>" +
