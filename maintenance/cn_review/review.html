<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CN 润色对照审阅（旧版 vs 新版）</title>
<style>
  :root {
    --bg: #f6f3ee;
    --card: #fffdf9;
    --ink: #1c1916;
    --muted: #6b645c;
    --line: #ddd4c8;
    --old: #f3e7e2;
    --new: #e7efe8;
    --pick: #2f5d50;
    --warn: #8a4b2a;
    --skip: #8a847c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Songti SC", "Noto Serif SC", "Source Han Serif SC", Georgia, serif;
    background:
      radial-gradient(1200px 600px at 10% -10%, #efe6d8 0%, transparent 55%),
      radial-gradient(900px 500px at 100% 0%, #e4ece7 0%, transparent 50%),
      var(--bg);
    color: var(--ink);
  }
  header {
    position: sticky; top: 0; z-index: 5;
    backdrop-filter: blur(10px);
    background: rgba(246,243,238,.92);
    border-bottom: 1px solid var(--line);
    padding: 12px 18px 14px;
  }
  h1 { margin: 0 0 6px; font-size: 1.25rem; font-weight: 650; }
  .meta { color: var(--muted); font-size: .9rem; margin-bottom: 10px; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .bar input[type="search"], .bar select {
    font: inherit; padding: 6px 10px; border: 1px solid var(--line);
    border-radius: 8px; background: #fff; min-width: 160px;
  }
  button {
    font: inherit; border: 1px solid var(--line); background: #fff;
    border-radius: 8px; padding: 7px 12px; cursor: pointer;
  }
  button:hover { border-color: #bbb; }
  button.primary { background: var(--pick); color: #fff; border-color: var(--pick); }
  button.oldbtn { background: #7a3e2e; color: #fff; border-color: #7a3e2e; }
  button.newbtn { background: var(--pick); color: #fff; border-color: var(--pick); }
  button.skipbtn { background: #ece8e2; color: var(--skip); }
  .progress {
    margin-top: 10px; height: 8px; background: #e8e1d7; border-radius: 99px; overflow: hidden;
  }
  .progress > i { display: block; height: 100%; width: 0; background: var(--pick); }
  main { max-width: 980px; margin: 0 auto; padding: 18px; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 16px 16px 14px; margin-bottom: 14px;
    box-shadow: 0 1px 0 rgba(0,0,0,.03);
  }
  .card.decided-old { outline: 2px solid #c78a76; }
  .card.decided-new { outline: 2px solid #7ea58f; }
  .card.decided-skip { opacity: .72; }
  .idrow {
    display: flex; justify-content: space-between; gap: 10px;
    color: var(--muted); font-size: .85rem; margin-bottom: 8px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .en {
    margin: 0 0 12px; padding: 10px 12px; background: #f3efe8;
    border-radius: 10px; line-height: 1.45;
  }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (max-width: 800px) { .cols { grid-template-columns: 1fr; } }
  .panel { border-radius: 10px; padding: 10px 12px; min-height: 88px; }
  .panel.old { background: var(--old); }
  .panel.new { background: var(--new); }
  .panel h3 { margin: 0 0 6px; font-size: .8rem; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); font-family: system-ui, sans-serif; }
  .panel p { margin: 0; white-space: pre-wrap; line-height: 1.55; }
  .empty { color: #a39a90; font-style: italic; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .hint { margin-top: 8px; color: var(--muted); font-size: .85rem; }
  footer {
    max-width: 980px; margin: 0 auto 40px; padding: 0 18px;
    color: var(--muted); font-size: .9rem;
  }
  .toast {
    position: fixed; right: 16px; bottom: 16px; background: #1c1916; color: #fff;
    padding: 10px 14px; border-radius: 10px; display: none; z-index: 9;
  }
</style>
</head>
<body>
<header>
  <h1>中文润色对照审阅</h1>
  <div class="meta" id="meta">正在加载 diff_data.json…</div>
  <div class="bar">
    <input id="q" type="search" placeholder="搜索 id / 英文 / 中文…" />
    <select id="kind">
      <option value="all">全部类型</option>
      <option value="story">story</option>
      <option value="choice">choice</option>
    </select>
    <select id="filter">
      <option value="undecided">只看未决定</option>
      <option value="all">全部</option>
      <option value="old">已选旧版</option>
      <option value="new">已选新版</option>
      <option value="skip">已跳过</option>
    </select>
    <button id="prev">上一条 (P)</button>
    <button id="next">下一条 (N)</button>
    <button class="oldbtn" id="pickOld">用旧版 (1)</button>
    <button class="newbtn" id="pickNew">用新版 (2)</button>
    <button class="skipbtn" id="pickSkip">跳过 (S)</button>
    <button id="exportBtn" class="primary">导出 decisions.json</button>
    <button id="importBtn">导入 decisions.json</button>
    <input id="importFile" type="file" accept="application/json,.json" hidden />
    <button id="resetBtn">清空本地选择</button>
  </div>
  <div class="progress"><i id="prog"></i></div>
  <div class="hint" id="stats"></div>
</header>
<main id="list"></main>
<footer>
  对照基准：fluency 大润色前（git <code>8d44c84</code>）vs 当前 CN。<br/>
  快捷键：<b>1</b> 旧版 · <b>2</b> 新版 · <b>S</b> 跳过 · <b>N</b> 下一条 · <b>P</b> 上一条。<br/>
  选择会自动存在浏览器 localStorage。导出 <code>decisions.json</code> 后运行：
  <code>python3 maintenance/cn_review/apply_decisions.py maintenance/cn_review/decisions.json</code>
</footer>
<div class="toast" id="toast"></div>
<script>
const STORAGE_KEY = 'adwd_cn_review_decisions_v1';
let data = null;
let decisions = {}; // id -> 'old' | 'new' | 'skip'
let viewIds = [];
let focusIndex = 0;

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.display = 'block';
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { el.style.display = 'none'; }, 1600);
}

function loadDecisions() {
  try { decisions = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}') || {}; }
  catch { decisions = {}; }
}
function saveDecisions() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(decisions));
  updateStats();
}

function updateStats() {
  if (!data) return;
  const total = data.items.length;
  let oldn = 0, newn = 0, skip = 0;
  for (const it of data.items) {
    const d = decisions[it.id];
    if (d === 'old') oldn++;
    else if (d === 'new') newn++;
    else if (d === 'skip') skip++;
  }
  const decided = oldn + newn + skip;
  document.getElementById('stats').textContent =
    `进度 ${decided}/${total}（旧版 ${oldn} · 新版 ${newn} · 跳过 ${skip} · 未定 ${total - decided}）· 当前列表 ${viewIds.length} 条`;
  document.getElementById('prog').style.width = (total ? (decided / total * 100) : 0) + '%';
}

function currentFiltered() {
  const q = document.getElementById('q').value.trim().toLowerCase();
  const kind = document.getElementById('kind').value;
  const filter = document.getElementById('filter').value;
  return data.items.filter(it => {
    if (kind !== 'all' && it.kind !== kind) return false;
    const d = decisions[it.id] || 'undecided';
    if (filter === 'undecided' && d !== 'undecided') return false;
    if (filter === 'old' && d !== 'old') return false;
    if (filter === 'new' && d !== 'new') return false;
    if (filter === 'skip' && d !== 'skip') return false;
    if (!q) return true;
    const blob = `${it.id} ${it.en} ${it.old} ${it.new}`.toLowerCase();
    return blob.includes(q);
  });
}

function render() {
  const items = currentFiltered();
  viewIds = items.map(it => it.id);
  const list = document.getElementById('list');
  list.innerHTML = '';
  if (!items.length) {
    list.innerHTML = '<p class="meta">没有匹配条目。</p>';
    updateStats();
    return;
  }
  if (focusIndex >= items.length) focusIndex = items.length - 1;
  if (focusIndex < 0) focusIndex = 0;

  for (let i = 0; i < items.length; i++) {
    const it = items[i];
    const d = decisions[it.id];
    const card = document.createElement('article');
    card.className = 'card' + (d ? ` decided-${d}` : '');
    card.id = 'card-' + it.id;
    card.dataset.id = it.id;
    card.innerHTML = `
      <div class="idrow"><span>${it.id} · ${it.kind || '?'}</span><span>${d ? '已选：' + ({old:'旧版',new:'新版',skip:'跳过'}[d]) : '未决定'}</span></div>
      <div class="en"><strong>EN</strong><br>${escapeHtml(it.en || '（无）')}</div>
      <div class="cols">
        <div class="panel old"><h3>旧版（润色前）</h3><p class="${it.old ? '' : 'empty'}">${escapeHtml(it.old || '（空）')}</p></div>
        <div class="panel new"><h3>新版（当前）</h3><p class="${it.new ? '' : 'empty'}">${escapeHtml(it.new || '（空）')}</p></div>
      </div>
      <div class="actions">
        <button class="oldbtn" data-act="old">用旧版</button>
        <button class="newbtn" data-act="new">用新版</button>
        <button class="skipbtn" data-act="skip">跳过</button>
      </div>`;
    card.querySelectorAll('button[data-act]').forEach(btn => {
      btn.addEventListener('click', () => decide(it.id, btn.dataset.act, true));
    });
    card.addEventListener('click', () => { focusIndex = i; highlightFocus(); });
    list.appendChild(card);
  }
  highlightFocus();
  updateStats();
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function highlightFocus() {
  document.querySelectorAll('.card').forEach(c => c.style.boxShadow = '');
  const id = viewIds[focusIndex];
  const el = document.getElementById('card-' + id);
  if (el) {
    el.style.boxShadow = '0 0 0 2px #2f5d50';
  }
}

function decide(id, choice, advance) {
  decisions[id] = choice;
  saveDecisions();
  const filter = document.getElementById('filter').value;
  if (filter === 'undecided' && advance) {
    // keep place: re-render removes decided item; stay on same index
    render();
  } else {
    const card = document.getElementById('card-' + id);
    if (card) {
      card.className = 'card decided-' + choice;
      card.querySelector('.idrow span:last-child').textContent = '已选：' + ({old:'旧版',new:'新版',skip:'跳过'}[choice]);
    }
    updateStats();
    if (advance) {
      focusIndex = Math.min(focusIndex + 1, Math.max(viewIds.length - 1, 0));
      const nextId = viewIds[focusIndex];
      const el = document.getElementById('card-' + nextId);
      if (el) el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      highlightFocus();
    }
  }
  toast(choice === 'old' ? '已选旧版' : choice === 'new' ? '已选新版' : '已跳过');
}

function exportDecisions() {
  if (!data) return;
  const out = {
    meta: {
      ...data.meta,
      exported_at: new Date().toISOString(),
      note: 'choice: old = restore baseline CN; new = keep current; skip = leave untouched for now'
    },
    decisions: {}
  };
  for (const it of data.items) {
    if (decisions[it.id]) out.decisions[it.id] = decisions[it.id];
  }
  const blob = new Blob([JSON.stringify(out, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'decisions.json';
  a.click();
  URL.revokeObjectURL(a.href);
  toast('已导出 decisions.json');
}

async function boot() {
  loadDecisions();
  const res = await fetch('./diff_data.json');
  data = await res.json();
  document.getElementById('meta').textContent =
    `基准 ${data.meta.baseline_commit} → 生成时 ${data.meta.generated_from} · 共 ${data.meta.count} 条差异`;
  render();

  document.getElementById('q').addEventListener('input', () => { focusIndex = 0; render(); });
  document.getElementById('kind').addEventListener('change', () => { focusIndex = 0; render(); });
  document.getElementById('filter').addEventListener('change', () => { focusIndex = 0; render(); });
  document.getElementById('prev').onclick = () => {
    focusIndex = Math.max(0, focusIndex - 1);
    const el = document.getElementById('card-' + viewIds[focusIndex]);
    if (el) el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    highlightFocus();
  };
  document.getElementById('next').onclick = () => {
    focusIndex = Math.min(viewIds.length - 1, focusIndex + 1);
    const el = document.getElementById('card-' + viewIds[focusIndex]);
    if (el) el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    highlightFocus();
  };
  document.getElementById('pickOld').onclick = () => viewIds[focusIndex] && decide(viewIds[focusIndex], 'old', true);
  document.getElementById('pickNew').onclick = () => viewIds[focusIndex] && decide(viewIds[focusIndex], 'new', true);
  document.getElementById('pickSkip').onclick = () => viewIds[focusIndex] && decide(viewIds[focusIndex], 'skip', true);
  document.getElementById('exportBtn').onclick = exportDecisions;
  document.getElementById('importBtn').onclick = () => document.getElementById('importFile').click();
  document.getElementById('importFile').onchange = async (ev) => {
    const f = ev.target.files && ev.target.files[0];
    if (!f) return;
    const text = await f.text();
    const parsed = JSON.parse(text);
    decisions = parsed.decisions || parsed;
    saveDecisions();
    render();
    toast('已导入');
  };
  document.getElementById('resetBtn').onclick = () => {
    if (!confirm('清空本机全部选择？')) return;
    decisions = {};
    saveDecisions();
    render();
  };

  window.addEventListener('keydown', (e) => {
    if (e.target.matches('input, textarea, select')) return;
    const id = viewIds[focusIndex];
    if (!id) return;
    if (e.key === '1') { e.preventDefault(); decide(id, 'old', true); }
    else if (e.key === '2') { e.preventDefault(); decide(id, 'new', true); }
    else if (e.key === 's' || e.key === 'S') { e.preventDefault(); decide(id, 'skip', true); }
    else if (e.key === 'n' || e.key === 'N') { document.getElementById('next').click(); }
    else if (e.key === 'p' || e.key === 'P') { document.getElementById('prev').click(); }
  });
}
boot().catch(err => {
  document.getElementById('meta').textContent = '加载失败：请用本地静态服务打开本目录（见 README）。' + err;
});
</script>
</body>
</html>
