    <style>
      :root { --cjk-font: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", Arial, Helvetica, sans-serif; }
:root {

  --paper: #fffaf2;
  --ink: #231f20;
  --muted: #71675c;
  --line: #dfd1bd;
  --accent: #9b2f3f;
  --accent-dark: #6f1f2c;
  --accent-strong: #6f1f2c;
  --on-accent: #ffffff;
  --choice: #fff;
  --choice-hover: #fff3df;
  --guide-hover-bg: #fff3df;
  --status: #f1e7d8;

  --overlay-scrim: rgba(35, 31, 32, 0.55);
  --body-font: var(--cjk-font);
  --ui-font: var(--cjk-font);
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #221c17;
  --ink: #ede3d3;
  --muted: #9b9289;
  --line: #3c2f26;
  --accent: #f0d060;
  --accent-dark: #f0d060;
  --accent-strong: #f6e48a;
  --on-accent: #221c17;
  --choice: #2b241e;
  --choice-hover: #534433;
  --guide-hover-bg: #5f4c32;
  --status: #2f2822;
  --hover-border: #c9a94a;
  --highlight-bg: #4a4024;
  --ink-on-hover: #faf6ee;
  --em-color: #e2c878;
  --box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
  --box-shadow-mobile: 0 10px 28px rgba(0, 0, 0, 0.4);
  --body-bg-wash: #120f0c;
  --overlay-scrim: rgba(0, 0, 0, 0.7);
}

* {
  box-sizing: border-box;
}

html {
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
  background: var(--body-bg-wash);
}

body {
  margin: 0;
  min-height: 100vh;
  color: var(--ink);
  background: var(--body-bg-wash);
  font-family: var(--body-font);
  font-size: 18px;
  line-height: 1.58;
}

body.lang-en {
  --body-font: Georgia, "Times New Roman", serif;
  --ui-font: Georgia, "Times New Roman", serif;
}

body.lang-alt {
  --body-font: var(--cjk-font);
  --ui-font: var(--cjk-font);
}

body.lang-en #box p.venue-note,
body.lang-en #box h1,
body.lang-en #box h2 {
  font-family: var(--body-font);
}

a {
  color: inherit;
}
a:hover {
  color: var(--accent-dark);
}

.game-shell {
  width: min(920px, calc(100% - 32px));
  margin: 0 auto;
  padding: 36px 0;
}

#box {
  width: 100%;
  overflow-wrap: break-word;
  padding: clamp(22px, 4vw, 44px);
  border: 1px solid var(--line);
  background: var(--paper);
  box-shadow: var(--box-shadow);
  text-size-adjust: 100%;
  -webkit-text-size-adjust: 100%;
}

#box p {
  font-size: 1em;
  margin: 0 0 1em;
}

#box p.notice {
  margin: 0 0 1em;
}

/* Mid-page points notices: same rhythm as story paragraphs */
#box p:has(+ p.notice) {
  margin-bottom: 1em;
}

#box p.ending-congrats {
  margin: 0.25rem 0 1em;
  color: var(--accent-dark);
  font-size: clamp(1.25rem, 3vw, 1.65rem);
  line-height: 1.25;
}

#box p.note-lead,
#box p.note-keys {
  margin: 0 0 0.5em;
  line-height: 1.45;
}

#box p.note-keys:last-of-type {
  margin-bottom: 1em;
}

#box p.venue-note {
  margin: 0.35rem 0 0.4rem;
  color: var(--accent-dark);
  font-family: var(--ui-font);
  font-size: 1.06em;
  font-weight: 600;
  line-height: 1.4;
}

#box p.venue-note strong,
#box p.venue-note b {
  color: inherit;
  font-weight: 600;
}

#box hr {
  height: 1px;
  margin: 1.35rem 0;
  border: 0;
  background: var(--line);
}

#box h1,
#box h2 {
  margin: 0.2rem 0 1rem;
  color: var(--accent-dark);
  font-family: var(--ui-font);
  letter-spacing: 0;
}

#box h1 {
  font-size: clamp(1.8rem, 4vw, 2.75rem);
}
#box h1.game-title {
  font-family: var(--body-font);
}
#box h2 {
  font-size: clamp(1.25rem, 3vw, 1.85rem);
}

#box div[align="center"],
#box .center {
  text-align: left;
}

#box span[style] {
  background: transparent !important;
  color: inherit !important;
}

#box em {
  color: var(--em-color);
}

#box strong,
#box b {
  color: var(--accent-dark);
}

#box ul,
#box .choices {
  margin: 1.45rem 0 0;
  padding: 0;
  list-style: none;
}

.choice + .choice {
  margin-top: 10px;
}

/* Screen fade on step change */
@keyframes diane-screen-fade {
  from {
    opacity: 0.42;
  }
  to {
    opacity: 1;
  }
}
#box.screen-fade {
  animation: diane-screen-fade 0.18s ease-out;
}
@media (prefers-reduced-motion: reduce) {
  html {
    scroll-behavior: auto;
  }
  #box.screen-fade {
    animation: none !important;
  }
  .gallery-overlay,
  .gallery-panel {
    transition: none !important;
  }
}

#box li {
  margin: 0;
  padding: 0;
  list-style: none;
}

#box li::marker {
  content: "";
}

#box li a,
.choice,
.back-button {
  display: block;
  width: 100%;
  min-height: 44px;
  padding: 11px 14px;
  border: 1px solid var(--line);
  border-radius: 6px;
  color: var(--ink);
  background: var(--choice);
  font-family: var(--ui-font);
  font-size: 1rem;
  line-height: 1.35;
  text-align: left;
  text-decoration: none;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

.choice.key-pressed {
  border-color: var(--hover-border);
  background: var(--choice-hover);
  color: var(--ink-on-hover);
}

@media (hover: hover) and (pointer: fine) {
  #box:not(.choice-key-armed) li a:hover,
  #box:not(.choice-key-armed) .choice:hover {
    border-color: var(--hover-border);
    background: var(--choice-hover);
    color: var(--ink-on-hover);
  }
  /* Guide pick: keep accent inset; fill uses --guide-hover-bg (dark: step off gold tray, not into ink range) */
  #box:not(.choice-key-armed) .choice.guide-highlight:hover {
    border-color: var(--hover-border);
    background: var(--guide-hover-bg);
    color: var(--ink-on-hover);
  }
}

.status-bar {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
  gap: 8px;
  margin-top: 24px;
  padding: 12px;
  border: 1px solid var(--line);
  background: var(--status);
  font-family: var(--ui-font);
  font-size: 0.92rem;
}

.status-bar span {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  color: var(--muted);
}

.status-bar b {
  color: var(--ink);
}

.nav-row {
  margin-top: 24px;
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

.guide-toggle-button {
  width: auto;
  min-width: 120px;
  padding: 11px 14px;
  border: 1px solid var(--accent);
  border-radius: 6px;
  font-family: var(--ui-font);
  font-size: 1rem;
  text-align: center;
  cursor: pointer;
}
.guide-toggle-on {
  background: var(--choice);
  color: var(--accent-dark);
}
.guide-toggle-off {
  background: transparent;
  color: var(--muted);
  border-color: var(--line);
}
.guide-toggle-button:hover {
  color: var(--ink-on-hover);
  background: var(--choice-hover);
  border-color: var(--accent-dark);
}

.climax-skip-button {
  width: auto;
  min-width: 140px;
  padding: 11px 14px;
  border: 1px solid var(--accent);
  border-radius: 6px;
  font-family: var(--ui-font);
  font-size: 1rem;
  text-align: center;
  cursor: pointer;
  background: var(--choice);
  color: var(--accent-dark);
}

.climax-skip-button:hover {
  background: var(--choice-hover);
  border-color: var(--accent-dark);
}

.theme-toggle-button {
  width: auto;
  min-width: 0;
  margin-left: auto;
  padding: 9px 12px;
  border: 1px solid var(--accent);
  border-radius: 6px;
  font-family: var(--ui-font);
  font-size: 0.94rem;
  text-align: center;
  cursor: pointer;
  background: transparent;
  color: var(--muted);
}

.theme-toggle-on {
  background: var(--choice);
  color: var(--accent-dark);
}

.theme-toggle-off {
  background: transparent;
  color: var(--muted);
  border-color: var(--line);
}

@media (hover: hover) and (pointer: fine) {
  .theme-toggle-button:hover {
    color: var(--ink-on-hover);
    background: var(--choice-hover);
    border-color: var(--accent-dark);
  }
}

.back-button {
  width: auto;
  min-width: 120px;
  color: var(--on-accent);
  background: var(--accent);
  border-color: var(--accent);
  text-align: center;
}

@media (hover: hover) and (pointer: fine) {
  .back-button:hover {
    color: var(--on-accent);
    background: var(--accent-strong);
    border-color: var(--accent-strong);
  }
}

@media (max-width: 640px) {
  body {
    font-size: 16px;
  }
  .game-shell {
    width: 100%;
    padding: 10px 12px 16px;
  }
  #box {
    box-shadow: var(--box-shadow-mobile);
  }
}
.status-bar {
  display: block;
}

.status-row {
  display: grid;
  gap: 8px;
}

.status-row-main {
  grid-template-columns: repeat(3, minmax(0, 1fr));
}

.status-row-money {
  grid-template-columns: repeat(3, minmax(0, 1fr));
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px solid var(--line);
}

@media (max-width: 520px) {
  .status-bar {
    padding: 10px 10px;
    font-size: 0.78rem;
  }
  .status-row {
    gap: 6px;
  }
  .status-bar span {
    min-width: 0;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    text-align: center;
    overflow-wrap: break-word;
    word-break: keep-all;
  }
}

.game-toolbar {
  display: flex;
  justify-content: flex-start;
  align-items: center;
  gap: 10px;
  margin-bottom: 16px;
}

.language-toggle {
  flex: 0 0 auto;
  box-sizing: border-box;
  min-width: 94px;
  min-height: 40px;
  padding: 9px 12px;
  border: 1px solid var(--accent);
  border-radius: 6px;
  color: var(--on-accent);
  background: var(--accent);
  font-family: var(--ui-font);
  font-size: 0.94rem;
  line-height: 1.25;
  cursor: pointer;
}

.language-toggle:hover {
  color: var(--on-accent);
  background: var(--accent-strong);
  border-color: var(--accent-strong);
}

/* Toggle label is always the other language, so its font must follow the label, not the page. */
body.lang-alt .language-toggle {
  font-family: Georgia, "Times New Roman", serif;
}
body.lang-en .language-toggle {
  font-family: var(--cjk-font);
}

body.lang-alt .lang-en,
body.lang-en .lang-alt {
  display: none !important;
}

@media (max-width: 640px) {
  .game-toolbar {
    padding: 0;
    margin-bottom: 10px;
    align-items: center;
    flex-wrap: wrap;
  }
  .theme-toggle-button {
    min-width: 0;
    height: 44px;
    min-height: 44px;
    padding: 8px 10px;
    font-size: 0.78rem;
    line-height: 1.15;
    white-space: nowrap;
  }
}

.choice.guide-highlight {
  border-color: var(--accent);
  box-shadow: 0 0 0 2px var(--accent) inset;
  background: var(--highlight-bg);
}

.choice.guide-highlight.key-pressed {
  border-color: var(--hover-border);
  background: var(--guide-hover-bg);
  color: var(--ink-on-hover);
}

.gallery-button {
  flex: 0 0 auto;
  box-sizing: border-box;
  min-width: 94px;
  min-height: 40px;
  padding: 9px 12px;
  border: 1px solid var(--accent);
  border-radius: 6px;
  color: var(--on-accent);
  background: var(--accent);
  font-family: var(--ui-font);
  font-size: 0.94rem;
  line-height: 1.25;
  cursor: pointer;
}
.gallery-button:hover {
  background: var(--accent-strong);
  border-color: var(--accent-strong);
}

.gallery-overlay {
  position: fixed;
  inset: 0;
  background: var(--overlay-scrim);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s ease;
  z-index: 50;
}
.gallery-overlay.open {
  opacity: 1;
  pointer-events: auto;
}
.gallery-panel {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 8px;
  width: 100%;
  max-width: 560px;
  max-height: 82vh;
  display: flex;
  flex-direction: column;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
  transform: translateY(14px) scale(0.98);
  transition: transform 0.25s ease;
}
.gallery-overlay.open .gallery-panel {
  transform: translateY(0) scale(1);
}
.gallery-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px 20px 12px;
  border-bottom: 1px solid var(--line);
}
.gallery-header h2 {
  margin: 0;
  font-size: 1.2rem;
  font-family: var(--ui-font);
}
.gallery-close {
  border: 1px solid var(--line);
  background: var(--choice);
  color: var(--ink);
  border-radius: 6px;
  min-height: 44px;
  padding: 10px 12px;
  font-family: var(--ui-font);
  cursor: pointer;
  touch-action: manipulation;
}
.gallery-close:hover {
  border-color: var(--hover-border);
  background: var(--choice-hover);
}
.gallery-scroll {
  overflow-y: auto;
  padding: 4px 20px 20px;
}
.gallery-section h3 {
  margin: 16px 0 6px;
  font-size: 0.95rem;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.04em;
  font-family: var(--ui-font);
}
.gallery-list {
  display: flex;
  flex-direction: column;
}
.gallery-list {
  --gallery-num-w: 1.85rem;
  --gallery-num-gap: 0.35rem;
}
.gallery-row {
  -webkit-appearance: none;
  appearance: none;
  display: grid;
  grid-template-columns: var(--gallery-num-w) minmax(0, 1fr) auto;
  column-gap: var(--gallery-num-gap);
  align-items: center;
  width: 100%;
  min-height: 44px;
  text-align: left;
  background: none;
  border: none;
  border-bottom: 1px solid var(--line);
  padding: 0 4px 0 2px;
  line-height: 1.3;
  font-family: var(--ui-font);
  font-size: 0.95rem;
  color: var(--ink);
  cursor: pointer;
  touch-action: manipulation;
}
.gallery-index {
  width: var(--gallery-num-w);
  text-align: right;
  font-variant-numeric: tabular-nums;
  color: inherit;
  line-height: inherit;
}
.gallery-title {
  min-width: 0;
  color: inherit;
  line-height: inherit;
}
.gallery-list > .gallery-row:last-child,
.gallery-list > .gallery-group:last-child > .gallery-row {
  border-bottom: none;
}
.gallery-list > .gallery-group:last-child > .gallery-group-toggle.gallery-group-open {
  border-bottom: 1px solid var(--line);
}
.gallery-list > .gallery-group:last-child .gallery-variants:not([hidden]) .gallery-row:last-child {
  border-bottom: none;
}
.gallery-row:hover {
  background: var(--choice-hover);
  color: var(--accent);
}
.gallery-row:focus {
  outline: none;
}
.gallery-row:focus-visible {
  background: var(--choice-hover);
  color: var(--accent);
}
.gallery-group-toggle::after {
  content: "▸";
  opacity: 0.55;
}
.gallery-group-toggle.gallery-group-open::after {
  content: "▾";
}
.gallery-variants {
  margin: 0 0 4px 0;
}
.gallery-variant {
  font-size: 0.9rem;
}

/* Matched control sizing only (colors stay as each button already defines) */
.gallery-button,
.language-toggle,
.back-button,
.guide-toggle-button,
.climax-skip-button,
.theme-toggle-button {
  box-sizing: border-box;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  min-height: 44px;
  padding: 10px 14px;
  font-size: 1rem;
  line-height: 1.25;
  touch-action: manipulation;
}
@media (max-width: 640px) {
  .theme-toggle-button {
    min-width: 0;
    height: 44px;
    min-height: 44px;
    padding: 8px 10px;
    font-size: 0.78rem;
    line-height: 1.15;
    white-space: nowrap;
  }
}

button:focus,
.choice:focus,
.back-button:focus,
.gallery-button:focus,
.language-toggle:focus,
.guide-toggle-button:focus,
.climax-skip-button:focus,
.theme-toggle-button:focus {
  outline: none;
}

/* Restore a visible keyboard focus indicator after the pointer-focus reset. */
button:focus-visible,
button[class]:focus-visible,
a[href]:focus-visible,
[tabindex]:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
}

function getinti(p) {
  renderBuffers.en += intimacyNotice(p, INTIMACY_EN);

function captureDesp(fn) {
  var last = "";
  var original = sAlt;
  sAlt = function (en, alt) {
    if (en || alt)
      last = {
        en: en,
        alt: alt,
      };
  };
  try {
    fn();
  } finally {
    sAlt = original;
  }
  return last;
}
function printCapturedDesp(html) {
  if (html) {
    var print = sAlt;
    print(html.en, html.alt);
  }
}
function start() {
  sAlt(
    "<h1 class='game-title'><strong><div class='center'><span style='background: #ffff00; color: #000000'>A Date with Diane</span></div></strong></h1>",
    "<h1 class='game-title'><strong><div class='center'><span style='background: #ffff00; color: #000000'>与黛安约会</span></div></strong></h1>",
  );
  sAlt("<HR>", "<HR>");
  sAlt(
    "<p>The goal of the game is to get your girlfriend desperate on a date. It is not guaranteed! Along the way you may have other pleasures: see her take a pee, even go into the loo with her, have her tell you about a desperation experience, spot another desperate girl, etc. It’s that simple. Intimacy points indicate how much she’s into you, and she might abandon the date if they sink too low. She will also abandon the date if she wets herself in public, and will probably never see you again, so you mustn’t let that happen.</p>",
    "<p>这个游戏的目标是让你的女朋友在约会时憋到尿急难耐。不过，这可不一定能成！一路上你还可能碰上别的刺激场面：看她撒尿，甚至陪她进厕所，听她讲自己憋尿的经历，或者撞见另一个憋得快不行的女孩子，等等。就是这么简单。“亲密度”代表她有多喜欢你。如果亲密度降得太低，她可能会直接结束约会。如果她当众尿湿自己，她也会立刻走人——而且很可能再也不想见你了，所以千万别让事情失控到那一步。</p>",
  );
  cAlt("start1", "A few notes about the game.", "关于游戏的几点说明。");
  cAlt(
    "start1a",
    "I’ve already read them. I’ll get straight on with the game.",
    "我已经看过了，直接开始游戏。",
  );
}
function start1() {
  sAlt(
    "<p>There are five different successful endings, or ‘winning results’, rated in order. See if you can get them all!</p>",
    "<p>共有五种不同的成功结局，也就是按等级排列的“获胜结局”。看看你能不能全部达成！</p>",
  );
  sAlt(
    "<p>There are also a few consolation endings, and you might even be able to win a date with Amanda.</p>",
    "<p>此外还有几个安慰奖结局，你甚至有机会和阿曼达约会。</p>",
  );
  sAlt(
    "<p>The <strong>bladder</strong> meter shows how much Diane’s holding. What’s in her <strong>tummy</strong> slowly flows into her <strong>bladder</strong> as time passes. Also, you get <strong>3 luckshots</strong> that you should use wisely when offered, and remember, they can bring bad luck too! Note that you cannot use more than one of these at the end of the evening, once you’ve got the bus or taxi home.</p>",
    "<p><strong>膀胱</strong>仪表显示黛安正憋着多少尿。她<strong>肚子</strong>里的水分会随时间慢慢流进<strong>膀胱</strong>。另外，你有<strong>3次幸运机会</strong>，出现时要明智使用；别忘了，它们也可能带来坏运气！注意，一旦你坐上回家的公交车或出租车，当晚结束时最多只能再用一次。</p>",
  );
  sAlt(
    "<p>Don’t expect to sleep with her on this first date, but you might get some fun if you play your cards right. And never forget: women are funny creatures.</p>",
    "<p>别指望第一次约会就能和她上床，但如果你应对得当，也许还能尝到点甜头。永远别忘了：女人总是让人捉摸不透。</p>",
  );
  sAlt(
    "<p>As the evening progresses, your <strong>intimacy</strong> points should rise, and they naturally affect what you can do. In some scenes, <strong>shyness</strong> points also come into play, and the number earned or lost by the time you arrive home can influence events. In some scenarios a high figure helps; in others, a low figure helps, so this works rather like a joker card.</p>",
    "<p>随着约会进行，你的<strong>亲密度</strong>通常会逐渐上升，自然也会影响你能做哪些事。有些场景还会用到<strong>害羞值</strong>；到家时这个数值的高低也会影响后续事件。有时高一点更有利，有时反而低一点更有利，所以它更像一张百搭牌。</p>",
  );
  sAlt(
    "<p>You start with <strong>£100</strong>. Keep an eye on your money. You might want some for a taxi home at the end of the evening.</p>",
    "<p>开局你有<strong>100英镑</strong>。留意你的钱。晚上结束时你可能需要留一些打车回家。</p>",
  );
  sAlt(
    "<p>There are lots of variations, so do play the game right through a few times. But on Tuesdays and Thursdays you will also find a shorter version.</p>",
    "<p>游戏里有不少分支，建议完整多玩几遍。但周二和周四也会提供较短的版本。</p>",
  );
  sAlt(
    "<p class='note-lead'>The Gallery at the top left offers guided routes to the prize endings, consolation endings and hidden scenes. Use it if you get stuck or simply want to explore. Some entries expand to reveal a choice of scenes. On a phone or tablet, use the on-screen buttons; on a computer, you can also use these shortcuts:</p>",
    "<p class='note-lead'>左上角的剧情图鉴提供通往奖励结局、安慰奖结局和隐藏场景的引导路线。遇到困难时可以参考，也可以用来探索剧情。有些项目展开后会显示多个场景，选择想看的即可。在手机或平板上，请使用屏幕上的按钮；在电脑上，还可以使用以下快捷键：</p>",
  );
  sAlt(
    "<p class='note-keys'><strong>G</strong> opens the Gallery (<strong>Esc</strong> closes it).</p>",
    "<p class='note-keys'><strong>G</strong>键打开剧情图鉴（<strong>Esc</strong>键关闭）。</p>",
  );
  sAlt(
    "<p class='note-keys'><strong>H</strong> turns the Guide on or off once you’ve chosen a route from the Gallery.</p>",
    "<p class='note-keys'>从图鉴选择路线后，可按<strong>H</strong>键开启或关闭引导。</p>",
  );
  sAlt(
    "<p class='note-keys'><strong>D</strong> turns Dark Mode on or off.</p>",
    "<p class='note-keys'><strong>D</strong>键开启或关闭深色模式。</p>",
  );
  sAlt(
    "<p class='note-keys'>Use the <strong>number keys</strong> to choose an option.</p>",
    "<p class='note-keys'>用<strong>数字键</strong>选择选项。</p>",
  );
  sAlt(
    "<p class='note-keys'><strong>Enter</strong> selects the highlighted choice while the Guide is on. Hold the key to fast-forward; release it to stop.</p>",
    "<p class='note-keys'>引导开启时，按<strong>Enter</strong>键可选择高亮的选项。按住可快进，松开即停。</p>",
  );
  sAlt(
    "<p class='note-keys'>The ‘Back’ button returns you to the previous page and restores your stats and choices. This works in Guide mode too.</p>",
    "<p class='note-keys'>“返回”按钮会让你回到上一页，同时恢复当时的数值和选项。跟随引导时也可以使用。</p>",
  );
  sAlt(
    "<p class='note-keys note-follow'><strong>B</strong> does the same as the ‘Back’ button. Hold the key to rewind quickly; release it to stop.</p>",
    "<p class='note-keys note-follow'><strong>B</strong>键的效果和“返回”按钮一样。按住可快速倒退，松开即停。</p>",
  );
  sAlt(
    "<p class='note-keys'>While following a Guide to an ending, press the ‘Skip to the good bit!’ button (or <strong>S</strong>) to jump to the story’s climax. You can still go back to an earlier point afterwards. To skip again, choose an ending from the Gallery.</p>",
    "<p class='note-keys'>跟随结局引导时，按“跳到精彩部分！”按钮（或<strong>S</strong>键）可直接跳到故事的高潮。之后仍可返回更早的页面。若想再次跳过，需要从图鉴选择一个结局。</p>",
  );
  sAlt(
    "<p class='note-keys note-follow'>Turning the Guide off hides the skip button and stops fast-forward. You can turn it back on as long as you stay on the route. If you take a different branch, the Guide ends. Go back to where you branched off to make it available again.</p>",
    "<p class='note-keys note-follow'>关闭引导会隐藏跳过按钮，并停止快进。只要仍在原路线上，就可以重新开启。如果选择其他分支，引导就会结束。返回到分岔前的页面后，即可再次使用引导。</p>",
  );
  cAlt("start1a", "Start the game.", "开始游戏。");
  cAlt("info", "Further information.", "更多信息。");
}

function eatmeal1a() {
  sAlt(
    "<p>You are both eating your food, which is very good. You have a sip of wine and she has a sip, and she drinks some more water.</p>",

  );
  sAlt(
    "<p>Your pizza is great. Lots of spicy pepperoni, and peppers, and other things. The only trouble is, there is so much of it you will be eating long after Diane has finished.</p>",
    "<p>你的披萨棒极了——满满的辣味意大利香肠、彩椒，还有好多其他配料。唯一的麻烦是，分量实在太足，等黛安吃完了，你还得吃上好一阵。</p>",

  );
  sAlt(
    "<p>DIANE: I can’t really forget it, can I! Fancy us both missing the last bus home. I was really glad you were there – I’m not sure I had enough on me for the taxi fare home.</p>",
    "<p>黛安：那怎么可能忘！我们俩都错过了末班车，真没想到。幸好你在——我那时候身上的钱好像不够打车回家。</p>",
  );
  sAlt("<p>YOU: How did you come to miss the bus?</p>", "<p>你：你怎么会错过那班车的？</p>");
  sAlt("<p>She blushes and grins at you.</p>", "<p>她脸红了，朝你咧嘴一笑。</p>");
  sAlt(

function eatmeal1b() {
  sAlt(
    "<p>DIANE: And how was it <em>you</em> managed to miss the last bus home?</p>",
    "<p>黛安：那<em>你</em>又是怎么错过末班车的？</p>",
  );
  sAlt(
    "<p>YOU: Well, I have to admit, it was like you. I just popped to the loo, and when I came back, the bus had gone.</p>",
    "<p>你：说来惭愧，跟你一样。我就是去了趟厕所，回来的时候车已经走了。</p>",
  );
  sAlt(
    "<p>DIANE: Really? You found a loo at that hour?</p>",
    "<p>黛安：真的？那么晚你还能找到厕所？</p>",
  );
  sAlt("<p>YOU: Well, I went in the car park...</p>", "<p>你：呃……我是在停车场解决的……</p>");
  sAlt(
    "<p>DIANE: Lucky we didn’t bump into each other! That would have been even more embarrassing.</p>",
    "<p>黛安：幸好我们没撞上！那才真的尴尬死了。</p>",
  );
  sAlt("<p>YOU: Yes.</p>", "<p>你：是啊。</p>");
  sAlt(
    "<p><span style='color: #ff3333'>Of course, you know exactly why she missed the bus, because you’d seen her. She’d been absolutely desperate for a pee and had fled the bus stop looking for somewhere to go. She’d gone behind a minibus and by the time she returned to the bus stop, the bus had gone. You’re hoping you can see her desperate again.</span></p>",
    "<p><span style='color: #ff3333'>当然，你很清楚她为什么错过车——因为你亲眼看见了。她当时尿急得快忍不住了，慌忙离开站台，四处找地方解决。她躲到一辆小巴后面，等她回到站台，车早就没了。你希望还能再看到她那么急着上厕所的样子。</span></p>",
  );
  sAlt("<p>You top up both the wine glasses.</p>", "<p>你给两只酒杯都续上了酒。</p>");
  proc += 50;
  sAlt("<p>DIANE: Thank you!</p>", "<p>黛安：谢谢！</p>");
  cAlt("eatmeal1c", "You carry on chatting.", "你们继续聊天。");
}

  cAlt("ownjob", "Talk about your job?", "聊聊你的工作？");
  cAlt("herjob", "Ask her about her job?", "问问她做什么工作？");
  cAlt("stamptalk", "Tell her about your stamp collection?", "跟她讲讲你的集邮爱好？");
  cAlt("cartalk", "Talk about cars? You’ve just bought a new BMW.", "聊聊车？你刚买了辆新宝马。");
  cAlt("traintalk", "Talk about trains?", "聊聊火车？");
  cAlt("asklootalk", "Ask if she wants a pee?", "问她要不要去尿尿？");
}
function asklootalk() {
  sAlt(
    "<p><b>Are you mad?</b> The conversation may have dried up, but you had no reason to ask her if she wanted a pee.</p>",
    "<p><b>你疯了吗？</b>就算没话聊了，你也没理由问她想不想尿尿。</p>",
  );
  sAlt(
    "<p>Perhaps you are some sort of pervert. Perhaps you imagine her fidgeting about, shifting up and down on the chair, crossing her legs, but too shy to tell you she wants to go to the loo. Maybe you even want her to get more and more desperate. If so, shame on you!</p>",
    "<p>也许你有点变态。也许你幻想她在椅子上坐立不安、扭来扭去、双腿交叉，却害羞得不敢说想尿尿。说不定你还盼着她越来越憋不住。要真是这样，你可真该害臊！</p>",
  );
  sAlt(
    "<p>Luckily a sudden clatter at another table means she didn’t hear you. So she asks you to repeat what you said.</p>",
    "<p>幸好邻桌突然传来一阵响动，她没听见你说的话，于是让你再说一遍。</p>",
  );
  sAlt("<p>This time you say: ‘Do you want a coffee?’</p>", "<p>这次你说：“要不要来杯咖啡？”</p>");
  sAlt(
    "<p>DIANE: Yes, I’d love a coffee. Just an ordinary filter coffee.</p>",
    "<p>黛安：好啊，我很想喝咖啡。普通滴滤咖啡就行。</p>",
  );
  proc += 60;
  cAlt("asklootalk1", "You order two coffees.", "你们点了两杯咖啡。");
}
function asklootalk1() {
  buyfiltercoffee = 2;
  pounds -= 2;
  sAlt(
    "<p>You wait for the coffees. Maybe your unheard question has had a subliminal effect, because – </p>",
    "<p>你们等着咖啡上来。也许你那句没被听见的问题，还是在她潜意识里起了点作用，因为——</p>",
  );
  sAlt(
    "<p>DIANE: While we’re waiting for the coffees, I think I’ll go and freshen up before the play.</p>",
    "<p>黛安：趁咖啡还没来，我想在看戏前先去梳洗一下。</p>",
  );
  sAlt(
    "<p>She gets up, takes her handbag and heads off to the Ladies.</p>",
    "<p>她站起来，拎起手包，朝女厕所走去。</p>",
  );
  afterpee();
  sAlt(
    "<p>After two or three minutes she returns, looking very relaxed.</p>",
    "<p>两三分钟后她回来了，看起来轻松多了。</p>",
  );
  cAlt("asklootalk2", "You smile at her.", "你对她微微一笑。");
}
function asklootalk2() {
  sAlt(
    "<p>You drink your coffees. The waiter comes and you settle your bill.</p>",
    "<p>你们喝完咖啡。服务员过来，你结了账。</p>",
  );

}
function ownjob() {

    "<p>你向她介绍了自己的工作，提到明天有个晋升面试。</p>",
  );
  sAlt(
    "<p>DIANE: Oh, well, we must toast to that. Just half a glass, though.</p>",
    "<p>黛安：哦，那我们得为此干一杯。就喝半杯吧。</p>",
  );
  proc += 40;
  sAlt("<p>YOU: Thanks.</p>", "<p>你：谢谢。</p>");
  sAlt("<p>DIANE: To your job interview!</p>", "<p>黛安：为你的面试干杯！</p>");
  sAlt("<p>She toasts it with her wine.</p>", "<p>她举起酒杯，祝你面试顺利。</p>");
  sAlt("<p>And she blows you a kiss across the table.</p>", "<p>她隔着桌子向你飞了个吻。</p>");

function herjob() {
  movingtalking = 1;
  sAlt("<p>YOU: What is your job like?</p>", "<p>你：你的工作怎么样？</p>");
  sAlt(
    "<p>DIANE: I work for the estate agent opposite the church. But it’s very quiet at the moment and I’m half expecting to be made redundant at any time. I think I might move to London and try something else.</p>",
    "<p>黛安：我在教堂对面那家房产中介上班。不过现在生意很冷清，我随时都可能被裁掉。我在考虑要不要去伦敦找点别的工作试试。</p>",
  );
  sAlt("<p>YOU: Oh! That would be a shame.</p>", "<p>你：哦！那真是太可惜了。</p>");
  sAlt("<p>DIANE: Come on, you hardly know me.</p>", "<p>黛安：得了吧，你又不怎么了解我。</p>");
  getinti(-3);
  cAlt("eatmeal5d", "That bit of conversation didn’t really work.", "那个话题聊得不太顺。");
}
function stamptalk() {
  sAlt(
    "<p>DIANE: Do you have any special interests? All men have hobbies, don’t they?</p>",
    "<p>黛安：你有什么特别的兴趣爱好吗？男人都有自己的爱好嘛。</p>",
  );
  sAlt(
    "<p>YOU: Actually, I’ve got a really good stamp collection. It’s something I’ve built up since I was a boy.</p>",
    "<p>你：其实，我有一套很不错的邮票收藏。从小就开始攒的，一直坚持到现在。</p>",
  );
  sAlt(
    "<p>DIANE: My brother used to collect stamps. But I think that was just a passing phase.</p>",
    "<p>黛安：我哥哥以前也集邮。不过我觉得那只是一时兴起。</p>",
  );
  sAlt(
    "<p>YOU: I think lots of boys collect them but it sort of developed as I got to know more about them. Then I started to specialise and nowadays I just collect British Empire stamps from the 1940s and ’50s. The other day I bought a Rhodesian twopenny stamp from 1945, and it was great because it gave me a full set of the standard issue for that year.</p>",
    "<p>你：很多男孩小时候都集过邮，但随着我了解得越来越多，慢慢就认真钻研起来了。后来开始专门研究某一类，现在我只收集20世纪四五十年代的大英帝国邮票。前几天我买到了一枚1945年的罗得西亚两便士邮票，太开心了，因为这样我就凑齐了那一年发行的全套普通邮票。</p>",
  );
  sAlt(
    "<p>Diane giggles. Then she stops herself and reaches over and touches your hand. ‘I’m sorry,’ she says, ‘I shouldn’t laugh. But men get so enthusiastic about the strangest hobbies. It’s really sweet.’</p>",
    "<p>黛安咯咯笑了起来。接着她忍住笑，伸手摸了摸你的手。“对不起，”她说，“我不该笑的。但男人嘛，总是对最奇怪的爱好充满热情。其实真的挺可爱的。”</p>",
  );
  getinti(3);
  stampstalking = 1;
  cAlt("eatmeal5d", "You carry on chatting.", "你们继续聊天。");
}
function cartalk() {
  sAlt("<p>DIANE: Did you get the bus here?</p>", "<p>黛安：你是坐公交车来的吗？</p>");
  sAlt(
    "<p>YOU: Yes, but only because I knew I’d be drinking some wine. I really enjoy driving.</p>",
    "<p>你：是的，因为知道今晚要喝酒。我其实很喜欢开车。</p>",
  );
  sAlt("<p>DIANE: Oh.</p>", "<p>黛安：哦。</p>");
  sAlt(
    "<p>YOU: Yes. I really love cars. I’ve just bought a new BMW coupe. I bought it second-hand but it’s a model I’ve really been looking out for and I got it at a tremendous price. You’ll have to come out for a ride in it one day.</p>",
    "<p>你：是啊，我特别喜欢车。我刚买了一辆宝马双门轿跑。买的是二手的，但这款车我心仪已久，这次价格也非常划算。改天你一定要来坐坐。</p>",
  );
  sAlt(
    "<p>DIANE: Oh, I don’t think that’s my sort of thing. I think they’re such a waste of money. After all, four wheels are four wheels, aren’t they? And just think of the global warming they cause! I had a boyfriend once who was just obsessed with cars, just wanted to drive around all day. I’ve never been so bored in my life.</p>",
    "<p>黛安：哦，那不太合我的口味。我觉得买车简直是在浪费钱。毕竟，四个轮子就是四个轮子，对吧？而且想想它们造成的全球变暖！我以前有个男朋友就痴迷于汽车，整天只想开车兜风。那是我这辈子最无聊的时光。</p>",
  );
  sAlt("<p>YOU: But they are useful – </p>", "<p>你：但车还是很实用的——</p>");
  sAlt(
    "<p>DIANE: He didn’t even want to go anywhere special. You’d go flying down one motorway, then another, then another. He’d rabbit on about this A-road and that B-road, and about how many miles he got to the gallon. And he never, ever wanted to stop, not even if you were bursting for the toilet. It put me off cars for life.</p>",
    "<p>黛安：他根本不想去什么特别的地方。就沿着一条高速公路飞驰，再换另一条，再换另一条。他一路喋喋不休地讲这条A级公路、那条B级公路，说每加仑能跑多少英里。哪怕你急着上厕所、快憋疯了，他也永远不想停车。从此我就对汽车彻底没了兴趣。</p>",
  );
  getinti(-8);
  cAlt("eatmeal5d", "Remember not to mention cars again.", "记住，下次别再提车了。");
}
function traintalk() {
  sAlt(
    "<p>DIANE: What do you do with your time off?</p>",
    "<p>黛安：那你平时空闲时间都做什么？</p>",
  );
  sAlt(
    "<p>YOU: Well, it probably makes me sound a bit of an anorak, but I love trains. Diesel and steam, I find them all fascinating. I travel miles, and last year a friend and I travelled all over Switzerland on their trains, right up into the Alps.</p>",
    "<p>你：嗯，这么说可能让人觉得我有点无趣，但我就是热爱火车。内燃机车也好，蒸汽机车也好，我觉得都迷人得很。我会坐火车去很远的地方。去年我和一个朋友搭乘当地的火车走遍了瑞士，一直坐到了阿尔卑斯山区。</p>",
  );
  sAlt("<p>DIANE: That’s great. I like trains too.</p>", "<p>黛安：太棒了。我也喜欢火车。</p>");
  sAlt("<p>YOU: Really?</p>", "<p>你：真的吗？</p>");
  sAlt(
    "<p>DIANE: Girls can like trains as well, you know, and anyway I love travel and trains are so much greener than cars, so much better for the environment. They have to be the most civilised way to travel. Last year when we went to Naples, we went all the way by train.</p>",
    "<p>黛安：女生也可以喜欢火车的，你知道吗？再说了，我本来就热爱旅行。而且火车比汽车环保得多。坐火车绝对是最体面的出行方式了。去年我们去那不勒斯时，全程都是坐火车。</p>",
  );
  sAlt(
    "<p>YOU: That sounds great. I also enjoy going to the steam railways and have had lessons in how to drive a steam engine. Maybe you’d come with me one day.</p>",
    "<p>你：听起来太棒了。我也喜欢去参观蒸汽铁路，还专门学过怎么驾驶蒸汽机车。也许哪天你可以跟我一起去。</p>",
  );
  sAlt("<p>DIANE: I’d really like that.</p>", "<p>黛安：我很乐意。</p>");
  getinti(10);
  traintalking = 1;
  cAlt("traintalk1", "Gosh!", "天哪！");
}
function traintalk1() {
  sAlt(
    "<p>DIANE: My dad used to work on the railways – he was a driver on the East Coast line – so I guess that’s why I like them so much. We’ve had lots of chances for free travel over the years.</p>",
    "<p>黛安：我爸爸以前在铁路部门工作——当时是东海岸线的火车司机——所以我想这就是我这么喜欢火车的原因吧。这些年来我们有很多免费旅行的机会。</p>",
  );
  sAlt("<p>YOU: Have you been on Eurostar to Paris?</p>", "<p>你：你坐过欧洲之星去巴黎吗？</p>");
  sAlt(
    "<p>DIANE: Oh yes, we used that when we went by train to Naples. Mind you, we did break the journey once or twice on the way.</p>",
    "<p>黛安：当然坐过，我们去那不勒斯那次就坐了欧洲之星。不过途中也停留过一两次。</p>",
  );
  sAlt("<p>You carry on talking about trains.</p>", "<p>你们继续聊着火车。</p>");
  getinti(5);
  cAlt("traintalk2", "Carry on chatting.", "继续聊天。");
}

function eatmeal6b() {
  sAlt("<p>YOU: What have you been doing today?</p>", "<p>你：你今天都做什么了？</p>");

    "<p>DIANE: We were actually busy for once. We had some clients who are moving into the area and I had to show them five different houses. I just hope they buy one of them.</p>",
    "<p>黛安：我们今天难得忙了一回。有几位客户要搬到这一带来，我得带他们看五套不同的房子。希望他们能买其中一套。</p>",
  );

    sAlt(
      "<p>DIANE: Oh yes. There was just time for a big refreshing mug of tea with a friend before dashing here. But I hope I look OK?</p>",

    proc += 100;

    "<p>DIANE: Thank you! Shall I pour us some more wine?</p>",

  cAlt("eatmeal6c", "You carry on chatting.", "你们继续聊天。");

}

function buytiramisu() {
  if (pounds >= 10) {

function musictalka() {

  proc += 5;
  digestMolly(30);
  if (spagbol) {
    sAlt(
      "<p>DIANE: Oh, I love music. Molly and I normally go to at least one festival each year. We’ve been to Glastonbury, and the Isle of Wight, but the best one of all was Roskilde a few years back. I’d never been to Denmark, so that was a real treat.</p>",
      "<p>黛安：哦，我特别喜欢音乐。莫莉和我一般每年至少会去一次音乐节。我们去过格拉斯顿伯里，也去过怀特岛，但最棒的一次是几年前的罗斯基勒音乐节。我以前从没去过丹麦，所以那次真的太开心了。</p>",
    );
    sAlt(
      "<p>YOU: I’ve been to one or two. I quite like the smaller festivals, really. I went to Glastonbury a few years back and it just seemed too big. And muddy, of course – it rained all the time.</p>",
      "<p>你：我也去过一两次。说真的，我更喜欢规模小一点的音乐节。几年前去格拉斯顿伯里，感觉太大了。当然，还有泥——一直在下雨嘛。</p>",
    );
    getinti(5);
    sAlt(
      "<p>DIANE: That’s the risk, isn’t it? At Roskilde the weather was lovely, though the facilities were a bit basic.</p>",
      "<p>黛安：这就得看运气了，对吧？罗斯基勒那次天气很好，不过设施就有点简陋了。</p>",
    );
    sAlt(
      "<p>YOU: I think they’ve improved those, haven’t they? Better toilets and so on.</p>",
      "<p>你：我觉得后来改善了不少吧，厕所什么的都好多了。</p>",
    );
    sAlt(
      "<p>DIANE: There are never enough for us girls. At Roskilde we ended up going by the fence and Molly got really caught out. Some creep took her photo and put it on the web. She wasn’t best amused but we all found it hilarious.</p>",
      "<p>黛安：对我们女生来说厕所永远不够用。在罗斯基勒，我们最后只能跑到围栏边上撒尿，结果莫莉正好被人抓拍了。有个变态把照片发到了网上。她当时气得够呛，不过我们其他人都笑翻了。</p>",
    );
    sAlt(
      "<p>You make a mental note to look for that.</p>",
      "<p>你暗暗记下，回头一定要去找找那张照片。</p>",
    );
  } else {
    sAlt(
      "<p>DIANE: Oh, I love music. I sing in a choir and I play the cello, so I’ve always been fond of music. Classical mostly, though I like musicals. And recently I’ve been to the opera and that was marvellous. I just want to learn more about it. And you?</p>",
      "<p>黛安：哦，我特别爱音乐。我参加了一个合唱团，还拉大提琴，一直对音乐很着迷。主要是古典乐，不过我也喜欢音乐剧。最近去听了歌剧，简直太美妙了，我真想多了解一些。你呢？</p>",
    );
    sAlt(
      "<p>You’re a bit flummoxed. You don’t really know much about music and you’ve never been to the opera. So you waffle and she quickly becomes bored. You have the horrid feeling that you are out of your depth.</p>",
      "<p>你有些手足无措。你对音乐其实了解不多，也从没看过歌剧。于是你胡乱说了些有的没的，她很快就显得无聊起来。你有种糟糕的感觉——自己已经接不上话了。</p>",
    );
    getinti(-5);
  }
  if (blad > 650 && blad <= 750) {
    sAlt(
      "<p>The conversation falters. She is hurrying you along.</p>",
      "<p>对话陷入了沉默。她催着你快点走。</p>",
    );

    sAlt(

      "<p>她根本没在认真听你说话，心思明显放在别处。</p>",

    getinti(-10);
  } else if (!spagbol) {

      "<p>你真希望自己没有扯起这个话题。</p>",
    );

  cAlt("riverside12", "You carry on walking.", "你们继续走着。");
}

    );
    sAlt(
      "<p>MOLLY: God, I was busting. Thought I was going to wee myself on stage. All in the name of art.</p>",
      "<p>莫莉：老天，我那时候憋得快炸了。以为自己要在台上尿裤子。都是为了艺术嘛。</p>",
    );
    sAlt(
      "<p>BRUNO: It’s all part of method acting. But it was funny.</p>",
      "<p>布鲁诺：这都是方法派表演的一部分。不过确实挺好笑的。</p>",
    );
  }
  sAlt(
    "<p>There is a slight pause in the conversation. Maybe time for some drinks?</p>",
    "<p>谈话间有片刻的停顿。也许是时候再来一杯了？</p>",
  );
  if (pounds >= 7) cAlt("pavilion5a", "Yes, I’ll buy another round of drinks.", "好，我再请一轮。");
  cAlt("pavilion7", "No, I’m running out of money.", "不了，我快没钱了。");
}
function pavilion5a() {
  sAlt("<p>YOU: Would everyone like another drink?</p>", "<p>你：大家还想再喝一杯吗？</p>");
  if (saturday) {
    sAlt(
      "<p>MOLLY: Oh, yes, please. It’s nice and relaxing here. But just a half this time.</p>",
      "<p>莫莉：哦，好啊。这里真的很舒服，让人放松。不过这次就来半品脱吧。</p>",
    );
  } else {
    sAlt(
      "<p>MOLLY: Oh, yes, please. It’s nice and relaxing here. Anyway, look at the Special Offers. Mine will be free – so I’ll have a pint.</p>",
      "<p>莫莉：哦，好啊。这里真的很舒服，让人放松。再说了，你看看特惠活动，我的那份是免费的——那就来一品脱吧。</p>",
    );
  }
  cAlt("pavilion6", "It’s your round.", "该你请这轮了。");
}
function pavilion6() {
  if (pounds < 7) {
    sAlt("<p>You don’t have enough money!</p>", "<p>你的钱不够了！</p>");
    cAlt("pavilion7", "No, I’m running out of money.", "不了，我快没钱了。");
    return;
  }
  sAlt("<p>You get the drinks in.</p>", "<p>你去买了饮料。</p>");
  pounds -= 7;
  if (thursday) {
    sAlt(
      "<p>Diane just wants a mineral water this time, so you get that for her, a beer for yourself, a pint of Best for Molly and a glass of wine for Robert.</p>",
      "<p>黛安这次只想要一杯矿泉水，你便为她点了，顺便为自己点了一杯啤酒，为莫莉点了一品脱英式苦啤，为罗伯特点了一杯葡萄酒。</p>",
    );
    mollyproc += 200;
    mollyblad += 30;
    proc += 120;
  } else if (saturday) {
    sAlt(
      "<p>Diane just wants a half of shandy this time, so you get that for her, a beer for yourself, a pint of Best for Bruno and a half for Molly.</p>",
      "<p>黛安这次只想要半品脱香迪，你便为她点了，顺便为自己点了一杯啤酒，为布鲁诺点了一品脱英式苦啤，为莫莉点了半品脱。</p>",
    );
    mollyproc += 100;
    mollyblad += 30;
    proc += 120;
  } else {
    sAlt(
      "<p>Diane just wants a coke this time, so you get that for her, a beer for yourself, a pint of Best for Bruno and a pint for Molly.</p>",
      "<p>黛安这次只想要一杯可乐，你便为她点了，顺便为自己点了一杯啤酒，为布鲁诺和莫莉各点了一品脱英式苦啤。</p>",
    );
    mollyproc += 200;
    mollyblad += 30;
    proc += 120;
  }
  sAlt("<p>You take the drinks back to the table.</p>", "<p>你把饮料端回桌子。</p>");
  cAlt("pavilion7", "Cheers!", "干杯！");
}
function pavilion7() {
  sAlt(
    "<p>You chat about this and you chat about that.</p>",
    "<p>你们东聊西聊，什么都聊了一点。</p>",
  );
  sitting_desp();
  if (!bottlewater) {
    sAlt(
      "<p>Perhaps you’d like to buy a bottle of water in case you get thirsty on the way home?</p>",
      "<p>也许你想买一瓶水，以备回家路上口渴时用？</p>",
    );
    cAlt("buywaterpav", "Good idea.", "好主意。");
    cAlt("pavilion8", "No, I can’t afford it.", "不了，我负担不起。");
  } else {
    cAlt("pavilion8", "You carry on chatting.", "你们继续聊天。");
  }
}
function buywaterpav() {
  sAlt("<p>You go to the bar.</p>", "<p>你走向吧台。</p>");
  if (pounds >= 3) {
    sAlt("<p>You buy a bottle of water.</p>", "<p>你买了一瓶水。</p>");
    bottlewater = 1;
    pounds -= 3;
  } else sAlt("<p>You don’t have enough money!</p>", "<p>你的钱不够！</p>");
  cAlt("pavilion8", "Return to the beer garden.", "回到啤酒花园。");
}
function pavilion8() {
  sAlt(
    "<p>It’s almost 11 o’clock. The barman calls, ‘Last orders, please.’</p>",
    "<p>快十一点了。酒保喊道：“最后点单了，请抓紧！”</p>",
  );
  if (blad > 600) {
    sAlt(
      "<p>Diane seems to be shifting about a bit.</p>",
      "<p>黛安似乎有些坐立不安，动来动去的。</p>",
    );
    sAlt(
      "<p class='notice'><strong>Diane needs the loo at The Pavilion. You gained 3 shyness points.</strong></p>",
      "<p class='notice'><strong>黛安在凉亭酒吧里尿急了。你获得了3点害羞值。</strong></p>",
    );
    adjpoints(3);
  } else {
    sAlt("<p>It’s a nice relaxed atmosphere.</p>", "<p>气氛轻松愉快。</p>");
  }
  sAlt(
    "<p>You’ve just time for a final drink before catching the bus. What will it be?</p>",
    "<p>赶公交之前还有时间来最后一杯。喝什么好呢？</p>",
  );
  if (thursday) {
    sAlt(
      "<p>ROBERT: How about just a quick nightcap? A liqueur, anyone, just to toast friendship?</p>",
      "<p>罗伯特：不如再来一小杯睡前酒？来点利口酒，为友谊干一杯？</p>",
    );
    digestMolly(30);
    proc += 30;
    sAlt(
      "<p>He gets four liqueurs and you drink a toast.</p>",
      "<p>他买了四杯餐后利口酒，你们举杯共饮。</p>",
    );
    cAlt("pavilion9", "And then it’s time to leave.", "然后到了该离开的时候了。");
  } else {
    sAlt(
      "<p>Bruno is a real ale enthusiast, and he’s been looking at the row of tempting pumps on the bar.</p>",
      "<p>布鲁诺是英式艾尔啤酒爱好者，一直在打量吧台上那排让人心动的啤酒龙头。</p>",
    );
    sAlt(
      "<p>BRUNO: There are some interesting beers here. They’ve got a Riddles Ambernectar. I’d quite like to try it. Molly?</p>",
      "<p>布鲁诺：这里有些很有意思的啤酒。他们有里德尔斯琥珀花蜜啤酒，我很想尝尝。莫莉，你呢？</p>",
    );
    sAlt(
      "<p>MOLLY: I’d like to try it. Just a quick half, perhaps?</p>",
      "<p>莫莉：我也想试试。就来半品脱，怎么样？</p>",
    );
    sAlt(
      "<p>Bruno goes up to the bar and gets four halves of Riddles Ambernectar. It’s a lovely golden beer. You all like it.</p>",
      "<p>布鲁诺走到吧台，点了四杯半品脱的里德尔斯琥珀花蜜啤酒。那是一款色泽迷人的金黄色啤酒，大家都很喜欢。</p>",
    );
    mollyproc += 100;
    mollyblad += 30;
    proc += 100;
    cAlt("pavilion9", "You drink up.", "你把酒喝完。");
  }
}
function pavilion9() {
  sAlt(
    "<p>You drink up and get ready to leave. Molly and Diane look at each other.</p>",
    "<p>你们喝完最后一口，准备离开。莫莉和黛安互相对视了一眼。</p>",
  );
  if (blad > 500) {
    sAlt(
      "<p>DIANE: Have we girls got time to pop to the loo?</p>",
      "<p>黛安：我们女生还有时间去一下厕所吗？</p>",
    );
    sAlt("<p>What will it be?</p>", "<p>你怎么说？</p>");
    cAlt("pavilion10", "Yes, you’ve plenty of time.", "好，你们有的是时间。");
    cAlt("notime", "No, there isn’t really time.", "不，真的没时间了。");
    if (luckshots >= 1) cAlt("luckytrip6", "Play a luckshot.", "使用幸运机会。");
  } else {
    sAlt(
      "<p>Molly looks at Diane. You hear her whisper, ‘D’you need the loo?’ but Diane shakes her head.</p>",
      "<p>莫莉看着黛安。你听见她低声问道：“你要去厕所吗？”但黛安摇了摇头。</p>",
    );
    cAlt("pavilion9a", "You get ready to leave.", "你准备好离开了。");
  }
}
function pavilion9a() {
  sAlt("<p>You leave the Pavilion.</p>", "<p>你们离开了凉亭酒吧。</p>");
  cAlt("busqueue", "And head for the bus stop.", "然后朝公交站走去。");
}
function pavilion10() {
  sAlt(
    "<p>You tell Diane and Molly you’ll wait for them while they pop to the loo. After all, you wouldn’t want Diane to be uncomfortable on the journey home, would you?</p>",
    "<p>你告诉黛安和莫莉，你们会等她们去一下厕所再走。毕竟，你可不希望黛安在回家路上憋得难受，对吧？</p>",
  );
  sAlt(
    "<p>They head off and return a few minutes later chatting and looking relaxed.</p>",
    "<p>她们去了，几分钟后有说有笑地回来，看起来轻松多了。</p>",
  );
  mollyblad = 0;
  getinti(10);
  afterpee();
  sAlt(
    "<p>Diane takes your arm and you all leave the Pavilion.</p>",
    "<p>黛安挽起你的手臂，你们一行人离开了凉亭酒吧。</p>",
  );
  cAlt("busqueue", "You look for the bus stop.", "你寻找公交站。");
}
function notime() {
  sAlt(
    "<p>You tell Molly and Diane that you really need to be hurrying along if you are to catch the bus.</p>",
    "<p>你告诉莫莉和黛安，要赶上公交车的话得抓紧时间了。</p>",
  );
  if (blad > 700) {
    sAlt(
      "<p>Diane says she really <em>has</em> to go and she’ll be as quick as possible. She and Molly head for the loo.</p>",
      "<p>黛安说她真的<em>非去不可</em>，会尽量快。她和莫莉向厕所走去。</p>",
    );
    sAlt(
      "<p>They head off and return a few minutes later chatting and looking relaxed.</p>",
      "<p>她们去了，几分钟后有说有笑地回来，看起来轻松多了。</p>",
    );
    mollyblad = 0;
    getinti(-10);
    afterpee();
    sAlt("<p>You leave the Pavilion.</p>", "<p>你们离开了凉亭酒吧。</p>");
  } else {
    sAlt(
      "<p>Diane says that ‘it’s not urgent’ and she’ll wait till she gets home.</p>",
      "<p>黛安说“不是很急”，回家再上厕所就行了。</p>",
    );
    sAlt("<p>You all leave the Pavilion.</p>", "<p>你们一起离开了凉亭酒吧。</p>");
  }
  cAlt("busqueue", "You look for the bus stop.", "你寻找公交站。");
}
function luckytrip6() {
  if (luckshots >= 1) {
    sAlt(
      "<p>Diane and Molly have gone to the loo and you’ve played a luckshot.</p>",
      "<p>黛安和莫莉去了厕所，而你使用了一次幸运机会。</p>",
    );
    spendLuckshot();
    sAlt(
      "<p>You don’t know what will happen. Maybe the toilet will be out of order? Maybe there’ll be a queue?</p>",
      "<p>不知道会发生什么——也许厕所坏了？也许排着长队？</p>",
    );
    cAlt("luckytrip6a", "Wait and see.", "静观其变。");
  } else {
    sAlt("<p>You don’t have any luckshots!</p>", "<p>你没有幸运机会了！</p>");
    cAlt("gameover", "You are disqualified.", "你被取消资格了。");
  }
}
function luckytrip6a() {
  sAlt(
    "<p>Diane and Molly are heading for the Ladies. You’d like to see what would happen if you stopped them. So you’ve played a luckshot.</p>",
    "<p>黛安和莫莉正向女厕所走去。你很想看看如果阻止她们会发生什么，于是使用了一次幸运机会。</p>",
  );
  if (saturday) {
    sAlt(
      "<p>There’s been a bit of an argument in the Ladies, with a couple of girls who’ve drunk too much. As a result, the Ladies is closed for a few minutes while the staff sort things out. Diane and Molly decide they can’t wait that long and return without having had a pee.</p>",
      "<p>女厕所里有两个喝多了的女孩和人吵了起来。女厕所因此暂时关闭几分钟，等工作人员处理。黛安和莫莉觉得等不了那么久，于是没能上成厕所就回来了。</p>",
    );
    sAlt("<p>‘We’ll just have to wait,’ they say.</p>", "<p>“只能憋着了，”她们说。</p>");
    sAlt("<p>You all leave the Pavilion.</p>", "<p>你们一起离开了凉亭酒吧。</p>");
  } else if (tuesday) {
    sAlt(
      "<p>They’ve already locked the door from the beer garden into the Pavilion, so there isn’t access to the Ladies. Sorry. The girls have to return disappointed.</p>",
      "<p>从啤酒花园通往凉亭酒吧的门已经锁上了，根本进不去女厕所。没办法，两个女孩只得失望地回来了。</p>",
    );
    sAlt("<p>‘We’ll just have to wait,’ they say.</p>", "<p>“只能憋着了，”她们说。</p>");
    sAlt("<p>You all leave the Pavilion.</p>", "<p>你们一起离开了凉亭酒吧。</p>");
  } else {
    sAlt(
      "<p>There is just time for them to visit the toilets. Your luckshot hasn’t worked.</p>",
      "<p>她们还是赶上了去洗手间的时间。你的幸运机会没起作用。</p>",
    );
    mollyblad = 0;
    afterpee();
    sAlt("<p>The girls return looking relaxed.</p>", "<p>两个女孩回来时看起来轻松多了。</p>");
    sAlt("<p>You all leave the Pavilion.</p>", "<p>你们一起离开了凉亭酒吧。</p>");
  }
  cAlt("busqueue", "You look for the bus stop.", "你寻找公交站。");
}
function riversidepath() {
  sAlt(
    "<p>You are walking along with Robert. The girls are walking ahead – you have dropped back a bit because Robert was taking photographs. But the girls now stop, to let you catch up.</p>",
    "<p>你和罗伯特并肩走着。两个女孩走在前面——你们稍微落后了一些，因为罗伯特在拍照。不过女孩们现在停下来等你们赶上。</p>",
  );
  digestMolly(30);
  if (blad > 650) {
    sAlt(
      "<p>They are giggling, but this stops as you catch them up. Molly is grinning, but Diane looks a bit sheepish. She is trying to look nonchalant, but crosses one leg over the other, then bends forward slightly, pretending to brush some dirt off her skirt.</p>",
      "<p>她们在窃笑，但你们一靠近她们就收起笑声了。莫莉咧着嘴笑，而黛安看起来有些不自在。她努力装作若无其事，却悄悄地把两腿交叉夹在一起，然后微微向前弯腰，假装在掸裙子上的灰尘。</p>",
    );
    sAlt(
      "<p>The girls are standing close to some steps. They lead down onto a path, a bit like a towpath, which runs right beside the river. About fifty yards on is a bridge across the river. The towpath goes underneath the bridge, but the path you are on connects with the bridge itself.</p>",
      "<p>女孩们站在一处台阶旁边。台阶通向一条小径，有点像河边的纤道，紧挨着河流延伸。大约五十码外有一座横跨河流的桥。纤道从桥下穿过，而你们所走的路则直通桥面。</p>",
    );
    sAlt(
      "<p>MOLLY: We’re just popping down here for a minute. We’ll catch you up in a couple of minutes.</p>",
      "<p>莫莉：我们就下去一会儿。几分钟后就追上你们了。</p>",
    );
    sAlt("<p>ROBERT: Do you want us to come along too?</p>", "<p>罗伯特：要我们一起去吗？</p>");
    sAlt("<p>There’s a hint of mischief in his voice.</p>", "<p>他语气里带着一丝促狭。</p>");
    sAlt("<p>MOLLY: No! We’ll catch you up.</p>", "<p>莫莉：不用！你们先走，我们追过来。</p>");
    sAlt(
      "<p>You and Robert walk on. After about 20 yards you look back. Diane is beginning to go down the steps, but Molly has paused at the top, as if to make sure you are walking away. She waves at you, then starts to go down. You carry on walking.</p>",
      "<p>你和罗伯特继续向前走。走了大约二十码后你回头看了一眼。黛安已经开始往台阶下走，但莫莉停在台阶顶上，似乎在确认你们是否真的走开了。她向你挥了挥手，然后也开始往下走。你继续向前走。</p>",
    );
    sAlt(
      "<p>ROBERT: I think your friend’s going for a pee.</p>",
      "<p>罗伯特：我觉得你朋友是去上厕所了。</p>",
    );
    sAlt(
      "<p>You wish you could watch them, but you obviously can’t while you’re with Robert. Is there any point in playing a luckshot?</p>",
      "<p>你真希望能看见她们，但和罗伯特在一起显然不行。使用一次幸运机会有用吗？</p>",
    );
    if (luckshots >= 1) cAlt("luckytrip3", "Yes, I will use a luckshot.", "好，我要用幸运机会。");
    cAlt("riversidepath11", "No, I’ll save that for later.", "不，先留着，待会儿再用。");
  } else cAlt("riversidepath10a", "You carry on walking.", "你们继续走着。");
}
function riversidepath10a() {
  sAlt(
    "<p>You chat about this and you chat about that.</p>",
    "<p>你们东聊西聊，什么都聊了一点。</p>",
  );
  cAlt("riversidepath11a", "You carry on walking.", "你们继续走着。");
}
function riversidepath11() {
  sAlt(
    "<p>You imagine the girls down on the towpath. You wish you could watch.</p>",
    "<p>你想象着两个女孩在纤道上的样子，真希望能亲眼瞧瞧。</p>",
  );
  sAlt("<p>You walk slowly until they catch you up.</p>", "<p>你们慢慢走，等她们追上来。</p>");
  mollyblad = 0;
  afterpee();
  cAlt(
    "riversidepath11a",
    "Maybe you’ll get a chance to watch Diane later.",
    "也许待会儿你还有机会看黛安。",
  );
}
function riversidepath11a() {
  sAlt("<p>You carry on walking, the four of you.</p>", "<p>你们四个人继续走着。</p>");
  cAlt("riversidepath12x", "Walking and chatting.", "边走边聊。");
}
function riversidepath12x() {
  sAlt("<p>And chatting and walking.</p>", "<p>边聊边走。</p>");
  cAlt("riverside14", "Chatting and walking.", "边聊边走。");
}
function luckytrip3() {
  if (luckshots >= 1) {
    sAlt(
      "<p>The girls have gone down onto the towpath, probably because Diane wants a pee. You’d like to watch but you’re in company. So you’ve played a luckshot.</p>",
      "<p>女孩们走下了纤道，大概是因为黛安憋不住了，要去方便。你很想看，但旁边有人。于是你使用了一次幸运机会。</p>",
    );
    spendLuckshot();
    sAlt(
      "<p>Robert touches your arm. ‘You want to watch, I want to watch.’ He hurries along the path, with you close behind. He’s as keen as you are!</p>",
      "<p>罗伯特碰了碰你的手臂，说：“你想看，我也想看。”他加快脚步沿路走去，你紧随其后。他和你一样迫不及待！</p>",
    );
    sAlt(
      "<p>ROBERT: She’ll have to go under the bridge. It’s the one place where people can’t see her.</p>",
      "<p>罗伯特：她得去桥底下才行。那是唯一一个别人看不见她的地方。</p>",
    );
    sAlt(
      "<p>You don’t cross the bridge but carry on past it for about 30 yards. You look around. A few steps away is a little recess in the wall. You move over to this, almost on tiptoe, and find you have a clear view down onto the towpath. There is a security street light down there.</p>",
      "<p>你没有过桥，而是继续往前，走过桥头又走了大约三十码。你四下张望。几步远处，墙边有个凹进去的小角落。你几乎踮着脚尖走了过去，发现从这里可以清楚地俯瞰下方的纤道。纤道上亮着一盏路灯。</p>",
    );
    sAlt(
      "<p>The girls are just arriving below the bridge. They’re looking around, but there is a lone cyclist slowly pedalling along the path.</p>",
      "<p>两个女孩正走到桥下。她们四处张望，但纤道上有一个骑手正慢悠悠地骑着自行车路过。</p>",
    );
    cAlt("underbridge", "You watch with bated breath.", "你屏息凝视。");
  } else {
    sAlt("<p>You don’t have any luckshots.</p>", "<p>你没有幸运机会了。</p>");
    cAlt("gameover", "You are disqualified.", "你被取消资格了。");
  }
}
function underbridge() {
  sAlt(
    "<p>You watch the two girls under the bridge. They are having to wait while somebody goes slowly past on a bike.</p>",

      "<p>Bloody Hell! He’s fixed up a hidden camera in the bathroom, relaying direct to his laptop. You knew he was a computer geek, but this is ridiculous.</p>",
      "<p>我的老天！他在浴室里装了一个隐藏摄像头，直接传输到他的笔记本上。你早知道他是个电脑狂人，但这也太荒唐了吧。</p>",

      "<p>Suddenly you hear your name called. You go to the foot of the stairs – Diane is looking down, with a rueful look. ‘I can’t find the light switch,’ she says.</p>",
      "<p>突然你听到有人叫你的名字。你走到楼梯口——黛安从楼上往下望，脸上带着一丝无奈。她说：“找不到灯的开关。”</p>",

    sAlt(
      "<p>YOU: It’s behind the door. The cord hanging down.</p>",
      "<p>你：在门后面。那根垂下来的拉绳。</p>",

    sAlt(
      "<p>You start going up the stairs, but by the time you are halfway up, she says, ‘Found it,’ and the bathroom light goes on. The door shuts and you hear it being locked.</p>",
      "<p>你开始上楼，走到一半，她说了声：“找到了。”浴室的灯亮了。门关上，接着传来锁门的声音。</p>",

      "<p>You tiptoe up the stairs. You hear the rustle of her clothing and then a loud tinkle as she begins to pee.</p>",

    );

      sAlt(
        "<p>After a few seconds there seems to be a pause and you hear a definite sigh of relief. Then the tinkling begins again in earnest. It goes on for a good half minute and after the last few drops you hear a ‘Phew.’ She really needed to go!</p>",

      );

      sAlt(
        "<p>You listen to the tinkle of her pee into the toilet. It goes on for almost half a minute, then there is a pause, and then some quieter tinkling.</p>",
        "<p>你听着她尿进马桶里的水声。声音持续了将近半分钟，稍稍停顿后，又响起了一阵轻些的水声。</p>",
      );

    sAlt(
      "<p>You hear her tearing off some toilet paper and you creep back down the stairs again and wait for Diane. She comes downstairs looking relaxed.</p>",
      "<p>你听到她撕厕纸的声音，悄悄溜回楼下等黛安。她下楼来，神情放松。</p>",
    );

      "<p>DIANE: I’d better be going home. It’s getting late.</p>",
      "<p>黛安：我该回家了。有点晚了。</p>",
    );

      "<p>你说你送她回家，她微笑着答应了。她向你弟弟道了别。</p>",
    );
    cAlt("walkhomeX", "You get ready.", "你准备好了。");
  }
}
function hiddencamera() {
  sAlt(
    "<p>The camera must be placed right across the bathroom from the toilet as it gives a good view. For a moment it all seems very dark but suddenly the room is illuminated as Diane finds the light switch.</p>",
    "<p>摄像头应该是装在浴室里正对马桶的位置，视角相当好。画面起初一片漆黑，但很快黛安找到了灯的开关，整个房间霎时亮了起来。</p>",
  );
  if (blad > 720) {

function sofatrains1a() {
