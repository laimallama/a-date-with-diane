<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root {
  color-scheme: light;
  --paper: #fffaf2;
  --ink: #231f20;
  --muted: #71675c;
  --line: #dfd1bd;
  --accent: #9b2f3f;
  --accent-dark: #6f1f2c;
  --accent-strong: #6f1f2c;
  --choice: #fff;
  --choice-hover: #fff3df;
  --status: #f1e7d8;
  --hover-border: #c59c73;
  --highlight-bg: #f7e2e5;
  --em-color: #6f4a58;
  --box-shadow: 0 18px 50px rgba(59, 43, 25, .14);
  --box-shadow-mobile: 0 10px 28px rgba(59, 43, 25, .10);
  --body-bg-wash: linear-gradient(180deg, rgba(255,255,255,.70), rgba(255,255,255,.35)), #e9dcc8;
  --overlay-scrim: rgba(35, 31, 32, .55);
  --body-font: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", Arial, Helvetica, sans-serif;
  --ui-font: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", Arial, Helvetica, sans-serif;
}

:root[data-theme="dark"] {
    color-scheme: dark;
    --paper: #221c17;
    --ink: #ede3d3;
    --muted: #a4917c;
    --line: #3c2f26;
    --accent: #b5475a;
    --accent-dark: #e2919d;
    --accent-strong: #8a3040;
    --choice: #2b241e;
    --choice-hover: #3a2f26;
    --status: #241e18;
    --hover-border: #c9a06e;
    --highlight-bg: #3a1f26;
    --em-color: #c9a3ae;
    --box-shadow: 0 18px 50px rgba(0, 0, 0, .45);
    --box-shadow-mobile: 0 10px 28px rgba(0, 0, 0, .4);
    --body-bg-wash: linear-gradient(180deg, rgba(0,0,0,.35), rgba(0,0,0,.10)), #171310;
    --overlay-scrim: rgba(0, 0, 0, .7);
}

* { box-sizing: border-box; }

html {
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

body {
  margin: 0;
  min-height: 100vh;
  color: var(--ink);
  background: var(--body-bg-wash);
  font-family: var(--body-font);
  font-size: 18px;
  line-height: 1.58;
}

a { color: inherit; }
a:hover { color: var(--accent); }

.game-shell {
  width: min(920px, calc(100% - 32px));
  margin: 0 auto;
  padding: 36px 0;
}

#box {
  width: 100%;
  padding: clamp(22px, 4vw, 44px);
  border: 1px solid var(--line);
  background: var(--paper);
  box-shadow: var(--box-shadow);
  text-size-adjust: 100%;
  -webkit-text-size-adjust: 100%;
}

#box p {
  font-size: 1em;
  margin: 0 0 1em;
}

#box p.notice {
  margin: 1.15rem 0 1.2rem;
}

#box p.ending-congrats {
  margin: .25rem 0 .85rem;
  color: var(--accent-dark);
  font-size: clamp(1.25rem, 3vw, 1.65rem);
  line-height: 1.25;
}

#box p.venue-note {
  margin: .35rem 0 .4rem;
  color: var(--accent-dark);
  font-family: var(--ui-font);
  font-size: 1.06em;
  font-weight: 600;
  line-height: 1.4;
}

#box p.venue-note strong,
#box p.venue-note b {
  color: inherit;
  font-weight: 600;
}

#box hr {
  height: 1px;
  margin: 1.35rem 0;
  border: 0;
  background: var(--line);
}

#box h1,
#box h2 {
  margin: .2rem 0 1rem;
  color: var(--accent-dark);
  font-family: var(--ui-font);
  letter-spacing: 0;
}

#box h1 { font-size: clamp(1.8rem, 4vw, 2.75rem); }
#box h1.game-title {
  font-family: var(--body-font);
}
#box h2 { font-size: clamp(1.25rem, 3vw, 1.85rem); }

#box div[align="center"],
#box .center {
  text-align: left;
}

#box span[style] {
  background: transparent !important;
  color: inherit !important;
}

#box em {
  color: var(--em-color);
}

#box strong,
#box b {
  color: var(--accent-dark);
}

#box ul,
#box .choices {
  margin: 1.45rem 0 0;
  padding: 0;
  list-style: none;
}

.choice + .choice {
  margin-top: 10px;
}

/* Screen fade on step change */
@keyframes diane-screen-fade {
  from { opacity: .42; }
  to { opacity: 1; }
}
#box.screen-fade {
  animation: diane-screen-fade .18s ease-out;
}
@media (prefers-reduced-motion: reduce) {
  #box.screen-fade { animation: none; }
}

#box li {
  margin: 0;
  padding: 0;
  list-style: none;
}

#box li::marker { content: ""; }

#box li a,
.choice,
.back-button {
  display: block;
  width: 100%;
  min-height: 44px;
  padding: 11px 14px;
  border: 1px solid var(--line);
  border-radius: 6px;
  color: var(--ink);
  background: var(--choice);
  font-family: var(--ui-font);
  font-size: 1rem;
  line-height: 1.35;
  text-align: left;
  text-decoration: none;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.choice.key-pressed {
  border-color: var(--hover-border);
  background: var(--choice-hover);
  color: var(--accent-dark);
}

@media (hover: hover) and (pointer: fine) {
  #box li a:hover,
  .choice:hover,
  .back-button:hover {
    border-color: var(--hover-border);
    background: var(--choice-hover);
    color: var(--accent-dark);
  }
}

.status-bar {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
  gap: 8px;
  margin-top: 24px;
  padding: 12px;
  border: 1px solid var(--line);
  background: var(--status);
  font-family: var(--ui-font);
  font-size: .92rem;
}

.status-bar span {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  color: var(--muted);
}

.status-bar b {
  color: var(--ink);
}

.nav-row {
  margin-top: 24px;
}

.back-button {
  width: auto;
  min-width: 120px;
  color: #fff;
  background: var(--accent);
  border-color: var(--accent);
  text-align: center;
}

@media (hover: hover) and (pointer: fine) {
  .back-button:hover {
    color: #fff;
    background: var(--accent-strong);
    border-color: var(--accent-strong);
  }
}

@media (max-width: 640px) {
  body { font-size: 16px; }
  .game-shell {
    width: 100%;
    padding: 10px 12px 16px;
  }
  #box {
    box-shadow: var(--box-shadow-mobile);
  }
}
.status-bar {
  display: block;
}

.status-row {
  display: grid;
  gap: 8px;
}

.status-row-main {
  grid-template-columns: repeat(3, minmax(0, 1fr));
}

.status-row-money {
  grid-template-columns: repeat(3, minmax(0, 1fr));
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px solid var(--line);
}

@media (max-width: 520px) {
  .status-bar {
    padding: 10px 8px;
    font-size: .78rem;
  }
  .status-row {
    gap: 6px;
  }
  .status-bar span {
    min-width: 0;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    text-align: center;
    overflow-wrap: anywhere;
  }
}

.game-toolbar {
  display: flex;
  justify-content: flex-start;
  gap: 10px;
  margin-bottom: 16px;
}

@media (max-width: 640px) {
  .game-toolbar {
    padding: 0;
    margin-bottom: 10px;
  }
}

.choice.guide-highlight {
  border-color: var(--accent);
  box-shadow: 0 0 0 2px var(--accent) inset;
  background: var(--highlight-bg);
}

.gallery-button {
  flex: 0 0 auto;
  min-width: 94px;
  padding: 9px 12px;
  border: 1px solid var(--accent);
  border-radius: 6px;
  color: #fff;
  background: var(--accent);
  font-family: var(--ui-font);
  font-size: .94rem;
  cursor: pointer;
}
.gallery-button:hover {
  background: var(--accent-strong);
  border-color: var(--accent-strong);
}

.gallery-overlay {
  position: fixed;
  inset: 0;
  background: var(--overlay-scrim);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  opacity: 0;
  pointer-events: none;
  transition: opacity .25s ease;
  z-index: 50;
}
.gallery-overlay.open {
  opacity: 1;
  pointer-events: auto;
}
.gallery-panel {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 8px;
  width: 100%;
  max-width: 560px;
  max-height: 82vh;
  display: flex;
  flex-direction: column;
  box-shadow: 0 20px 60px rgba(0, 0, 0, .35);
  transform: translateY(14px) scale(.98);
  transition: transform .25s ease;
}
.gallery-overlay.open .gallery-panel {
  transform: translateY(0) scale(1);
}
.gallery-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px 20px 12px;
  border-bottom: 1px solid var(--line);
}
.gallery-header h2 {
  margin: 0;
  font-size: 1.2rem;
  font-family: var(--ui-font);
}
.gallery-close {
  border: 1px solid var(--line);
  background: var(--choice);
  color: var(--ink);
  border-radius: 6px;
  padding: 6px 12px;
  font-family: var(--ui-font);
  cursor: pointer;
}
.gallery-close:hover {
  border-color: var(--hover-border);
  background: var(--choice-hover);
}
.gallery-scroll {
  overflow-y: auto;
  padding: 4px 20px 20px;
}
.gallery-section h3 {
  margin: 16px 0 6px;
  font-size: .95rem;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: .04em;
  font-family: var(--ui-font);
}
.gallery-list {
  display: flex;
  flex-direction: column;
}
.gallery-row {
  display: block;
  width: 100%;
  text-align: left;
  background: none;
  border: none;
  border-bottom: 1px solid var(--line);
  padding: 10px 4px;
  font-family: var(--ui-font);
  font-size: .95rem;
  color: var(--ink);
  cursor: pointer;
}
.gallery-row:hover {
  background: var(--choice-hover);
  color: var(--accent-dark);
}

.guide-toggle-button {
  width: auto;
  min-width: 120px;
  padding: 11px 14px;
  border: 1px solid var(--accent);
  border-radius: 6px;
  font-family: var(--ui-font);
  font-size: 1rem;
  text-align: center;
  cursor: pointer;
}
.guide-toggle-on {
  background: var(--choice);
  color: var(--accent-dark);
}
.guide-toggle-off {
  background: transparent;
  color: var(--muted);
  border-color: var(--line);
}
.guide-toggle-button:hover {
  background: var(--choice-hover);
  border-color: var(--accent-dark);
}

.theme-toggle-button {
  width: auto;
  min-width: 120px;
  padding: 9px 12px;
  border: 1px solid var(--accent);
  border-radius: 6px;
  font-family: Georgia, "Times New Roman", serif;
  font-size: .94rem;
  text-align: center;
  cursor: pointer;
  background: transparent;
  color: var(--muted);
}

.theme-toggle-on {
  background: var(--choice);
  color: var(--accent-dark);
}

.theme-toggle-off {
  background: transparent;
  color: var(--muted);
  border-color: var(--line);
}

@media (hover: hover) and (pointer: fine) {
  .theme-toggle-button:hover {
    background: var(--choice-hover);
    border-color: var(--accent-dark);
  }
}

.nav-row {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

/* Matched control sizing only (colors stay as each button already defines) */
.gallery-button,
.language-toggle,
.back-button,
.guide-toggle-button,
.theme-toggle-button {
  box-sizing: border-box;
  min-height: 44px;
  padding: 10px 14px;
  font-size: 1rem;
  line-height: 1.25;
}
</style>

function snapshotGame() {
  var state = {};
  for (var i = 0; i < gameStateVars.length; i++) {
    var key = gameStateVars[i];
    state[key] = (typeof window[key] === "undefined") ? 0 : window[key];
  }
  return { state: state, html: document.getElementById('box').innerHTML };
}

function restoreGame(snapshot) {
  for (var i = 0; i < gameStateVars.length; i++) {
    var key = gameStateVars[i];
    window[key] = snapshot.state[key];
  }
  document.getElementById('box').innerHTML = snapshot.html;
}




function prefersReducedMotion() {
  try {
    return !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
  } catch (e) { return false; }
}

function presentScreen() {
  try {
    if (typeof window.scrollTo === "function") window.scrollTo(0, 0);
    var box = document.getElementById("box");
    if (!box) return;
    box.classList.remove("screen-fade");
    if (prefersReducedMotion()) return;
    void box.offsetWidth;
    box.classList.add("screen-fade");
    var clearFade = function () { try { box.classList.remove("screen-fade"); } catch (e2) {} };
    if (typeof box.addEventListener === "function") {
      box.addEventListener("animationend", clearFade, { once: true });
    }
    setTimeout(clearFade, 220);
  } catch (e) {}
}

function goback() {
  if (!gameHistory.length) return;
  var snapshot = gameHistory.pop();
  var g = guideHistory.pop();
  restoreGame(snapshot);
  if (g) {
    guideIndex = g.index;
    guideActive = g.active;
  }
  try { document.getElementById('gameToolbar').style.display = (currentTag && currentTag !== "under18") ? '' : 'none'; } catch (e) {}
  syncGuideDisplay();
  presentScreen();
}

function pressGuidedChoice() {
  if (!(typeof guideActive !== "undefined" && guideActive && typeof guideOn !== "undefined" && guideOn)) return;
  var btn = document.querySelector("#box button.choice.guide-highlight");
  if (!btn || btn.offsetParent === null) return;
  if (btn.classList.contains("key-pressed")) return;
  btn.classList.add("key-pressed");
  setTimeout(function () {
    if (document.body.contains(btn)) { btn.click(); }
  }, 120);
}

function pressChoiceByNumber(n) {
  var all = document.querySelectorAll("#box button.choice");
  var buttons = [];
  for (var i = 0; i < all.length; i++) {
    if (all[i].offsetParent !== null) buttons.push(all[i]);
  }
  var idx = n - 1;
  if (idx < 0 || idx >= buttons.length) return;
  var btn = buttons[idx];
  if (btn.classList.contains("key-pressed")) return;
  btn.classList.add("key-pressed");
  setTimeout(function () {
    if (document.body.contains(btn)) { btn.click(); }
  }, 120);
}

if (document.addEventListener) {
  document.addEventListener("keydown", function (e) {
    if (e.ctrlKey || e.metaKey || e.altKey || e.repeat) return;
    var overlay = document.getElementById("galleryOverlay");
    var galleryOpen = !!(overlay && overlay.classList.contains("open"));
    if (e.key === "Escape") {
      if (galleryOpen) { closeGallery(); }
      return;
    }
    if (e.key === "g" || e.key === "G") {
      if (galleryOpen) { closeGallery(); return; }
      var galleryBtn = document.getElementById("galleryToggle");
      if (galleryBtn && galleryBtn.offsetParent !== null) { openGallery(); }
      return;
    }
    if (galleryOpen) return;
    if (e.key === "b" || e.key === "B") {
      if (document.querySelector(".back-button")) { goback(); }
      return;
    }
    if (e.key === "h" || e.key === "H") {
      if (document.querySelector(".guide-toggle-button")) { toggleGuideDisplay(); }
      return;
    }
    if (e.key === "Enter") {
      var tag = (e.target && e.target.tagName) ? e.target.tagName.toLowerCase() : "";
      if (tag === "input" || tag === "textarea" || tag === "select") return;
      if (!(typeof guideActive !== "undefined" && guideActive && typeof guideOn !== "undefined" && guideOn)) return;
      e.preventDefault();
      pressGuidedChoice();
      return;
    }
    if (/^[1-9]$/.test(e.key)) {
      pressChoiceByNumber(parseInt(e.key, 10));
      return;
    }
  });
}

function navRow() {
  if (!gameHistory.length) return "";
  var back = "<button class='back-button' onclick='goback()'>返回</button>";
  var toggle = guideActive ? "<button class='guide-toggle-button" + (guideOn ? " guide-toggle-on" : " guide-toggle-off") + "' onclick='toggleGuideDisplay()'>" + (guideOn ? "引导：开启" : "引导：关闭") + "</button>" : "";
  return "<div class='nav-row'>" + back + toggle + "</div>";
}

function toggleGuideDisplay() {
  guideOn = !guideOn;
  syncGuideDisplay();
}

var darkMode = false;

function toggleTheme() {
  darkMode = !darkMode;
  document.documentElement.setAttribute("data-theme", darkMode ? "dark" : "light");
  var btn = document.getElementById("themeToggle");
  if (btn) {
    btn.textContent = darkMode ? "深色模式：开启" : "深色模式：关闭";
    btn.className = "theme-toggle-button" + (darkMode ? " theme-toggle-on" : " theme-toggle-off");
  }
}

function syncGuideDisplay() {
  try {
    var hls = document.querySelectorAll("button.choice.guide-highlight");
    for (var i = 0; i < hls.length; i++) { hls[i].className = hls[i].className.replace(/\s*guide-highlight/, ""); }
    if (guideOn) applyGuideHighlight();
    var toggles = document.querySelectorAll(".guide-toggle-button");
    for (var i = 0; i < toggles.length; i++) {
      toggles[i].textContent = guideOn ? "引导：开启" : "引导：关闭";
      toggles[i].className = "guide-toggle-button" + (guideOn ? " guide-toggle-on" : " guide-toggle-off");
    }
  } catch (e) {}
}

var guideTags = null;
var guideIndex = 0;
var guideActive = false;
var guideOn = false;
var guideHistory = [];

function initGuideFromStorage() {
  try {
    var raw = sessionStorage.getItem("dianeGuide");
    if (!raw) return;
    sessionStorage.removeItem("dianeGuide");
    var data = JSON.parse(raw);
    guideTags = data.tags;
    guideIndex = 0;
    guideActive = true;
    guideOn = true;
    var baseLength = data.baseLength || 0;
    for (var i = 0; i < baseLength; i++) {
      go(guideTags[i]);
    }
    syncGuideDisplay();
  } catch (e) {}
}

if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", initGuideFromStorage);
} else {
  initGuideFromStorage();
}
if (window.addEventListener) {
  window.addEventListener("pageshow", function (e) {
    if (e.persisted) initGuideFromStorage();
  });
}

function applyGuideHighlight() {
  if (!guideActive || guideIndex >= guideTags.length) return;
  var expected = guideTags[guideIndex];
  var buttons = document.getElementById("box").querySelectorAll("button.choice");
  for (var i = 0; i < buttons.length; i++) {
    var m = (buttons[i].getAttribute("onclick") || "").match(/go\(['"]([^'"]+)['"]\)/);
    if (m && m[1] === expected) {
      buttons[i].className += " guide-highlight";
    }
  }
}

function renderGalleryLists() {
  var endingsHtml = GALLERY_DATA.endings.map(function (item, i) {
    var title = item.title;
    return "<button class='gallery-row' onclick=\"startGuidedRoute('endings'," + i + ")\">" + (i + 1) + ". " + title + "</button>";
  }).join("");
  var scenesHtml = GALLERY_DATA.hiddenScenes.map(function (item, i) {
    var title = item.title;
    return "<button class='gallery-row' onclick=\"startGuidedRoute('hiddenScenes'," + i + ")\">" + (i + 1) + ". " + title + "</button>";
  }).join("");
  document.getElementById("galleryEndings").innerHTML = endingsHtml;
  document.getElementById("galleryHiddenScenes").innerHTML = scenesHtml;
}

function openGallery() {
  renderGalleryLists();
  document.getElementById("galleryOverlay").classList.add("open");
}

function closeGallery() {
  document.getElementById("galleryOverlay").classList.remove("open");

function startGuidedRoute(kind, index) {
  var item = GALLERY_DATA[kind][index];
  sessionStorage.setItem("dianeGuide", JSON.stringify({ tags: item.tags, baseLength: item.baseLength }));
  location.reload();
}


function hasCjk(text) {
  return /[\u3400-\u9fff]/.test(String(text));
}


function polishChoiceText(desc) {
  var text = String(desc).replace(/\s+/g, " ").trim();
  var lowerFixes = {
    "further information": "更多说明。",
    "back to start": "返回主菜单。",
    "yes,promise": "好，我保证。",
    "go ahead": "开始游戏。",
    "ok": "OK",
    "okay": "OK"
  };
  var key = text.replace(/<[^>]+>/g, "").toLowerCase();
  if (lowerFixes[key]) return lowerFixes[key];

  text = text.replace(/^([a-z])/, function (m) { return m.toUpperCase(); });
  text = text
    .replace(/\s+([,.;:!?，。！？；：])/g, "$1")
    .replace(/([。！？；：])\./g, "$1")
    .replace(/([!?])\./g, "$1")
    .replace(/!{2,}/g, "!")
    .replace(/！{2,}/g, "！")
    .replace(/？{2,}/g, "？")
    .replace(/\bcarpark\b/gi, "car park");

  var visible = text.replace(/<[^>]+>/g, "").trim();
  var noPunctuation = /^(OK|Back|返回|Atrás)$/i.test(visible) ||
    /£/.test(visible) ||
    /英镑/.test(visible) ||
    /\([^)]+\)$/.test(visible) ||
    /（[^）]+）$/.test(visible) ||
    /^(A bottle of|Ravioli|Tortelloni|Lasagne|Spaghetti|A spicy|Steak|Tiramisu|Panna cotta|Ice cream)/i.test(visible);
  if (!noPunctuation && !/[.!?…:;)"'”’\-—。！？；：）】》»]$/.test(visible)) {
    text += hasCjk(visible) ? "。" : ".";
  }
  return smartenHtml(text);
}

function c(tag, desc) {
  if (!ulopen) {
    document.getElementById('box').innerHTML += "<div class='choices'>";
  }
  ulopen = 1;
  desc = polishChoiceText(desc);
  document.getElementById('box').innerHTML += "<button class='choice' onclick=\"go('" + tag + "')\">" + desc + "</button>";

function smartenText(text) {
  return String(text)
    .replace(/(^|[\s([{—-])'(\d{2}s\b)/g, "$1’$2")
    .replace(/"([^"]+)"/g, "“$1”")
    .replace(/([A-Za-z0-9])'([A-Za-z0-9])/g, "$1’$2")
    .replace(/(^|[\s([{—-])'([^']+)'/g, "$1“$2”")
    .replace(/(^|[\s([{—-])'(?=\w)/g, "$1‘")
    .replace(/'/g, "’");
}

function smartenHtml(html) {
  return String(html).split(/(<[^>]*>)/g).map(function (part) {
    return part.charAt(0) === "<" ? part : smartenText(part);
  }).join("");
}

function isChineseSpeechAside(text) {
  var clean = String(text)
    .replace(/[（）()]/g, "")
    .replace(/[\s。.!?！？：:，,；;、]+$/g, "")
    .trim();
  if (!hasCjk(clean)) return false;
  if (/^(压低声音|低声|轻声|轻声说|声音|几乎|停顿|停顿片刻后|回想着|想了想|考虑了一下|顿了顿|咯咯笑道|笑着说|哽咽着|极轻地|紧张地|苦涩地|苦中带笑|沉默片刻后|脸红|咬着嘴唇)/.test(clean)) return true;
  return /^(她|他|你|我|两人|大家)/.test(clean) &&
    /(说|问|喊|笑|看|望|捏|握|停|顿|脸红|咧|哽|喘|咬|靠|站|坐|走|听|低声|轻声|耳语|嘀咕|喃喃|声音|语气|神情|表情|想|回想|考虑|打断|捂|扶|摇|点头|沉默|苦涩|担忧|换重心)/.test(clean);
}

function wrapChineseSpeechAsides(html) {
  return String(html)
    .replace(/(：)\s*<em>([^<]{1,48})<\/em>\s*[。.!?！？]?/g, function (match, colon, aside) {
      var clean = aside.replace(/[（）()]/g, "").replace(/[\s。.!?！？：:，,；;、]+$/g, "").trim();
      return isChineseSpeechAside(aside) ? colon + "<em>（" + clean + "）</em> " : match;
    })
    .replace(/(：[^<]{0,180})<em>([^<]{1,80})<\/em>(\s*(?:[—-]|[\u3400-\u9fffA-Za-z0-9]))/g, function (match, prefix, aside, after) {
      var clean = aside.replace(/[（）()]/g, "").replace(/[\s。.!?！？：:，,；;、]+$/g, "").trim();
      return isChineseSpeechAside(aside) ? prefix + "<em>（" + clean + "）</em>" + after : match;
    })
    .replace(/([\u3400-\u9fffA-Za-z]+)\s*<em>([^<]{1,48})<\/em>\s*：/g, function (match, speaker, aside) {
      var clean = aside.replace(/[（）()]/g, "").replace(/[\s。.!?！？：:，,；;、]+$/g, "").trim();
      return isChineseSpeechAside(aside) ? speaker + "：<em>（" + clean + "）</em> " : match;
    });
}

function isEnglishSpeechAside(text) {
  var clean = String(text)
    .replace(/[()]/g, "")
    .replace(/\s+/g, " ")
    .replace(/[\s.,!?;:]+$/g, "")
    .trim();
  if (!clean || /[\u3400-\u9fff]/.test(clean)) return false;
  if (/^(i|i’m|i'm|you|we|what|where|why|how|oh|oooh|god|give|sorry|stop|don’t|don't)\b/i.test(clean)) return false;
  return /^(then\s+)?(with|in|almost|after|before|aside|softly|ruefully|laughing|giggling|giggles|blushing|biting|hugging|looking|considering|between|very|quietly|thinks|thinking|pauses|pausing|whispers|whispering|interrupting|joking|she|he|you)\b/i.test(clean);
}

function formatEnglishSpeechAside(text) {
  var clean = String(text).replace(/[()]/g, "").replace(/[\s.,!?;:]+$/g, "").trim();
  return clean ? clean.charAt(0).toUpperCase() + clean.slice(1) : clean;
}

function isRomanceSpeechAside(text) {

function formatRomanceSpeechAside(text) {

function wrapEnglishSpeechAsides(html) {

function polishStoryHtml(html) {
  html = html
    .replace(/\s+([,.;:!?，。！？；：])/g, "$1")
    .replace(/([!?。！？])\s*(<\/[^>]+>)\./g, "$1$2")
    .replace(/\s+(<\/(?:em|strong|span)>)([,.!?;:])/gi, "$1$2")
    .replace(/([。！？；：])\./g, "$1")
    .replace(/([!?])\./g, "$1")
    .replace(/!{2,}/g, "!")
    .replace(/！{2,}/g, "！")
    .replace(/？{2,}/g, "？")
    .replace(/\b(YOU|DIANE|MOLLY|BRUNO|ROBERT|CHLOE|AMANDA)::+/g, "$1:")
    .replace(/\bcarpark\b/gi, "car park")
    .replace(/\.{4,}/g, "...")
    .replace(/([A-Za-z0-9])\.\.(?!\.)/g, "$1.")
    .replace(/<em><span[^>]*>\s*<\/span>\.*<\/em>/gi, "")
    .replace(/<em><span[^>]*>\s*<\/em>/gi, "")
    .replace(/<span>\.{2,}/gi, "")
    .replace(/<\/span>\.{2,}/gi, "</span>")
    .replace(/<p>\s*(YOU|DIANE|MOLLY|BRUNO|ROBERT|CHLOE|AMANDA)\s+(?!(?:HAVE\s+WON)\b)(?=(?:<em>|[A-Z]))/g, "<p>$1: ")
    .replace(/<p>\s*(Diane|Molly|Chloe|Amanda)\s*<em>/g, "<p>$1: <em>");
  html = wrapChineseSpeechAsides(wrapEnglishSpeechAsides(html));

  var visible = html
    .replace(/<[^>]+>/g, " ")
    .replace(/&nbsp;/g, " ")
    .replace(/\s+/g, " ")
    .trim();

  if (/^(A Date with Diane|与黛安约会|Una cita con Diane|Un rendez-vous avec Diane)$/i.test(visible) && /^<h1\b/i.test(html)) {
    return smartenHtml(html.replace(/^<h1\b/i, "<h1 class='game-title'"));
  }
  if (/^<p>\s*<strong\b/i.test(html) && visible.length < 140) {
    return smartenHtml(html.replace(/^<p\b/i, "<p class='venue-note'"));
  }
  if (!visible || !/^<p(?:\s|>)/i.test(html)) return smartenHtml(html);
  if (/^(CONGRATULATIONS!|恭喜你！|¡ENHORABUENA!|FÉLICITATIONS\s*!|FÉLICITATIONS !)$/i.test(visible)) {
    return smartenHtml(html.replace(/^<p\b/i, "<p class='ending-congrats'"));
  }
  if (/^[A-Z0-9\s'’:-]+$/.test(visible) && visible.length < 45) return smartenHtml(html);
  if (/[.!?…:;)"'”’\-—。！？；：）】》»]$/.test(visible)) return smartenHtml(html);

  return smartenHtml(html.replace(/(\s*(?:<\/[^>]+>\s*)*)$/, (hasCjk(visible) ? "。" : ".") + "$1"));
}

function normaliseLegacyHtml(html) {
  return String(html)
    .replace(/<P>\s*<LI>/gi, "<p>")
    .replace(/<LI>/gi, "<p>")
    .replace(/<\/LI>/gi, "</p>")
    .replace(/<P>/gi, "<p>")
    .replace(/<\/P>/gi, "</p>")
    .replace(/<P\s*\/>/gi, "</p>")
    .replace(/<H1>/gi, "<h1>")
    .replace(/<\/H1>/gi, "</h1>")
    .replace(/<H2>/gi, "<h2>")
    .replace(/<\/H2>/gi, "</h2>")
    .replace(/<STRONG>/gi, "<strong>")
    .replace(/<\/STRONG>/gi, "</strong>")
    .replace(/<EM>/gi, "<em>")
    .replace(/<\/EM>/gi, "</em>")
    .replace(/<B>/gi, "<b>")
    .replace(/<\/B>/gi, "</b>")
    .replace(/<SPAN/gi, "<span")
    .replace(/<\/SPAN(?=<\/em>)/gi, "</span>")
    .replace(/<\/SPAN>/gi, "</span>")
    .replace(/<div align=['"]center['"]>/gi, "<div class='center'>");
}

function ensureStoryBlock(html) {
  var text = String(html).trim();
  if (!text) return html;
  text = text.replace(/^\(<p>/i, "<p>(");
  if (/^<(?:p|h1|h2|div|aside|hr)\b/i.test(text)) return text;
  return "<p>" + text + "</p>";
}

function balanceLegacyHtml(html) {
  var allowed = { p: 1, em: 1, strong: 1, span: 1, b: 1, h1: 1, h2: 1, div: 1 };
  var stack = [];
  var out = "";
  var last = 0;
  var tagRe = /<\/?([a-z][a-z0-9]*)(?:\s[^>]*)?>/gi;
  var match;
  while ((match = tagRe.exec(html))) {
    var full = match[0];
    var tag = match[1].toLowerCase();
    if (!allowed[tag] || /\/>$/.test(full)) continue;
    if (full.charAt(1) !== "/") {
      out += html.slice(last, tagRe.lastIndex);
      stack.push(tag);
      last = tagRe.lastIndex;
      continue;
    }
    var index = stack.lastIndexOf(tag);
    if (index < 0) {
      out += html.slice(last, match.index);
      last = tagRe.lastIndex;
      continue;
    }
    out += html.slice(last, match.index);
    while (stack.length - 1 > index) {
      out += "</" + stack.pop() + ">";
    }
    out += full;
    stack.pop();
    last = tagRe.lastIndex;
  }
  out += html.slice(last);
  while (stack.length) out += "</" + stack.pop() + ">";
  return out;
