<!doctype html>
<html lang="zh-CN">
  <head>
    <title>与黛安约会</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <style>
      :root { --cjk-font: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", Arial, Helvetica, sans-serif; }
:root {
  color-scheme: light;
  --paper: #fffaf2;
  --ink: #231f20;
  --muted: #71675c;
  --line: #dfd1bd;
  --accent: #9b2f3f;
  --accent-dark: #6f1f2c;
  --accent-strong: #6f1f2c;
  --on-accent: #ffffff;
  --choice: #fff;
  --choice-hover: #fff3df;
  --guide-hover-bg: #fff3df;
  --status: #f1e7d8;
  --hover-border: #c59c73;
  --highlight-bg: #f7e2e5;
  --ink-on-hover: #231f20;
  --em-color: #6f4a58;
  --box-shadow: 0 18px 50px rgba(59, 43, 25, 0.14);
  --box-shadow-mobile: 0 10px 28px rgba(59, 43, 25, 0.1);
  --body-bg-wash: #f8f5ef;
  --overlay-scrim: rgba(35, 31, 32, 0.55);
  --body-font: var(--cjk-font);
  --ui-font: var(--cjk-font);
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #221c17;
  --ink: #ede3d3;
  --muted: #9b9289;
  --line: #3c2f26;
  --accent: #f0d060;
  --accent-dark: #f0d060;
  --accent-strong: #f6e48a;
  --on-accent: #221c17;
  --choice: #2b241e;
  --choice-hover: #534433;
  --guide-hover-bg: #5f4c32;
  --status: #2f2822;
  --hover-border: #c9a94a;
  --highlight-bg: #4a4024;
  --ink-on-hover: #faf6ee;
  --em-color: #e2c878;
  --box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
  --box-shadow-mobile: 0 10px 28px rgba(0, 0, 0, 0.4);
  --body-bg-wash: #120f0c;
  --overlay-scrim: rgba(0, 0, 0, 0.7);
}

* {
  box-sizing: border-box;
}

html {
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
  background: var(--body-bg-wash);
}

body {
  margin: 0;
  min-height: 100vh;
  color: var(--ink);
  background: var(--body-bg-wash);
  font-family: var(--body-font);
  font-size: 18px;
  line-height: 1.58;
}

a {
  color: inherit;
}
a:hover {
  color: var(--accent-dark);
}

.game-shell {
  width: min(920px, calc(100% - 32px));
  margin: 0 auto;
  padding: 36px 0;
}

#box {
  width: 100%;
  overflow-wrap: break-word;
  padding: clamp(22px, 4vw, 44px);
  border: 1px solid var(--line);
  background: var(--paper);
  box-shadow: var(--box-shadow);
  text-size-adjust: 100%;
  -webkit-text-size-adjust: 100%;
}

#box p {
  font-size: 1em;
  margin: 0 0 1em;
}

#box p.notice {
  margin: 0 0 1em;
}

/* Mid-page points notices: same rhythm as story paragraphs */
#box p:has(+ p.notice) {
  margin-bottom: 1em;
}

#box p.ending-congrats {
  margin: 0.25rem 0 1em;
  color: var(--accent-dark);
  font-size: clamp(1.25rem, 3vw, 1.65rem);
  line-height: 1.25;
}

#box p.note-lead,
#box p.note-keys {
  margin: 0 0 0.5em;
  line-height: 1.45;
}

#box p.note-keys:last-of-type {
  margin-bottom: 1em;
}

#box p.venue-note {
  margin: 0.35rem 0 0.4rem;
  color: var(--accent-dark);
  font-family: var(--ui-font);
  font-size: 1.06em;
  font-weight: 600;
  line-height: 1.4;
}

#box p.venue-note strong,
#box p.venue-note b {
  color: inherit;
  font-weight: 600;
}

#box hr {
  height: 1px;
  margin: 1.35rem 0;
  border: 0;
  background: var(--line);
}

#box h1,
#box h2 {
  margin: 0.2rem 0 1rem;
  color: var(--accent-dark);
  font-family: var(--ui-font);
  letter-spacing: 0;
}

#box h1 {
  font-size: clamp(1.8rem, 4vw, 2.75rem);
}
#box h1.game-title {
  font-family: var(--body-font);
}
#box h2 {
  font-size: clamp(1.25rem, 3vw, 1.85rem);
}

#box div[align="center"],
#box .center {
  text-align: left;
}

#box span[style] {
  background: transparent !important;
  color: inherit !important;
}

#box em {
  color: var(--em-color);
}

#box strong,
#box b {
  color: var(--accent-dark);
}

#box ul,
#box .choices {
  margin: 1.45rem 0 0;
  padding: 0;
  list-style: none;
}

.choice + .choice {
  margin-top: 10px;
}

/* Screen fade on step change */
@keyframes diane-screen-fade {
  from {
    opacity: 0.42;
  }
  to {
    opacity: 1;
  }
}
#box.screen-fade {
  animation: diane-screen-fade 0.18s ease-out;
}
@media (prefers-reduced-motion: reduce) {
  html {
    scroll-behavior: auto;
  }
  #box.screen-fade {
    animation: none !important;
  }
  .gallery-overlay,
  .gallery-panel {
    transition: none !important;
  }
}

#box li {
  margin: 0;
  padding: 0;
  list-style: none;
}

#box li::marker {
  content: "";
}

#box li a,
.choice,
.back-button {
  display: block;
  width: 100%;
  min-height: 44px;
  padding: 11px 14px;
  border: 1px solid var(--line);
  border-radius: 6px;
  color: var(--ink);
  background: var(--choice);
  font-family: var(--ui-font);
  font-size: 1rem;
  line-height: 1.35;
  text-align: left;
  text-decoration: none;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

.choice.key-pressed {
  border-color: var(--hover-border);
  background: var(--choice-hover);
  color: var(--ink-on-hover);
}

@media (hover: hover) and (pointer: fine) {
  #box:not(.choice-key-armed) li a:hover,
  #box:not(.choice-key-armed) .choice:hover {
    border-color: var(--hover-border);
    background: var(--choice-hover);
    color: var(--ink-on-hover);
  }
  /* Guide pick: keep accent inset; fill uses --guide-hover-bg (dark: step off gold tray, not into ink range) */
  #box:not(.choice-key-armed) .choice.guide-highlight:hover {
    border-color: var(--hover-border);
    background: var(--guide-hover-bg);
    color: var(--ink-on-hover);
  }
}

.status-bar {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
  gap: 8px;
  margin-top: 24px;
  padding: 12px;
  border: 1px solid var(--line);
  background: var(--status);
  font-family: var(--ui-font);
  font-size: 0.92rem;
}

.status-bar span {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  color: var(--muted);
}

.status-bar b {
  color: var(--ink);
}

.nav-row {
  margin-top: 24px;
}

.back-button {
  width: auto;
  min-width: 120px;
  color: var(--on-accent);
  background: var(--accent);
  border-color: var(--accent);
  text-align: center;
}

@media (hover: hover) and (pointer: fine) {
  .back-button:hover {
    color: var(--on-accent);
    background: var(--accent-strong);
    border-color: var(--accent-strong);
  }
}

@media (max-width: 640px) {
  body {
    font-size: 16px;
  }
  .game-shell {
    width: 100%;
    padding: 10px 12px 16px;
  }
  #box {
    box-shadow: var(--box-shadow-mobile);
  }
}
.status-bar {
  display: block;
}

.status-row {
  display: grid;
  gap: 8px;
}

.status-row-main {
  grid-template-columns: repeat(3, minmax(0, 1fr));
}

.status-row-money {
  grid-template-columns: repeat(3, minmax(0, 1fr));
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px solid var(--line);
}

@media (max-width: 520px) {
  .status-bar {
    padding: 10px 10px;
    font-size: 0.78rem;
  }
  .status-row {
    gap: 6px;
  }
  .status-bar span {
    min-width: 0;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    text-align: center;
    overflow-wrap: break-word;
    word-break: keep-all;
  }
}

.game-toolbar {
  display: flex;
  justify-content: flex-start;
  gap: 10px;
  margin-bottom: 16px;
}

@media (max-width: 640px) {
  .game-toolbar {
    padding: 0;
    margin-bottom: 10px;
    align-items: center;
    flex-wrap: wrap;
  }
  .theme-toggle-button {
    min-width: 0;
    height: 44px;
    min-height: 44px;
    padding: 8px 10px;
    font-size: 0.78rem;
    line-height: 1.15;
    white-space: nowrap;
  }
}

.choice.guide-highlight {
  border-color: var(--accent);
  box-shadow: 0 0 0 2px var(--accent) inset;
  background: var(--highlight-bg);
}

.choice.guide-highlight.key-pressed {
  border-color: var(--hover-border);
  background: var(--guide-hover-bg);
  color: var(--ink-on-hover);
}

.gallery-button {
  flex: 0 0 auto;
  min-width: 94px;
  padding: 9px 12px;
  border: 1px solid var(--accent);
  border-radius: 6px;
  color: var(--on-accent);
  background: var(--accent);
  font-family: var(--ui-font);
  font-size: 0.94rem;
  cursor: pointer;
}
.gallery-button:hover {
  background: var(--accent-strong);
  border-color: var(--accent-strong);
}

.gallery-overlay {
  position: fixed;
  inset: 0;
  background: var(--overlay-scrim);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s ease;
  z-index: 50;
}
.gallery-overlay.open {
  opacity: 1;
  pointer-events: auto;
}
.gallery-panel {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 8px;
  width: 100%;
  max-width: 560px;
  max-height: 82vh;
  display: flex;
  flex-direction: column;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
  transform: translateY(14px) scale(0.98);
  transition: transform 0.25s ease;
}
.gallery-overlay.open .gallery-panel {
  transform: translateY(0) scale(1);
}
.gallery-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px 20px 12px;
  border-bottom: 1px solid var(--line);
}
.gallery-header h2 {
  margin: 0;
  font-size: 1.2rem;
  font-family: var(--ui-font);
}
.gallery-close {
  border: 1px solid var(--line);
  background: var(--choice);
  color: var(--ink);
  border-radius: 6px;
  min-height: 44px;
  padding: 10px 12px;
  font-family: var(--ui-font);
  cursor: pointer;
  touch-action: manipulation;
}
.gallery-close:hover {
  border-color: var(--hover-border);
  background: var(--choice-hover);
}
.gallery-scroll {
  overflow-y: auto;
  padding: 4px 20px 20px;
}
.gallery-section h3 {
  margin: 16px 0 6px;
  font-size: 0.95rem;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.04em;
  font-family: var(--ui-font);
}
.gallery-list {
  display: flex;
  flex-direction: column;
}
.gallery-list {
  --gallery-num-w: 1.85rem;
  --gallery-num-gap: 0.35rem;
}
.gallery-row {
  -webkit-appearance: none;
  appearance: none;
  display: grid;
  grid-template-columns: var(--gallery-num-w) minmax(0, 1fr) auto;
  column-gap: var(--gallery-num-gap);
  align-items: center;
  width: 100%;
  min-height: 44px;
  text-align: left;
  background: none;
  border: none;
  border-bottom: 1px solid var(--line);
  padding: 0 4px 0 2px;
  line-height: 1.3;
  font-family: var(--ui-font);
  font-size: 0.95rem;
  color: var(--ink);
  cursor: pointer;
  touch-action: manipulation;
}
.gallery-index {
  width: var(--gallery-num-w);
  text-align: right;
  font-variant-numeric: tabular-nums;
  color: inherit;
  line-height: inherit;
}
.gallery-title {
  min-width: 0;
  color: inherit;
  line-height: inherit;
}
.gallery-list > .gallery-row:last-child,
.gallery-list > .gallery-group:last-child > .gallery-row {
  border-bottom: none;
}
.gallery-list > .gallery-group:last-child > .gallery-group-toggle.gallery-group-open {
  border-bottom: 1px solid var(--line);
}
.gallery-list > .gallery-group:last-child .gallery-variants:not([hidden]) .gallery-row:last-child {
  border-bottom: none;
}
.gallery-row:hover {
  background: var(--choice-hover);
  color: var(--accent);
}
.gallery-row:focus {
  outline: none;
}
.gallery-row:focus-visible {
  background: var(--choice-hover);
  color: var(--accent);
}
.gallery-group-toggle::after {
  content: "▸";
  opacity: 0.55;
}
.gallery-group-toggle.gallery-group-open::after {
  content: "▾";
}
.gallery-variants {
  margin: 0 0 4px 0;
}
.gallery-variant {
  font-size: 0.9rem;
}

.guide-toggle-button {
  width: auto;
  min-width: 120px;
  padding: 11px 14px;
  border: 1px solid var(--accent);
  border-radius: 6px;
  font-family: var(--ui-font);
  font-size: 1rem;
  text-align: center;
  cursor: pointer;
}
.guide-toggle-on {
  background: var(--choice);
  color: var(--accent-dark);
}
.guide-toggle-off {
  background: transparent;
  color: var(--muted);
  border-color: var(--line);
}
.guide-toggle-button:hover {
  color: var(--ink-on-hover);
  background: var(--choice-hover);
  border-color: var(--accent-dark);
}

.climax-skip-button {
  width: auto;
  min-width: 140px;
  padding: 11px 14px;
  border: 1px solid var(--accent);
  border-radius: 6px;
  font-family: var(--ui-font);
  font-size: 1rem;
  text-align: center;
  cursor: pointer;
  background: var(--choice);
  color: var(--accent-dark);
}

.climax-skip-button:hover {
  background: var(--choice-hover);
  border-color: var(--accent-dark);
}

.theme-toggle-button {
  width: auto;
  min-width: 0;
  margin-left: auto;
  padding: 9px 12px;
  border: 1px solid var(--accent);
  border-radius: 6px;
  font-family: var(--ui-font);
  font-size: 0.94rem;
  text-align: center;
  cursor: pointer;
  background: transparent;
  color: var(--muted);
}

.theme-toggle-on {
  background: var(--choice);
  color: var(--accent-dark);
}

.theme-toggle-off {
  background: transparent;
  color: var(--muted);
  border-color: var(--line);
}

@media (hover: hover) and (pointer: fine) {
  .theme-toggle-button:hover {
    color: var(--ink-on-hover);
    background: var(--choice-hover);
    border-color: var(--accent-dark);
  }
}

.nav-row {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

/* Matched control sizing only (colors stay as each button already defines) */
.gallery-button,
.language-toggle,
.back-button,
.guide-toggle-button,
.climax-skip-button,
.theme-toggle-button {
  box-sizing: border-box;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  min-height: 44px;
  padding: 10px 14px;
  font-size: 1rem;
  line-height: 1.25;
  touch-action: manipulation;
}
@media (max-width: 640px) {
  .theme-toggle-button {
    min-width: 0;
    height: 44px;
    min-height: 44px;
    padding: 8px 10px;
    font-size: 0.78rem;
    line-height: 1.15;
    white-space: nowrap;
  }
}

button:focus,
.choice:focus,
.back-button:focus,
.gallery-button:focus,
.language-toggle:focus,
.guide-toggle-button:focus,
.climax-skip-button:focus,
.theme-toggle-button:focus {
  outline: none;
}

/* Restore a visible keyboard focus indicator after the pointer-focus reset. */
button:focus-visible,
button[class]:focus-visible,
a[href]:focus-visible,
[tabindex]:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
}

function storytime() {
  if (tiramisu) {

      "<p>黛安：嗯，上大学的时候，我常和朋友进城玩，会喝点酒。然后我坐公共汽车回家，到站下车的时候往往就很想去厕所。这倒也还好，因为只有半英里的路要走。但有一天，天气特别冷，那股寒意像是直往膀胱里钻。我当时憋得难受极了，偏偏还在车上碰到了一个学校认识的男生。他一路上和我聊天，还要陪我走回家。我挺喜欢他的，但那一刻真的不是时候。要是独自一人，我早就躲进路边草丛里撒尿了，可有他在场根本不行。我那会儿难受极了。</p>",

    );
    s("<p>你：你忍住了吗？</p>");

      "<p>黛安：几个月前，我和三个闺蜜去荷兰参加一个婚前派对。我们喝了不少，正走路回酒店。大家都想上厕所，但其中一个朋友真的快忍不住了。我们看到对面有个厕所，结果是男厕，里面全是小便池。不管了，琳达已经憋到了极限，她说“将就一下吧”，干脆把内裤拨到一边，在小便池里尿了。我们笑得东倒西歪，另外两个女生也跟着去了。我这时候也尿急得难受，真的很想去，但问题是我穿的是长裤。</p>",

        <div class="gallery-scroll">
          <div class="gallery-section">
            <h3>结局</h3>
            <div id="galleryEndings" class="gallery-list"></div>
          </div>
          <div class="gallery-section">
            <h3>隐藏场景</h3>
            <div id="galleryHiddenScenes" class="gallery-list"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="game-shell">
      <div id="gameToolbar" class="game-toolbar" style="display: none">
        <button id="galleryToggle" class="gallery-button" onclick="openGallery()" type="button">
          剧情图鉴
        </button>
        <button
          id="themeToggle"
          class="theme-toggle-button theme-toggle-off"
          onclick="toggleTheme()"
          type="button"
        >
          深色模式：关闭
        </button>
      </div>
      <div id="box" aria-live="polite" aria-atomic="true"></div>
    </div>
  </body>
</html>
