<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root {
  color-scheme: light;
  --paper: #fffaf2;
  --ink: #231f20;
  --muted: #71675c;
  --line: #dfd1bd;
  --accent: #9b2f3f;
  --accent-dark: #6f1f2c;
  --choice: #fff;
  --choice-hover: #fff3df;
  --status: #f1e7d8;
}

* { box-sizing: border-box; }

html {
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

body {
  margin: 0;
  min-height: 100vh;
  color: var(--ink);
  background:
    linear-gradient(180deg, rgba(255,255,255,.70), rgba(255,255,255,.35)),
    #e9dcc8;
  font-family: Georgia, "Times New Roman", serif;
  font-size: 18px;
  line-height: 1.58;
}

a { color: inherit; }
a:hover { color: var(--accent); }

.game-shell {
  width: min(920px, calc(100% - 32px));
  margin: 0 auto;
  padding: 34px 0 44px;
}

#box {
  width: 100%;
  min-height: 68vh;
  padding: clamp(22px, 4vw, 44px);
  border: 1px solid var(--line);
  background: var(--paper);
  box-shadow: 0 18px 50px rgba(59, 43, 25, .14);
  text-size-adjust: 100%;
  -webkit-text-size-adjust: 100%;
}

#box p {
  font-size: 1em;
  margin: 0 0 1em;
}

#box p.notice {
  margin: 1.15rem 0 1.2rem;
}

#box p.ending-congrats {
  margin: .25rem 0 .85rem;
  color: var(--accent-dark);
  font-size: clamp(1.25rem, 3vw, 1.65rem);
  line-height: 1.25;
}

#box p.venue-note {
  margin: .35rem 0 .4rem;
  color: var(--accent-dark);
  font-family: Georgia, "Times New Roman", serif;
  font-size: 1.06em;
  font-weight: 600;
  line-height: 1.4;
}

#box p.venue-note strong,
#box p.venue-note b {
  color: inherit;
  font-weight: 600;
}

#box hr {
  height: 1px;
  margin: 1.35rem 0;
  border: 0;
  background: var(--line);
}

#box h1,
#box h2 {
  margin: .2rem 0 1rem;
  color: var(--accent-dark);
  font-family: Georgia, "Times New Roman", serif;
  letter-spacing: 0;
}

#box h1 { font-size: clamp(1.8rem, 4vw, 2.75rem); }
#box h1.game-title {
  font-family: Georgia, "Times New Roman", serif;
}
#box h2 { font-size: clamp(1.25rem, 3vw, 1.85rem); }

#box div[align="center"],
#box .center {
  text-align: left;
}

#box span[style] {
  background: transparent !important;
  color: inherit !important;
}

#box em {
  color: #6f4a58;
}

#box strong,
#box b {
  color: var(--accent-dark);
}

#box ul,
#box .choices {
  display: grid;
  gap: 10px;
  margin: 1.45rem 0 0;
  padding: 0;
  list-style: none;
}

#box li {
  margin: 0;
  padding: 0;
  list-style: none;
}

#box li::marker { content: ""; }

#box li a,
.choice,
.back-button {
  display: block;
  width: 100%;
  min-height: 44px;
  padding: 11px 14px;
  border: 1px solid var(--line);
  border-radius: 6px;
  color: var(--ink);
  background: var(--choice);
  font-family: Georgia, "Times New Roman", serif;
  font-size: 1rem;
  line-height: 1.35;
  text-align: left;
  text-decoration: none;
  cursor: pointer;
}

#box li a:hover,
.choice:hover,
.back-button:hover {
  border-color: #c59c73;
  background: var(--choice-hover);
  color: var(--accent-dark);
}

.status-bar {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
  gap: 8px;
  margin-top: 24px;
  padding: 12px;
  border: 1px solid var(--line);
  background: var(--status);
  font-family: Georgia, "Times New Roman", serif;
  font-size: .92rem;
}

.status-bar span {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  color: var(--muted);
}

.status-bar b {
  color: var(--ink);
}

.nav-row {
  margin-top: 12px;
}

.back-button {
  width: auto;
  min-width: 120px;
  color: #fff;
  background: var(--accent);
  border-color: var(--accent);
  text-align: center;
}

.back-button:hover {
  color: #fff;
  background: var(--accent-dark);
  border-color: var(--accent-dark);
}

@media (max-width: 640px) {
  body { font-size: 16px; }
  .game-shell {
    width: 100%;
    padding: 0;
  }
  #box {
    min-height: calc(100vh - 108px);
    border-left: 0;
    border-right: 0;
    box-shadow: none;
  }
}
.status-bar {
  display: block;
}

.status-row {
  display: grid;
  gap: 8px;
}

.status-row-main {
  grid-template-columns: repeat(3, minmax(0, 1fr));
}

.status-row-money {
  grid-template-columns: repeat(3, minmax(0, 1fr));
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px solid var(--line);
}

@media (max-width: 520px) {
  .status-bar {
    padding: 10px 8px;
    font-size: .78rem;
  }
  .status-row {
    gap: 6px;
  }
  .status-bar span {
    min-width: 0;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    text-align: center;
    overflow-wrap: anywhere;
  }
}
</style>
</head>
<body>
<script>

var luckshots = 3;

var gameHistory = [];

  "flirted", "tort", "tag", "lasagne", "ravioli", "pizza", "spagbol",

  "bottlewater", "welldonesteak", "mediumsteak", "raresteak", "tuesday",
  "thursday", "saturday", "mollyblad", "mollyproc", "buycappuccino",
  "buyespresso", "buyfiltercoffee", "leavepub1", "leavepub2",
  "musictalking", "theatretalking", "cartalking", "stampstalking",
  "traintalking", "gourinal", "instantcoffee", "nicecoffee",
  "leavechloe", "triedbathroom", "brooch", "gobushes", "gobushes1",

];

function snapshotGame() {
  var state = {};
  for (var i = 0; i < gameStateVars.length; i++) {
    var key = gameStateVars[i];
    state[key] = (typeof window[key] === "undefined") ? 0 : window[key];
  }
  return { state: state, html: document.getElementById('box').innerHTML };
}

function restoreGame(snapshot) {
  for (var i = 0; i < gameStateVars.length; i++) {
    var key = gameStateVars[i];
    window[key] = snapshot.state[key];
  }
  document.getElementById('box').innerHTML = snapshot.html;
}

function goback() {
  if (!gameHistory.length) return;
  var snapshot = gameHistory.pop();
  restoreGame(snapshot);
}

function backbutton() {
  if (!gameHistory.length) return "";
  return "<div class='nav-row'><button class='back-button' onclick='goback()'>Atrás</button></div>";
}

function hasCjk(text) {
  return /[\u3400-\u9fff]/.test(String(text));
}


function polishChoiceText(desc) {
  var text = String(desc).replace(/\s+/g, " ").trim();
  var lowerFixes = {
    "further information": "Más información.",
    "back to start": "Volver al menú principal.",
    "yes,promise": "Sí, lo prometo.",
    "go ahead": "Empezar la partida.",
    "ok": "OK",
    "okay": "OK"
  };
  var key = text.replace(/<[^>]+>/g, "").toLowerCase();
  if (lowerFixes[key]) return lowerFixes[key];

  text = text.replace(/^([a-z])/, function (m) { return m.toUpperCase(); });
  text = text
    .replace(/\s+([,.;:!?，。！？；：])/g, "$1")
    .replace(/([。！？；：])\./g, "$1")
    .replace(/([!?])\./g, "$1")
    .replace(/!{2,}/g, "!")
    .replace(/！{2,}/g, "！")
    .replace(/？{2,}/g, "？")
    .replace(/\bcarpark\b/gi, "car park");

  var visible = text.replace(/<[^>]+>/g, "").trim();
  var noPunctuation = /^(OK|Back|返回|Atrás)$/i.test(visible) ||
    /£/.test(visible) ||
    /英镑/.test(visible) ||
    /\([^)]+\)$/.test(visible) ||
    /（[^）]+）$/.test(visible) ||
    /^(A bottle of|Ravioli|Tortelloni|Lasagne|Spaghetti|A spicy|Steak|Tiramisu|Panna cotta|Ice cream)/i.test(visible);
  if (!noPunctuation && !/[.!?…:;)"'”’\-—。！？；：）】》»]$/.test(visible)) {
    text += hasCjk(visible) ? "。" : ".";
  }
  return smartenHtml(text);
}

function c(tag, desc) {
  if (!ulopen) {
    document.getElementById('box').innerHTML += "<div class='choices'>";
  }
  ulopen = 1;
  desc = polishChoiceText(desc);
  document.getElementById('box').innerHTML += "<button class='choice' onclick=\"go('" + tag + "')\">" + desc + "</button>";
}

function smartenText(text) {
  return String(text)
    .replace(/(^|[\s([{—-])'(\d{2}s\b)/g, "$1’$2")
    .replace(/"([^"]+)"/g, "“$1”")
    .replace(/([A-Za-z0-9])'([A-Za-z0-9])/g, "$1’$2")
    .replace(/(^|[\s([{—-])'([^']+)'/g, "$1“$2”")
    .replace(/(^|[\s([{—-])'(?=\w)/g, "$1‘")
    .replace(/'/g, "’");
}

function smartenHtml(html) {
  return String(html).split(/(<[^>]*>)/g).map(function (part) {
    return part.charAt(0) === "<" ? part : smartenText(part);
  }).join("");
}

function isChineseSpeechAside(text) {
  var clean = String(text)
    .replace(/[（）()]/g, "")
    .replace(/[\s。.!?！？：:，,；;、]+$/g, "")
    .trim();
  if (!hasCjk(clean)) return false;
  if (/^(压低声音|低声|轻声|轻声说|声音|几乎|停顿|停顿片刻后|回想着|想了想|考虑了一下|顿了顿|咯咯笑道|笑着说|哽咽着|极轻地|紧张地|苦涩地|苦中带笑|沉默片刻后|脸红|咬着嘴唇)/.test(clean)) return true;
  return /^(她|他|你|我|两人|大家)/.test(clean) &&
    /(说|问|喊|笑|看|望|捏|握|停|顿|脸红|咧|哽|喘|咬|靠|站|坐|走|听|低声|轻声|耳语|嘀咕|喃喃|声音|语气|神情|表情|想|回想|考虑|打断|捂|扶|摇|点头|沉默|苦涩|担忧|换重心)/.test(clean);
}

function wrapChineseSpeechAsides(html) {
  return String(html)
    .replace(/(：)\s*<em>([^<]{1,48})<\/em>\s*[。.!?！？]?/g, function (match, colon, aside) {
      var clean = aside.replace(/[（）()]/g, "").replace(/[\s。.!?！？：:，,；;、]+$/g, "").trim();
      return isChineseSpeechAside(aside) ? colon + "<em>（" + clean + "）</em> " : match;
    })
    .replace(/(：[^<]{0,180})<em>([^<]{1,80})<\/em>(\s*(?:[—-]|[\u3400-\u9fffA-Za-z0-9]))/g, function (match, prefix, aside, after) {
      var clean = aside.replace(/[（）()]/g, "").replace(/[\s。.!?！？：:，,；;、]+$/g, "").trim();
      return isChineseSpeechAside(aside) ? prefix + "<em>（" + clean + "）</em>" + after : match;
    })
    .replace(/([\u3400-\u9fffA-Za-z]+)\s*<em>([^<]{1,48})<\/em>\s*：/g, function (match, speaker, aside) {
      var clean = aside.replace(/[（）()]/g, "").replace(/[\s。.!?！？：:，,；;、]+$/g, "").trim();
      return isChineseSpeechAside(aside) ? speaker + "：<em>（" + clean + "）</em> " : match;
    });
}

function isEnglishSpeechAside(text) {
  var clean = String(text)
    .replace(/[()]/g, "")
    .replace(/\s+/g, " ")
    .replace(/[\s.,!?;:]+$/g, "")
    .trim();
  if (!clean || /[\u3400-\u9fff]/.test(clean)) return false;
  if (/^(i|i’m|i'm|you|we|what|where|why|how|oh|oooh|god|give|sorry|stop|don’t|don't)\b/i.test(clean)) return false;
  return /^(with|in|almost|after|before|aside|softly|ruefully|laughing|giggling|giggles|blushing|biting|hugging|looking|considering|between|very|quietly|she|he|you)\b/i.test(clean);
}

function formatEnglishSpeechAside(text) {
  var clean = String(text).replace(/[()]/g, "").replace(/[\s.,!?;:]+$/g, "").trim();
  return clean ? clean.charAt(0).toUpperCase() + clean.slice(1) : clean;
}

function isRomanceSpeechAside(text) {
  var clean = String(text)
    .replace(/[()]/g, "")
    .replace(/\s+/g, " ")
    .replace(/[\s.,!?;:¡¿]+$/g, "")
    .trim();
  if (!clean || /[\u3400-\u9fff]/.test(clean)) return false;
  return /^(en voz baja|casi|tras|después|hace una pausa|pausa|pensativa|pensativo|sonriendo|susurr|la oyes|lo oyes|a voz baja|à voix|très doucement|presque|après|songeuse|pensive|vous l’entendez|vous l'entendez|elle marque|pause|puis elle|dans un murmure|en chuchotant)\b/i.test(clean);
}

function formatRomanceSpeechAside(text) {
  var clean = String(text).replace(/[()]/g, "").replace(/[\s.,!?;:¡¿]+$/g, "").trim();
  return clean ? clean.charAt(0).toUpperCase() + clean.slice(1) : clean;
}

function wrapEnglishSpeechAsides(html) {
  return String(html)
    .replace(/(:| :)\s*<em>([^<]{1,80})<\/em>\s*[:.]?\s*/gi, function (match, colon, aside) {
      var clean = isRomanceSpeechAside(aside) ? formatRomanceSpeechAside(aside) : formatEnglishSpeechAside(aside);
      return (isEnglishSpeechAside(aside) || isRomanceSpeechAside(aside)) ? colon + " <em>(" + clean + ")</em> " : match;
    })
    .replace(/(\b(?:YOU|DIANE|MOLLY|BRUNO|ROBERT|CHLOE|AMANDA|Diane|Molly|Bruno|Robert|Chloe|Amanda|TÚ|VOUS)\s*(?::| :)[^<]{0,180})<em>([^<]{1,80})<\/em>(\s*(?:[—-]|[A-ZÀ-ÖØ-öø-ÿ¿¡“]))/g, function (match, prefix, aside, after) {
      var clean = isRomanceSpeechAside(aside) ? formatRomanceSpeechAside(aside) : formatEnglishSpeechAside(aside);
      return (isEnglishSpeechAside(aside) || isRomanceSpeechAside(aside)) ? prefix + "<em>(" + clean + ")</em>" + after : match;
    })
    .replace(/\b(YOU|DIANE|MOLLY|BRUNO|ROBERT|CHLOE|AMANDA|Diane|Molly|Bruno|Robert|Chloe|Amanda|TÚ|VOUS)\s*<em>([^<]{1,80})<\/em>\s*:\s*/g, function (match, speaker, aside) {
      var clean = isRomanceSpeechAside(aside) ? formatRomanceSpeechAside(aside) : formatEnglishSpeechAside(aside);
      return (isEnglishSpeechAside(aside) || isRomanceSpeechAside(aside)) ? speaker + ": <em>(" + clean + ")</em> " : match;
    })
    .replace(/\b(YOU|DIANE|MOLLY|BRUNO|ROBERT|CHLOE|AMANDA|Diane|Molly|Bruno|Robert|Chloe|Amanda|TÚ|VOUS)\s*<em>([^<]{1,80})<\/em>\s+(?=[A-ZÀ-ÖØ-öø-ÿ¿¡“])/g, function (match, speaker, aside) {
      var clean = isRomanceSpeechAside(aside) ? formatRomanceSpeechAside(aside) : formatEnglishSpeechAside(aside);
      return (isEnglishSpeechAside(aside) || isRomanceSpeechAside(aside)) ? speaker + ": <em>(" + clean + ")</em> " : match;
    });
}

function polishStoryHtml(html) {
  html = html
    .replace(/\s+([,.;:!?，。！？；：])/g, "$1")
    .replace(/([!?。！？])\s*(<\/[^>]+>)\./g, "$1$2")
    .replace(/\s+(<\/(?:em|strong|span)>)([,.!?;:])/gi, "$1$2")
    .replace(/([。！？；：])\./g, "$1")
    .replace(/([!?])\./g, "$1")
    .replace(/!{2,}/g, "!")
    .replace(/！{2,}/g, "！")
    .replace(/？{2,}/g, "？")
    .replace(/\b(YOU|DIANE|MOLLY|BRUNO|ROBERT|CHLOE|AMANDA)::+/g, "$1:")
    .replace(/\bcarpark\b/gi, "car park")
    .replace(/\.{4,}/g, "...")
    .replace(/([A-Za-z0-9])\.\.(?!\.)/g, "$1.")
    .replace(/<em><span[^>]*>\s*<\/span>\.*<\/em>/gi, "")
    .replace(/<em><span[^>]*>\s*<\/em>/gi, "")
    .replace(/<span>\.{2,}/gi, "")
    .replace(/<\/span>\.{2,}/gi, "</span>")
    .replace(/<p>\s*(YOU|DIANE|MOLLY|BRUNO|ROBERT|CHLOE|AMANDA)\s+(?!(?:HAVE\s+WON)\b)(?=(?:<em>|[A-Z]))/g, "<p>$1: ")
    .replace(/<p>\s*(Diane|Molly|Chloe|Amanda)\s*<em>/g, "<p>$1: <em>");
  html = wrapChineseSpeechAsides(wrapEnglishSpeechAsides(html));

  var visible = html
    .replace(/<[^>]+>/g, " ")
    .replace(/&nbsp;/g, " ")
    .replace(/\s+/g, " ")
    .trim();

  if (/^(A Date with Diane|与黛安约会|Una cita con Diane|Un rendez-vous avec Diane)$/i.test(visible) && /^<h1\b/i.test(html)) {
    return smartenHtml(html.replace(/^<h1\b/i, "<h1 class='game-title'"));
  }
  if (/^<p>\s*<strong\b/i.test(html) && visible.length < 140) {
    return smartenHtml(html.replace(/^<p\b/i, "<p class='venue-note'"));
  }
  if (!visible || !/^<p(?:\s|>)/i.test(html)) return smartenHtml(html);
  if (/^(CONGRATULATIONS!|恭喜你！|¡ENHORABUENA!|FÉLICITATIONS\s*!|FÉLICITATIONS !)$/i.test(visible)) {
    return smartenHtml(html.replace(/^<p\b/i, "<p class='ending-congrats'"));
  }
  if (/^[A-Z0-9\s'’:-]+$/.test(visible) && visible.length < 45) return smartenHtml(html);
  if (/[.!?…:;)"'”’\-—。！？；：）】》»]$/.test(visible)) return smartenHtml(html);

  return smartenHtml(html.replace(/(\s*(?:<\/[^>]+>\s*)*)$/, (hasCjk(visible) ? "。" : ".") + "$1"));
}

function normaliseLegacyHtml(html) {
  return String(html)
    .replace(/<P>\s*<LI>/gi, "<p>")
    .replace(/<LI>/gi, "<p>")
    .replace(/<\/LI>/gi, "</p>")
    .replace(/<P>/gi, "<p>")
    .replace(/<\/P>/gi, "</p>")
    .replace(/<P\s*\/>/gi, "</p>")
    .replace(/<H1>/gi, "<h1>")
    .replace(/<\/H1>/gi, "</h1>")
    .replace(/<H2>/gi, "<h2>")
    .replace(/<\/H2>/gi, "</h2>")
    .replace(/<STRONG>/gi, "<strong>")
    .replace(/<\/STRONG>/gi, "</strong>")
    .replace(/<EM>/gi, "<em>")
    .replace(/<\/EM>/gi, "</em>")
    .replace(/<B>/gi, "<b>")
    .replace(/<\/B>/gi, "</b>")
    .replace(/<SPAN/gi, "<span")
    .replace(/<\/SPAN(?=<\/em>)/gi, "</span>")
    .replace(/<\/SPAN>/gi, "</span>")
    .replace(/<div align=['"]center['"]>/gi, "<div class='center'>");
}

function ensureStoryBlock(html) {
  var text = String(html).trim();
  if (!text) return html;
  text = text.replace(/^\(<p>/i, "<p>(");
  if (/^<(?:p|h1|h2|div|aside|hr)\b/i.test(text)) return text;
  return "<p>" + text + "</p>";
}

function balanceLegacyHtml(html) {
  var allowed = { p: 1, em: 1, strong: 1, span: 1, b: 1, h1: 1, h2: 1, div: 1 };
  var stack = [];
  var out = "";
  var last = 0;
  var tagRe = /<\/?([a-z][a-z0-9]*)(?:\s[^>]*)?>/gi;
  var match;
  while ((match = tagRe.exec(html))) {
    var full = match[0];
    var tag = match[1].toLowerCase();
    if (!allowed[tag] || /\/>$/.test(full)) continue;
    if (full.charAt(1) !== "/") {
      out += html.slice(last, tagRe.lastIndex);
      stack.push(tag);
      last = tagRe.lastIndex;
      continue;
    }
    var index = stack.lastIndexOf(tag);
    if (index < 0) {
