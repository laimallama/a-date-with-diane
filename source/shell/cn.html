<!doctype html>
<html lang="zh-CN">
  <head>
    <title>与黛安约会</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <style>
      /* ADWD:STYLE */
    </style>
  </head>
  <body>
    <script>
      /* ADWD:SCRIPT */
    </script>

    <div
      id="galleryOverlay"
      class="gallery-overlay"
      role="dialog"
      aria-modal="true"
      aria-labelledby="galleryTitle"
      aria-hidden="true"
      tabindex="-1"
      inert
    >
      <div class="gallery-panel">
        <div class="gallery-header">
          <h2 id="galleryTitle">剧情图鉴</h2>
          <button class="gallery-close" onclick="closeGallery()">关闭</button>
        </div>
        <div class="gallery-scroll">
          <div class="gallery-section">
            <h3>结局</h3>
            <div id="galleryEndings" class="gallery-list"></div>
          </div>
          <div class="gallery-section">
            <h3>隐藏场景</h3>
            <div id="galleryHiddenScenes" class="gallery-list"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="game-shell">
      <div id="gameToolbar" class="game-toolbar" style="display: none">
        <button id="galleryToggle" class="gallery-button" onclick="openGallery()" type="button">
          剧情图鉴
        </button>
        <button
          id="themeToggle"
          class="theme-toggle-button theme-toggle-off"
          onclick="toggleTheme()"
          type="button"
        >
          深色模式：关闭
        </button>
      </div>
      <div id="box" aria-live="polite" aria-atomic="true"></div>
    </div>
  </body>
</html>
